<script>
const { h, render } = preact;
const { useState, useEffect, useMemo, useCallback, useRef } = preactHooks;
const html = htm.bind(h);

// ── Constants ────────────────────────────────────────────────
// Shown at the bottom of Settings so a deploy can be told apart from a stale
// copy on the device. BUMP BOTH ON EVERY DEPLOY — that is the whole point of them.
const APP_VERSION = '2.2';
const APP_BUILD   = '2026-09-05';

const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DAYS   = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
// Soft but saturated — every hue is distinct at swatch size, so no two jobs
// read as the same colour. Greys and near-duplicate blues were dropped.
const COLORS = [
  '#4A9EE0','#2FA8A0','#F2B441','#9B8CEA','#E0568C','#46C08A','#F0803C','#3FB6CC',
  '#7FC4F0','#6FD6C4','#FFD37A','#C3B5F5','#F58BB0','#86D9A8','#FFAE7A','#5FD0E8',
  '#7D9BE8','#B565C9','#C9789F','#D69A5A','#7FA85C','#C4685E','#43A86B','#E8654F','#2C7A5B'
];

// ── Helpers ──────────────────────────────────────────────────
const genId   = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const todayS  = () => new Date().toISOString().slice(0,10);
let _privacy = false;
const fmt     = n  => _privacy ? '₪•••' : '₪' + Math.round(n).toLocaleString('he-IL');
const mDays     = (y,m) => new Date(y,m+1,0).getDate();
function hoursBetween(st,et){
  if(!st||!et) return 0;
  const [sh,sm]=st.split(':').map(Number), [eh,em]=et.split(':').map(Number);
  let mins=(eh*60+em)-(sh*60+sm);
  if(mins<=0) mins+=24*60; // overnight shift
  return Math.round((mins/60)*100)/100;
}
function dateRange(a,b) {
  const s=a<b?a:b, e=a<b?b:a, out=[];
  const cur=new Date(s+'T12:00:00'), end=new Date(e+'T12:00:00');
  while(cur<=end){ out.push(cur.toISOString().slice(0,10)); cur.setDate(cur.getDate()+1); }
  return out;
}

// Module-level Google token. Persisted (short-lived, <1h) so reopening the app stays signed in.
let _gToken = null;
let _gClient = null;
// Token is short-lived (<1h) and drive.file+calendar scoped only; persisted over HTTPS so reopening stays signed in.
const _gPersist = location.protocol==='https:';
try{ const s=JSON.parse(localStorage.getItem('sw_gtok')||'null'); if(s&&typeof s.t==='string'&&s.exp>Date.now()) _gToken=s.t; }catch(e){}
function saveGTok(t){ _gToken=t; if(!_gPersist) return; try{ localStorage.setItem('sw_gtok',JSON.stringify({t,exp:Date.now()+55*60*1000})); }catch(e){} }
function clearGTok(){ _gToken=null; try{ localStorage.removeItem('sw_gtok'); }catch(e){} }
// Calendar deletions are queued so they survive missing/expired tokens and retry later
function enqueueGcalDel(ids){
  try{
    const q=JSON.parse(localStorage.getItem('sw_gcal_del')||'[]');
    localStorage.setItem('sw_gcal_del',JSON.stringify([...new Set([...q,...ids])]));
  }catch(e){}
}
async function processGcalDelQueue(){
  if(!_gToken) return;
  let q=[]; try{ q=JSON.parse(localStorage.getItem('sw_gcal_del')||'[]'); }catch(e){}
  if(!q.length) return;
  const remaining=[];
  for(const id of q){
    try{
      const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/'+encodeURIComponent(id),
        {method:'DELETE',headers:{Authorization:'Bearer '+_gToken}});
      if(!(r.ok||r.status===404||r.status===410)) remaining.push(id);
    }catch(e){ remaining.push(id); }
  }
  try{ localStorage.setItem('sw_gcal_del',JSON.stringify(remaining)); }catch(e){}
}
function deleteGcalEvent(id){
  if(!id) return;
  enqueueGcalDel([id]);
  processGcalDelQueue();
}
async function uploadFileToDrive(file,meta){
  const boundary='-------314159265358979323846';
  const metaPart='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n';
  const filePart='--'+boundary+'\r\nContent-Type: '+(file.type||'application/octet-stream')+'\r\n\r\n';
  const endPart='\r\n--'+boundary+'--';
  const body=new Blob([metaPart,filePart,file,endPart]);
  const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{
    method:'POST',headers:{Authorization:'Bearer '+_gToken,'Content-Type':'multipart/related; boundary='+boundary},body});
  const j=await r.json();
  if(j.error) throw new Error(j.error.message||'שגיאת העלאה');
  return j;
}
async function deleteDriveFile(id){
  if(!id||!_gToken) return;
  try{
    await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+_gToken}});
  }catch(e){}
}

// ── Tax (Israel 2026 estimate) ───────────────────────────────
const BRACKETS  = [{l:7380,r:.10},{l:10620,r:.14},{l:17040,r:.20},{l:22440,r:.31},{l:46640,r:.35},{l:60130,r:.47},{l:1e9,r:.50}];
const CVAL=242, NI_FL=6970, NI_CL=49030;
// Miluim (reserve duty) daily compensation bounds — Bituach Leumi estimates, editable by the user
const MILUIM_MIN_DAY=310, MILUIM_MAX_DAY=1650, MILUIM_COLOR='#7FA85C';

// Google OAuth Client ID (public identifier, baked in; stored overrides are ignored unless valid)
const DEFAULT_GCID='365339624558-7t7arbt13od0i1frr0i3v0ernhsq6mhv.apps.googleusercontent.com';
function activeGcid(settings){
  const v=settings&&settings.gClientId;
  return (typeof v==='string'&&v.trim().endsWith('.apps.googleusercontent.com'))?v.trim():DEFAULT_GCID;
}

// Shared sign-in so any screen can connect in place instead of sending the
// user to Settings and back.
function googleConnect(settings, onDone) {
  const g = window.google && window.google.accounts && window.google.accounts.oauth2;
  if (!g) { alert('ספריית Google טרם נטענה. נסה שוב בעוד רגע.'); return; }
  const cid = activeGcid(settings);
  if (!cid) { alert('חסר Google Client ID בהגדרות.'); return; }
  try {
    g.initTokenClient({
      client_id: cid.trim(),
      scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar.events',
      callback: r => {
        if (r.error) { alert('שגיאת התחברות: ' + r.error); return; }
        saveGTok(r.access_token);
        onDone && onDone(r.access_token);
      }
      // Empty prompt reuses a grant that already exists and only asks when it
      // does not. 'consent' forced the full Google consent screen — and with it
      // the unverified-app warning — on every single sign-in.
    }).requestAccessToken({ prompt: '' });
  } catch(e) { alert('שגיאת התחברות: ' + e.message); }
}

function calcTax(g, pts) {
  let tax=0, prev=0;
  for (const {l,r} of BRACKETS) {
    if (g<=prev) break;
    tax += (Math.min(g,l)-prev)*r; prev=l;
  }
  return Math.max(0, tax - pts*CVAL);
}
function calcNI(g) {
  const c=Math.min(g,NI_CL);
  if (c<=NI_FL) return {ni:c*.004, he:c*.031};
  return {ni:NI_FL*.004+(c-NI_FL)*.07, he:NI_FL*.031+(c-NI_FL)*.05};
}
function calcAll(g,pts,pensionBase) {
  if (!g||g<=0) return {gross:0,incomeTax:0,ni:0,health:0,pension:0,total:0,net:0};
  pts = pts||2.25;
  const pb = pensionBase==null ? g : pensionBase;
  const incomeTax=calcTax(g,pts), {ni,he:health}=calcNI(g), pension=pb*.06;
  const total=incomeTax+ni+health+pension;
  return {gross:g,incomeTax,ni,health,pension,total,net:Math.max(0,g-total)};
}
// Pension in Israel typically starts only after 3 months of employment (then paid retroactively)
function addMonths(dateStr,n){
  const d=new Date(dateStr+'T12:00:00'); d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}
function pensionEligible(job,dateStr){
  if(!job) return true;
  const mode=job.pensionMode||'auto';
  if(mode==='always') return true;
  if(mode==='never') return false;
  if(!job.startDate) return true;
  return dateStr >= addMonths(job.startDate,3);
}

// ── useLS hook ───────────────────────────────────────────────
function useLS(key, def) {
  const [v,setV] = useState(() => {
    try { const s=localStorage.getItem(key); return s ? JSON.parse(s) : def; }
    catch(e) { return def; }
  });
  const set = useCallback(next => {
    setV(prev => {
      const val = typeof next==='function' ? next(prev) : next;
      try { localStorage.setItem(key,JSON.stringify(val)); } catch(e) {}
      return val;
    });
  },[key]);
  return [v,set];
}

// ── findJob helper ───────────────────────────────────────────
function findJob(jobs, id) { return jobs.find(j=>j.id===id)||null; }
// Job colours are user-chosen and now include pastels, so a label must take
// whichever of ink/white actually contrasts against the chosen colour.
function onColor(hex) {
  const h=(hex||'').replace('#','');
  if(h.length!==6) return '#ffffff';
  const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  const L=.2126*f(parseInt(h.slice(0,2),16))+.7152*f(parseInt(h.slice(2,4),16))+.0722*f(parseInt(h.slice(4,6),16));
  return ((L+.05)/.0605) > (1.05/(L+.05)) ? '#0B1017' : '#ffffff';
}
// Travel for a shift: its own value, or fall back to the job's per-day travel (so existing shifts pick it up)
function shiftTravel(s, jobs) {
  if (s.travel!=null && s.travel!==0) return s.travel;
  const j=findJob(jobs,s.jobId);
  return (j&&j.travelPerDay)||0;
}

// ── Security helpers ─────────────────────────────────────────
const escapeHtml = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Only allow http(s) URLs in hrefs (blocks javascript:/data: injected via tampered backups)
function safeUrl(u){ try{ const x=new URL(u); return (x.protocol==='https:'||x.protocol==='http:')?u:null; }catch(e){ return null; } }

// iOS WhatsApp takes either the files or the text from a share, never both,
// so on iPhone the summary has to be part of the picture or it is lost.
const IS_IOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);

// ── Share header card ────────────────────────────────────────
// WhatsApp renders share({files,text}) as "first file, with the text as its
// caption", and nothing web-side can move the text elsewhere (single text
// slot in the Android intent; placement is WhatsApp's hardcoded choice).
// So the first file is a purpose-made letterhead card: the thread opens with
// the card + the summary, then the receipts follow in date order. `body`
// paints the summary onto the card itself, for platforms that drop the text.
async function makeShareCard(period, body){
  try{
    const lines=(body||'').split('\n');
    // HEAD is the letterhead block; the card only grows downward for the body,
    // so the title and logo stay anchored to it instead of drifting into the text
    const LH=52, W=1080, HEAD=400, H=HEAD+(body?lines.length*LH+70:0);
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#3B82F6'; ctx.fillRect(0,0,W,10);
    let tx=W-70;
    // App logo on the right (best effort — the card works without it)
    try{
      const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src='./icon.jpg';});
      const S=170, x=W-70-S, y=(HEAD-S)/2+5, r=36;
      ctx.save(); ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.arcTo(x+S,y,x+S,y+S,r); ctx.arcTo(x+S,y+S,x,y+S,r);
      ctx.arcTo(x,y+S,x,y,r); ctx.arcTo(x,y,x+S,y,r); ctx.closePath(); ctx.clip();
      ctx.drawImage(img,x,y,S,S); ctx.restore();
      tx=x-56;
    }catch(e){}
    ctx.direction='rtl'; ctx.textAlign='right';
    ctx.fillStyle='#0B1017'; ctx.font='bold 84px sans-serif';
    ctx.fillText('סיכום עבודה',tx,HEAD/2-14);
    ctx.fillStyle='#3B82F6'; ctx.font='56px sans-serif';
    ctx.fillText(period,tx,HEAD/2+74);
    if(body){
      ctx.strokeStyle='#E5E7EB'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(70,HEAD-40); ctx.lineTo(W-70,HEAD-40); ctx.stroke();
      let y=HEAD+18;
      lines.forEach(t=>{
        const head=/^סיכום עבודה|^הוצאות להחזר|^סה"כ/.test(t);
        ctx.fillStyle=head?'#0B1017':'#374151';
        ctx.font=(head?'bold ':'')+'40px sans-serif';
        ctx.fillText(t,W-70,y); y+=LH;
      });
    }
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
    return blob?new File([blob],'סיכום_'+period.replace(/\s/g,'_')+'.png',{type:'image/png'}):null;
  }catch(e){ return null; }
}

// ── Modal ────────────────────────────────────────────────────
function Modal({title, onClose, children}) {
  useEffect(()=>{
    const h = e => { if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[onClose]);
  return html`
    <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-3"
      onClick=${e=>e.target===e.currentTarget&&onClose()}>
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] overflow-y-auto fade">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100 sticky top-0 bg-white rounded-t-2xl z-10">
          <h2 class="font-bold text-gray-800">${title}</h2>
          <button onClick=${onClose} class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-500 text-xl">×</button>
        </div>
        <div class="p-5">${children}</div>
      </div>
    </div>`;
}

// ── MonthNav ─────────────────────────────────────────────────
function MonthNav({year,month,onChange}) {
  const go = d => { let m=month+d,y=year; if(m<0){m=11;y--;} if(m>11){m=0;y++;} onChange(y,m); };
  const now=new Date(), isCur=year===now.getFullYear()&&month===now.getMonth();
  return html`<div class="flex items-center gap-2">
    <button onClick=${()=>go(-1)} class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-600 text-lg">←</button>

    <button onClick=${()=>!isCur&&onChange(now.getFullYear(),now.getMonth())}
      class=${'text-xs border rounded px-1.5 py-0.5 w-[2.75rem] text-center transition-opacity '+(isCur?'opacity-0 pointer-events-none border-transparent':'text-blue-600 border-blue-200 hover:bg-blue-50')}>
      היום</button>
  </div>`;
}

// ── MonthStrip (quick month jump bar) ────────────────────────
function MonthStrip({year,month,onChange}) {
  const now=new Date();
  const selRef=useRef(null);
  useEffect(()=>{
    const el=selRef.current;
    if(el&&el.scrollIntoView){ try{ el.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){} }
  },[year,month]);
  // Year is one tappable chip rather than two cramped arrows, so it stays a
  // single row without shrinking the target.
  const [yrOpen,setYrOpen]=useState(false);
  const yrRef=useRef(null);
  useEffect(()=>{
    if(!yrOpen) return;
    const away=e=>{ if(yrRef.current&&!yrRef.current.contains(e.target)) setYrOpen(false); };
    const esc=e=>{ if(e.key==='Escape') setYrOpen(false); };
    document.addEventListener('pointerdown',away);
    document.addEventListener('keydown',esc);
    return ()=>{ document.removeEventListener('pointerdown',away); document.removeEventListener('keydown',esc); };
  },[yrOpen]);
  const yrs=(()=>{
    const c=now.getFullYear(), s=new Set();
    for(let y=c-4;y<=c+1;y++) s.add(y);
    s.add(year);
    return [...s].sort((a,b)=>b-a);
  })();

  return html`<div class="flex items-center gap-1.5">
    <div class="relative flex-shrink-0" ref=${yrRef}>
      <button onClick=${()=>setYrOpen(o=>!o)}
        aria-haspopup="listbox" aria-expanded=${yrOpen}
        class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors">
        <span class="tabular-nums">${year}</span>
        <span class="text-[9px] text-gray-400">▾</span>
      </button>
      ${yrOpen&&html`
        <div role="listbox"
          class="absolute z-50 mt-1 right-0 bg-white border border-gray-200 rounded-lg shadow-2xl py-1 min-w-[5rem]">
          ${yrs.map(y=>html`
            <button key=${y} role="option" aria-selected=${y===year}
              onClick=${()=>{onChange(y,month);setYrOpen(false);}}
              class=${'block w-full text-right px-3 py-1.5 text-xs tabular-nums transition-colors '+(y===year?'bg-blue-500 text-white font-bold':'text-gray-700 hover:bg-gray-100')}>
              ${y}</button>`)}
        </div>`}
    </div>
    <div class="month-strip flex gap-1.5 overflow-x-auto py-0.5 flex-1 min-w-0">
      ${MONTHS.map((l,i)=>{
        const sel=i===month, isNow=year===now.getFullYear()&&i===now.getMonth();
        return html`<button key=${i} ref=${sel?selRef:null} onClick=${()=>onChange(year,i)}
          class=${'flex-shrink-0 px-3 py-1 rounded-full text-xs font-medium transition-colors '+(sel?'bg-blue-500 text-white':isNow?'bg-blue-50 text-blue-600 border border-blue-200':'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
          ${l}</button>`;
      })}
    </div>
  </div>`;
}

// Counts the hero figure up on open — the one flourish, skipped when the
// value is hidden by privacy mode or the user asked for less motion.
function useCountUp(target, active) {
  const [v,setV]=useState(active?0:target);
  useEffect(()=>{
    if(!active){ setV(target); return; }
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){ setV(target); return; }
    let raf, t0=null; const dur=700, from=0;
    const step=t=>{ if(t0===null)t0=t;
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      setV(from+(target-from)*e);
      if(p<1) raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[target,active]);
  return v;
}

          <${Icon} name="check" size=${16}/>
          ${todayArrived?'סימנת שהגעת היום':'הגעתי היום לעבודה'}

function JobForm({initial, shifts, onSave, onClose}) {

  const [type,  setType]  = useState((initial&&initial.rateType)||'daily');

  const [endTime,   setEndTime]   = useState((initial&&initial.endTime)||'16:00');
  const [hoursMode, setHoursMode] = useState((initial&&initial.hoursMode)||'fixed');
  const [jobStart,  setJobStart]  = useState((initial&&initial.startDate)||todayS());
  const [pensionMode,setPensionMode]=useState((initial&&initial.pensionMode)||'auto');
  const [travelDay, setTravelDay] = useState((initial&&initial.travelPerDay!=null)?String(initial.travelPerDay):'');

  const pensionFrom = addMonths(jobStart||todayS(),3);

  // Miluim: daily tagmul auto-computed from the last 3 months' gross / 90, clamped to BL min/max
  const miluimRate = () => {
    const cutoff=addMonths(todayS(),-3);
    const gross=(shifts||[]).filter(s=>s.date>=cutoff&&s.date<todayS()).reduce((n,s)=>n+s.earnings+(s.travel||0)+(s.bonus||0),0);
    return Math.round(Math.min(MILUIM_MAX_DAY,Math.max(MILUIM_MIN_DAY,gross/90)));
  };

    if (!name.trim()) return alert('יש למלא שם משרה');

        startTime:'08:00',endTime:'16:00',hoursMode:'fixed',startDate:jobStart,pensionMode:'never',travelPerDay:0});

// ── ShiftForm ────────────────────────────────────────────────
function ShiftForm({initial, jobs, shifts, onSave, onClose, onDelete}) {
  const firstActive = jobs.find(j=>!j.deleted);
  const jobInit = findJob(jobs,(initial&&initial.jobId)||(firstActive&&firstActive.id));
  const [jobId,  setJobId]  = useState((initial&&initial.jobId)||(firstActive&&firstActive.id)||'');
  const [date,   setDate]   = useState((initial&&initial.date)||todayS());
  const [startTime,setStartTime]=useState((initial&&initial.startTime)||(jobInit&&jobInit.startTime)||'08:00');
  const [endTime,  setEndTime]  =useState((initial&&initial.endTime)  ||(jobInit&&jobInit.endTime)  ||'16:00');
  const [travel, setTravel] = useState(initial&&initial.travel!=null?initial.travel:((jobInit&&jobInit.travelPerDay)||0));
  const [bonus,  setBonus]  = useState(initial&&initial.bonus!=null?initial.bonus:0);
  const [isPaid, setIsPaid] = useState(initial&&initial.isPaid!=null?initial.isPaid:false);
  const [arrived,setArrived]= useState(initial&&initial.arrived!=null?initial.arrived:false);
  const [notes,  setNotes]  = useState((initial&&initial.notes)||'');

  const job        = findJob(jobs,jobId);
  const isMonthly  = job && job.rateType==='monthly';
  const variable   = job && job.hoursMode==='variable';

  // When the selected job changes, reset hours to that job's defined hours
  const firstRun=useRef(true);
  useEffect(()=>{
    if(firstRun.current){ firstRun.current=false; return; }
    const j=findJob(jobs,jobId);
    if(j){ setStartTime(j.startTime||'08:00'); setEndTime(j.endTime||'16:00'); setTravel(j.travelPerDay||0); }
  },[jobId]);

  const hours      = hoursBetween(startTime,endTime);
  const baseEarn   = isMonthly ? 0 : (job?((job.rateType==='daily'||job.rateType==='miluim')?job.rate:job.rate*hours):0);
  const total      = baseEarn+(+travel||0)+(+bonus||0);

  const submit = () => {
    if (!jobId) return alert('יש לבחור משרה');
    if (!date)  return alert('יש לבחור תאריך');
    onSave({jobId,date,hours,startTime,endTime,travel:+travel||0,bonus:+bonus||0,isPaid,arrived,notes,earnings:baseEarn});
  };

  if (!jobs.some(j=>!j.deleted)) return html`<div class="text-center py-8 text-gray-400">
    <div class="flex justify-center mb-2 text-gray-300"><${Icon} name="briefcase" size=${36}/></div>
    <p>אין משרות. הוסף משרה קודם בלשונית "משרות".</p>
    <button onClick=${onClose} class="mt-4 text-blue-500 underline text-sm">סגור</button>
  </div>`;

  return html`<div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">משרה</label>
      <select value=${jobId} onChange=${e=>setJobId(e.target.value)}
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
        ${jobs.filter(j=>!j.deleted||j.id===jobId).map(j=>html`<option key=${j.id} value=${j.id}>${j.name}${j.deleted?' (נמחקה)':''}</option>`)}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">תאריך</label>
      <input type="date" value=${date} onChange=${e=>setDate(e.target.value)}
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
    </div>
    ${isMonthly?html`
      <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm text-blue-700">
        <${Icon} name="briefcase" size=${14}/> משרה חודשית — שכר חודשי: <strong>${fmt(job.rate)}</strong> (מחושב אוטומטית פעם בחודש)
      </div>`:html`
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          שעות עבודה ${variable?html`<span class="text-blue-400 font-normal text-xs">(ניתן לעריכה ליום זה)</span>`:html`<span class="text-gray-400 font-normal text-xs">(קבוע למשרה)</span>`}
        </label>
        ${variable?html`
          <div class="grid grid-cols-2 gap-3">
            <div><span class="block text-xs text-gray-400 mb-1">משעה</span>
              <input type="time" value=${startTime} onChange=${e=>setStartTime(e.target.value)}
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/></div>
            <div><span class="block text-xs text-gray-400 mb-1">עד שעה</span>
              <input type="time" value=${endTime} onChange=${e=>setEndTime(e.target.value)}
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/></div>
          </div>`:html`
          <div class="bg-slate-50 rounded-lg px-3 py-2 text-sm text-gray-600">${startTime}–${endTime}</div>`}
        <div class="text-xs text-gray-400 mt-1">סה"כ ${hours} שעות עבודה</div>
      </div>`}
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">נסיעות (₪)</label>
        <input type="number" value=${travel} onInput=${e=>setTravel(e.target.value)} placeholder="0"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">בונוס (₪)</label>
        <input type="number" value=${bonus} onInput=${e=>setBonus(e.target.value)} placeholder="0"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
    </div>
    ${job&&html`<div class="bg-slate-50 rounded-lg px-3 py-2 text-sm">
      <span class="text-gray-500">סה"כ משמרת: </span>
      <span class="font-bold text-emerald-600 text-base">${fmt(total)}</span>
      ${!isMonthly&&html`<span class="text-gray-400 text-xs"> (${job.rateType==='daily'?fmt(job.rate)+' יומי':job.rateType==='miluim'?fmt(job.rate)+' תגמול יומי':fmt(job.rate)+'/שעה × '+hours})</span>`}
    </div>`}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">הערות</label>
      <textarea rows="2" value=${notes} onInput=${e=>setNotes(e.target.value)} placeholder="אופציונלי..."
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none"></textarea>
    </div>
    <label class="flex items-center gap-2 cursor-pointer">
      <input type="checkbox" checked=${arrived} onChange=${e=>setArrived(e.target.checked)} class="w-4 h-4 rounded"/>
      <span class="text-sm text-gray-700">הגעתי לעבודה ביום זה ✓</span>
    </label>
    <label class="flex items-center gap-2 cursor-pointer">
      <input type="checkbox" checked=${isPaid} onChange=${e=>setIsPaid(e.target.checked)} class="w-4 h-4 rounded"/>
      <span class="text-sm text-gray-700">משמרת זו שולמה ✓</span>
    </label>
    <div class="flex gap-2 pt-1">
      <button onClick=${submit} class="flex-1 bg-blue-500 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors">שמור</button>
      <button onClick=${onClose} class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition-colors">ביטול</button>
    </div>
    ${onDelete&&html`
      <button onClick=${onDelete}
        class="w-full border border-red-200 text-red-500 py-2 rounded-lg text-sm font-medium hover:bg-red-50 transition-colors mt-1">
        <${Icon} name="trash" size=${14}/> מחק משמרת זו
      </button>`}
  </div>`;
}

// ── CalendarView ─────────────────────────────────────────────
function CalendarView({year,month,shifts,jobs,onDayClick,onShiftClick,onRangeSelect}) {
  const days=mDays(year,month), first=new Date(year,month,1).getDay(), today=todayS();
  const [dragStart,setDragStart]=useState(null);
  const [dragEnd,  setDragEnd]  =useState(null);
  const dragRef=useRef({active:false,start:null,end:null});
  const tRef=useRef({timer:null,pendingTap:null,moved:false,isTouch:false});

  const commitDrag=useCallback(()=>{
    const {start,end}=dragRef.current;
    dragRef.current={active:false,start:null,end:null};
    setDragStart(null); setDragEnd(null);
    if(start&&end&&start!==end) { onRangeSelect&&onRangeSelect(start,end); }
    else if(start) { onDayClick(start); }
  },[onDayClick,onRangeSelect]);

  useEffect(()=>{
    const up=()=>{ if(dragRef.current.active) commitDrag(); };
    window.addEventListener('mouseup',up);
    return ()=>window.removeEventListener('mouseup',up);
  },[commitDrag]);

  // ── Touch (long-press to select / drag) ──
  useEffect(()=>{
    const move=e=>{
      if(!dragRef.current.active){
        tRef.current.moved=true;
        clearTimeout(tRef.current.timer);
        return;
      }
      e.preventDefault();
      const t=e.touches[0]; if(!t) return;
      const el=document.elementFromPoint(t.clientX,t.clientY);
      const dd=el&&el.closest&&el.closest('[data-date]');
      if(dd){ const ds=dd.getAttribute('data-date'); dragRef.current.end=ds; setDragEnd(ds); }
    };
    const end=()=>{
      clearTimeout(tRef.current.timer);
      if(dragRef.current.active){ commitDrag(); }
      else if(tRef.current.pendingTap&&!tRef.current.moved){ onDayClick(tRef.current.pendingTap); }
      tRef.current.pendingTap=null; tRef.current.moved=false;
    };
    window.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('touchend',end);
    return ()=>{ window.removeEventListener('touchmove',move); window.removeEventListener('touchend',end); };
  },[commitDrag,onDayClick]);

  const selSet=useMemo(()=>{
    if(!dragStart||!dragEnd) return new Set();
    return new Set(dateRange(dragStart,dragEnd));
  },[dragStart,dragEnd]);

  const byDay={};
  shifts.forEach(s=>{ const d=+s.date.slice(8); (byDay[d]=byDay[d]||[]).push(s); });
  const cells=[...Array(first).fill(null),...Array.from({length:days},(_,i)=>i+1)];

  return html`<div>
    <div class="flex items-center justify-between mb-2 px-1">
      <span class="text-xs font-medium text-gray-500">${MONTHS[month]} ${year}</span>
      <span class="text-xs font-semibold text-blue-600 bg-blue-50 rounded-full px-2 py-0.5">${shifts.length} משמרות החודש</span>
    </div>
    <!-- Grid runs left-to-right so Sunday sits on the left, as in Google Calendar.
         Cell contents stay RTL so Hebrew still reads correctly. -->
    <div dir="ltr" class="grid grid-cols-7 gap-0.5 mb-1">
      ${DAYS.map(d=>html`<div key=${d} class="text-center text-xs font-medium text-gray-400 py-1">${d}</div>`)}
    </div>
    <div dir="ltr" class="grid grid-cols-7 gap-0.5">
      ${cells.map((day,i)=>{
        if(!day) return html`<div key=${'e'+i}/>`;
        const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const ds2=byDay[day]||[], isT=ds===today, isPast=ds<today, inDrag=selSet.has(ds);
        // A past shift you never confirmed arriving at
        const unconfirmed = ds<=today && ds2.length>0 && ds2.some(s=>!s.arrived);
        const cls='min-h-[4rem] rounded-lg p-1 cursor-pointer border transition-colors select-none '+
          (inDrag?'cal-drag ':isT?'border-blue-400 bg-blue-50 ':
           unconfirmed?'border-amber-300 bg-amber-50/60 ':
           'border-transparent hover:border-gray-200 hover:bg-gray-50 ')+
          (isPast&&!isT&&!inDrag&&!unconfirmed?'bg-gray-50/40':'');
        return html`<div key=${day} dir="rtl" class=${cls} data-date=${ds}
          onMouseDown=${e=>{
            if(tRef.current.isTouch) return;
            e.preventDefault();
            dragRef.current={active:true,start:ds,end:ds};
            setDragStart(ds); setDragEnd(ds);
          }}
          onMouseEnter=${()=>{
            if(!dragRef.current.active) return;
            dragRef.current.end=ds;
            setDragEnd(ds);
          }}
          onTouchStart=${e=>{
            tRef.current.isTouch=true;
            tRef.current.dragged=false;
            tRef.current.pendingTap=ds; tRef.current.moved=false;
            clearTimeout(tRef.current.timer);
            tRef.current.timer=setTimeout(()=>{
              tRef.current.dragged=true;
              dragRef.current={active:true,start:ds,end:ds};
              setDragStart(ds); setDragEnd(ds);
              navigator.vibrate&&navigator.vibrate(30);
            },350);
          }}>
          <div class="flex items-center justify-between mb-0.5">
            <span class=${'text-xs font-semibold '+(isT?'text-blue-600':unconfirmed?'text-gray-700':'text-gray-500')}>${day}</span>
            ${unconfirmed&&html`<span class="text-[9px] text-amber-500 leading-none" title="לא סומן שהגעת">●</span>`}
          </div>
          ${ds2.slice(0,2).map(s=>{ const j=findJob(jobs,s.jobId); return html`
            <div key=${s.id} data-shift="1" onClick=${e=>{e.stopPropagation();if(tRef.current.dragged)return;onShiftClick(s);}}
              class="text-[10px] px-1 py-0.5 rounded break-words leading-tight mb-0.5 hover:opacity-80"
              style=${{backgroundColor:(j&&j.color)||'#9CA3AF',color:onColor((j&&j.color)||'#9CA3AF')}}>${(j&&j.name)||'?'}</div>`;})}
          ${ds2.length>2&&html`<div class="text-[10px] text-gray-400">+${ds2.length-2}</div>`}
        </div>`;
      })}
    </div>
    ${selSet.size>0
      ? html`<div class="mt-2 text-xs text-blue-600 text-center">נבחרו ${selSet.size} ימים</div>`
      : html`<div class="mt-2 text-[11px] text-gray-400 text-center">לחיצה ארוכה (על יום או משמרת) + גרירה לבחירת טווח ימים</div>`}
  </div>`;
}

// ── BulkShiftForm ────────────────────────────────────────────
function BulkShiftForm({startDate,endDate,jobs,shifts,onSave,onDeleteRange,onMarkPaid,onMarkArrived,onEditRange,onClose}) {
  const firstActive = jobs.find(j=>!j.deleted);
  const [jobId,     setJobId]     = useState((firstActive&&firstActive.id)||'');
  const [sDate,     setSDate]     = useState(startDate||todayS());
  const [eDate,     setEDate]     = useState(endDate||todayS());
  const [hours,     setHours]     = useState(8);
  const [travel,    setTravel]    = useState((firstActive&&firstActive.travelPerDay)||0);
  const [skipExist, setSkipExist] = useState(true);

  const bFirst=useRef(true);
  useEffect(()=>{
    if(bFirst.current){ bFirst.current=false; return; }
    const j=findJob(jobs,jobId); if(j) setTravel(j.travelPerDay||0);
  },[jobId]);

  const job      = findJob(jobs,jobId);
  const isMonthly= job&&job.rateType==='monthly';
  const range    = useMemo(()=>sDate&&eDate?dateRange(sDate,eDate):[], [sDate,eDate]);
  const existSet = useMemo(()=>new Set((shifts||[]).map(s=>s.date)), [shifts]);
  const toAdd    = range.filter(d=>!skipExist||!existSet.has(d));
  const inRangeShifts = useMemo(()=>{const rs=new Set(range);return (shifts||[]).filter(s=>rs.has(s.date));},[range,shifts]);
  const allPaid    = inRangeShifts.length>0 && inRangeShifts.every(s=>s.isPaid);
  const allArrived = inRangeShifts.length>0 && inRangeShifts.every(s=>s.arrived);

  const submit=()=>{
    if(!jobId) return alert('יש לבחור משרה');
    if(!sDate||!eDate) return alert('יש לבחור טווח תאריכים');
    if(toAdd.length===0) return alert('אין תאריכים חדשים להוסיף בטווח זה');
    const newShifts=toAdd.map(d=>{
      const earn=isMonthly?0:(job?((job.rateType==='daily'||job.rateType==='miluim')?job.rate:job.rate*(+hours||0)):0);
      return {id:genId(),jobId,date:d,hours:+hours||0,startTime:(job&&job.startTime)||'08:00',endTime:(job&&job.endTime)||'16:00',travel:+travel||0,bonus:0,isPaid:false,notes:'',earnings:earn};
    });
    onSave(newShifts); onClose();
  };

  return html`<div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">משרה</label>
      <select value=${jobId} onChange=${e=>setJobId(e.target.value)}
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
        ${jobs.filter(j=>!j.deleted).map(j=>html`<option key=${j.id} value=${j.id}>${j.name}</option>`)}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">מתאריך</label>
        <input type="date" value=${sDate} onChange=${e=>setSDate(e.target.value)}
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">עד תאריך</label>
        <input type="date" value=${eDate} onChange=${e=>setEDate(e.target.value)}
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
    </div>
    ${!isMonthly&&html`
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">שעות יומיות</label>
        <input type="number" step="0.5" min="0" value=${hours} onInput=${e=>setHours(e.target.value)}
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">נסיעות יומי (₪)</label>
        <input type="number" value=${travel} onInput=${e=>setTravel(e.target.value)} placeholder="0"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
    </div>`}
    <label class="flex items-center gap-2 cursor-pointer select-none">
      <input type="checkbox" checked=${skipExist} onChange=${e=>setSkipExist(e.target.checked)} class="w-4 h-4 rounded"/>
      <span class="text-sm text-gray-700">דלג על תאריכים שכבר יש בהם משמרת</span>
    </label>
    <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm text-blue-700">
      <strong>${toAdd.length}</strong> משמרות יתווספו מתוך <strong>${range.length}</strong> ימים בטווח
    </div>
    <div class="flex gap-2 pt-1">
      <button onClick=${submit}
        class="flex-1 bg-blue-500 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors">
        הוסף ${toAdd.length} משמרות</button>
      <button onClick=${onClose}
        class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition-colors">
        ביטול</button>
    </div>
    ${onEditRange&&html`
      <button onClick=${()=>{
        if(!jobId) return alert('יש לבחור משרה');
        const rangeSet=new Set(range);
        const inRange=(shifts||[]).filter(s=>rangeSet.has(s.date));
        if(inRange.length===0) return alert('אין משמרות קיימות בטווח זה לעריכה');
        if(!confirm('לעדכן '+inRange.length+' משמרות קיימות בטווח לפי הבחירה למעלה (משרה, שעות ונסיעות)?')) return;
        const st=(job&&job.startTime)||'08:00', et=(job&&job.endTime)||'16:00';
        const updated=inRange.map(s=>{
          const earn=isMonthly?0:(job?((job.rateType==='daily'||job.rateType==='miluim')?job.rate:job.rate*(+hours||0)):0);
          return {...s,jobId,hours:+hours||0,startTime:st,endTime:et,travel:+travel||0,earnings:earn};
        });
        onEditRange(updated);
        onClose();
      }}
        class="w-full border border-violet-200 text-violet-600 py-2 rounded-lg text-sm font-medium hover:bg-violet-50 transition-colors flex items-center justify-center gap-1.5">
        <${Icon} name="pencil" size=${14}/> ערוך משמרות קיימות בטווח</button>`}
    ${onMarkPaid&&html`
      <button onClick=${()=>{
        if(inRangeShifts.length===0) return alert('אין משמרות קיימות בטווח זה לסימון');
        onMarkPaid(new Set(inRangeShifts.map(s=>s.id)), !allPaid);
        onClose();
      }}
        class="w-full border border-emerald-200 text-emerald-600 py-2 rounded-lg text-sm font-medium hover:bg-emerald-50 transition-colors flex items-center justify-center gap-1.5">
        <${Icon} name="wallet" size=${14}/> ${allPaid?'בטל סימון "שולם" בטווח':'סמן משמרות בטווח כשולם'}</button>`}
    ${onMarkArrived&&html`
      <button onClick=${()=>{
        if(inRangeShifts.length===0) return alert('אין משמרות קיימות בטווח זה לסימון');
        onMarkArrived(new Set(inRangeShifts.map(s=>s.id)), !allArrived);
        onClose();
      }}
        class="w-full border border-blue-200 text-blue-600 py-2 rounded-lg text-sm font-medium hover:bg-blue-50 transition-colors flex items-center justify-center gap-1.5">
        <${Icon} name="check" size=${14}/> ${allArrived?'בטל סימון "הגעתי" בטווח':'סמן שהגעתי למשמרות בטווח'}</button>`}
    ${onDeleteRange&&html`
      <button onClick=${()=>{
        const rangeSet=new Set(range);
        const inRange=(shifts||[]).filter(s=>rangeSet.has(s.date));
        if(inRange.length===0) return alert('אין משמרות קיימות בטווח זה למחיקה');
        if(!confirm('למחוק '+inRange.length+' משמרות קיימות בטווח שנבחר?')) return;
        onDeleteRange(new Set(inRange.map(s=>s.id)));
        onClose();
      }}
        class="w-full border border-red-200 text-red-500 py-2 rounded-lg text-sm font-medium hover:bg-red-50 transition-colors">
        <${Icon} name="trash" size=${14}/> מחק משמרות קיימות בטווח</button>`}
  </div>`;
}

// ── BulkDeleteForm ───────────────────────────────────────────
function BulkDeleteForm({shifts, onDelete, onClose}) {
  const [sDate, setSDate] = useState('');
  const [eDate, setEDate] = useState('');

  const toDelete = useMemo(()=>{
    if(!sDate||!eDate) return [];
    const r = new Set(dateRange(sDate, eDate));
    return shifts.filter(s=>r.has(s.date));
  },[shifts,sDate,eDate]);

  const submit = () => {
    if(!sDate||!eDate) return alert('יש לבחור טווח תאריכים');
    if(toDelete.length===0) return alert('אין משמרות בטווח זה');
    if(!confirm('למחוק '+toDelete.length+' משמרות לצמיתות?')) return;
    onDelete(new Set(toDelete.map(s=>s.id)));
    onClose();
  };

  return html`<div class="space-y-4">
    <div class="bg-red-50 border border-red-100 rounded-lg p-3 text-sm text-red-600">
      פעולה זו תמחק לצמיתות את כל המשמרות בטווח התאריכים שנבחר.
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">מתאריך</label>
        <input type="date" value=${sDate} onChange=${e=>setSDate(e.target.value)}
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">עד תאריך</label>
        <input type="date" value=${eDate} onChange=${e=>setEDate(e.target.value)}
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300"/>
      </div>
    </div>
    ${sDate&&eDate&&html`<div class=${'rounded-lg p-3 text-sm text-center font-semibold '+(toDelete.length>0?'bg-red-50 text-red-600 border border-red-100':'bg-gray-50 text-gray-500')}>
      ${toDelete.length>0?toDelete.length+' משמרות יימחקו':'אין משמרות בטווח זה'}
    </div>`}
    <div class="flex gap-2 pt-1">
      <button onClick=${submit}
        class=${'flex-1 py-2 rounded-lg text-sm font-semibold transition-colors '+(toDelete.length>0?'bg-red-500 text-white hover:bg-red-600':'bg-gray-200 text-gray-400 cursor-not-allowed')}>
        <${Icon} name="trash" size=${14}/> מחק ${toDelete.length>0?toDelete.length+' משמרות':''}
      </button>
      <button onClick=${onClose}
        class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition-colors">
        ביטול
      </button>
    </div>
  </div>`;
}

// ── JobsPage ─────────────────────────────────────────────────
function JobsPage({jobs,setJobs,shifts,setShifts}) {
  const [modal,setModal]=useState(null);
  const [applyModal,setApplyModal]=useState(null); // {job,oldJob} after editing a job that has shifts
  const [showDeleted,setShowDeleted]=useState(false);
  const [purgeJob,setPurgeJob]=useState(null);
  const active=jobs.filter(j=>!j.deleted), removed=jobs.filter(j=>j.deleted);
  const editing = (modal&&modal!=='add') ? findJob(jobs,modal) : null;
  const save = data => {
    if(editing){
      const oldJob=editing, newJob={...editing,...data};
      setJobs(j=>j.map(x=>x.id===editing.id?newJob:x));
      if((shifts||[]).some(s=>s.jobId===editing.id)) setApplyModal({job:newJob,oldJob});
    } else {
      setJobs(j=>[...j,{id:genId(),...data}]);
    }
    setModal(null);
  };
  // Soft delete: job moves to the "deleted" list, shifts and data are kept
  const del = id => {
    if(confirm('להעביר משרה זו ל"נמחקו"?\nכל המשמרות והנתונים שהוזנו יישמרו, ותוכל לשחזר את המשרה בכל רגע.'))
      setJobs(j=>j.map(x=>x.id===id?{...x,deleted:true}:x));
  };
  const restore = id => setJobs(j=>j.map(x=>x.id===id?{...x,deleted:false}:x));
  // Permanent delete — optionally removes the job's shifts too (incl. their calendar events)
  const purge = withShifts => {
    const job=purgeJob;
    if(withShifts){
      const gids=shifts.filter(s=>s.jobId===job.id&&s.gcalId).map(s=>s.gcalId);
      if(gids.length){ enqueueGcalDel(gids); processGcalDelQueue(); }
      setShifts(arr=>arr.filter(s=>s.jobId!==job.id));
    }
    setJobs(j=>j.filter(x=>x.id!==job.id));
    setPurgeJob(null);
  };

  // Apply the edited job's rate/hours/travel to existing shifts (all, or from a given date)
  const applyToShifts = fromDate => {
    const {job,oldJob}=applyModal;
    setShifts(arr=>arr.map(s=>{
      if(s.jobId!==job.id) return s;
      if(fromDate && s.date<fromDate) return s;
      const variable=job.hoursMode==='variable';
      const st=variable?(s.startTime||job.startTime||'08:00'):(job.startTime||'08:00');
      const et=variable?(s.endTime  ||job.endTime  ||'16:00'):(job.endTime  ||'16:00');
      const hrs=hoursBetween(st,et);
      const earn=job.rateType==='monthly'?0:((job.rateType==='daily'||job.rateType==='miluim')?job.rate:job.rate*hrs);
      let travel=s.travel;
      if((job.travelPerDay||0)!==(oldJob.travelPerDay||0)){
        if(!travel || travel===(oldJob.travelPerDay||0)) travel=job.travelPerDay||0;
      }
      return {...s,startTime:st,endTime:et,hours:hrs,earnings:earn,travel};
    }));
    setApplyModal(null);
  };
  return html`<div class="space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-base font-bold text-gray-800">המשרות שלי</h2>
      <button onClick=${()=>setModal('add')} class="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-600 transition-colors">+ הוסף משרה</button>
    </div>
    ${active.length===0?html`
      <div class="text-center py-16 text-gray-400 bg-white rounded-xl border border-gray-100">
        <div class="flex justify-center mb-3 text-gray-300"><${Icon} name="briefcase" size=${44}/></div>
        <div class="font-medium">אין משרות עדיין</div>
        <div class="text-sm mt-1">הוסף את המשרה הראשונה שלך</div>
      </div>`:html`
      <div class="grid gap-3 sm:grid-cols-2">
        ${active.map(job=>html`<div key=${job.id} class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm fade">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-full flex-shrink-0" style=${{backgroundColor:job.color}}/>
              <div>
                <div class="font-semibold text-gray-800">${job.name}</div>
                <div class="text-sm text-gray-500">${job.rateType==='daily'?fmt(job.rate)+' ליום':job.rateType==='hourly'?fmt(job.rate)+' לשעה':job.rateType==='miluim'?fmt(job.rate)+' תגמול ליום':fmt(job.rate)+' לחודש'}</div>
              </div>
            </div>
            <div class="flex gap-1">
              <button onClick=${()=>setModal(job.id)} class="p-1.5 rounded hover:bg-blue-50 text-gray-400 hover:text-blue-500"><${Icon} name="pencil" size=${15}/></button>
              <button onClick=${()=>del(job.id)}      class="p-1.5 rounded hover:bg-red-50  text-gray-400 hover:text-red-500"><${Icon} name="trash" size=${15}/></button>
            </div>
          </div>
        </div>`)}
      </div>`}
    ${removed.length>0&&html`
      <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
        <button onClick=${()=>setShowDeleted(v=>!v)} class="w-full flex items-center justify-between">
          <span class="text-sm font-semibold text-gray-500 flex items-center gap-1.5"><${Icon} name="trash" size=${14}/> משרות שנמחקו (${removed.length})</span>
          <span class="text-gray-400 text-xs">${showDeleted?'▲ הסתר':'▼ הצג'}</span>
        </button>
        ${showDeleted&&html`<div class="mt-3 space-y-2">
          ${removed.map(job=>{
            const cnt=shifts.filter(s=>s.jobId===job.id).length;
            return html`<div key=${job.id} class="flex items-center justify-between border border-gray-100 rounded-lg p-2.5 gap-2">
              <div class="flex items-center gap-2 min-w-0 flex-1">
                <div class="w-3 h-3 rounded-full flex-shrink-0 opacity-50" style=${{backgroundColor:job.color}}/>
                <div class="min-w-0">
                  <div class="text-sm text-gray-600 truncate">${job.name}</div>
                  <div class="text-xs text-gray-400">${cnt} משמרות שמורות</div>
                </div>
              </div>
              <button onClick=${()=>restore(job.id)} class="flex-shrink-0 text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg font-semibold hover:bg-blue-100">שחזר</button>
              <button onClick=${()=>setPurgeJob(job)} class="flex-shrink-0 text-xs bg-red-50 text-red-500 px-3 py-1.5 rounded-lg font-semibold hover:bg-red-100">מחק לצמיתות</button>
            </div>`;})}
        </div>`}
      </div>`}

    ${modal&&html`<${Modal} title=${modal==='add'?'הוסף משרה':'ערוך משרה'} onClose=${()=>setModal(null)}>
      <${JobForm} initial=${editing} shifts=${shifts} onSave=${save} onClose=${()=>setModal(null)}/>
    <//>`}
    ${purgeJob&&html`<${Modal} title="מחיקה לצמיתות" onClose=${()=>setPurgeJob(null)}>
      <div class="space-y-3">
        <p class="text-sm text-gray-600">מחיקת המשרה <strong>"${purgeJob.name}"</strong> לצמיתות.<br/>מה לעשות עם ${shifts.filter(s=>s.jobId===purgeJob.id).length} המשמרות והנתונים שהוזנו?</p>
        <button onClick=${()=>purge(false)}
          class="w-full bg-blue-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors">
          מחק רק את המשרה — שמור את המשמרות</button>
        <button onClick=${()=>purge(true)}
          class="w-full bg-red-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-red-600 transition-colors">
          מחק גם את כל המשמרות של משרה זו</button>
        <button onClick=${()=>setPurgeJob(null)}
          class="w-full bg-gray-100 text-gray-600 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
          ביטול</button>
      </div>
    <//>`}
    ${applyModal&&html`<${Modal} title="עדכון משמרות קיימות" onClose=${()=>setApplyModal(null)}>
      <${ApplyJobChanges} jobName=${applyModal.job.name} onApply=${applyToShifts} onSkip=${()=>setApplyModal(null)}/>
    <//>`}
  </div>`;
}

// ── DayModal (all shifts of a day + add) ─────────────────────

// ── UnconfirmedPanel (past shifts never marked as attended) ──
function UnconfirmedPanel({shifts,jobs,onMarkArrived,onOpenDay}) {
  const [open,setOpen]=useState(false);
  const [sel,setSel]=useState(()=>new Set());
  const [scope,setScope]=useState('all'); // 'all' | 'month'
  const today=todayS();
  const nowM=new Date(), curKey=nowM.getFullYear()+'-'+String(nowM.getMonth()+1).padStart(2,'0');

  const pending=useMemo(()=>{
    let list=(shifts||[]).filter(s=>s.date<=today && !s.arrived);
    if(scope==='month') list=list.filter(s=>s.date.slice(0,7)===curKey);
    return list.sort((a,b)=>a.date<b.date?1:-1);
  },[shifts,today,scope,curKey]);

  // Drop selections that are no longer pending (e.g. after marking)
  useEffect(()=>{
    const ids=new Set(pending.map(s=>s.id));
    setSel(prev=>{
      const next=new Set([...prev].filter(id=>ids.has(id)));
      return next.size===prev.size?prev:next;
    });
  },[pending]);

  if(pending.length===0) return null;

  const allSelected=sel.size===pending.length;
  const toggle=id=>setSel(p=>{const n=new Set(p); n.has(id)?n.delete(id):n.add(id); return n;});
  const applySel=()=>{ if(sel.size){ onMarkArrived(new Set(sel),true); setSel(new Set()); } };
  const applyAll=()=>{
    if(!confirm('לסמן שהגעת לכל '+pending.length+' המשמרות?')) return;
    onMarkArrived(new Set(pending.map(s=>s.id)),true);
    setSel(new Set());
  };

  return html`<div class="bg-amber-50 border border-amber-200 rounded-xl overflow-hidden">
    <button onClick=${()=>setOpen(o=>!o)} class="w-full flex items-center justify-between p-3 text-right">
      <div class="flex items-center gap-2">
        <span class="text-amber-500 text-xs">●</span>
        <span class="text-sm font-semibold text-amber-800">${pending.length} משמרות ללא אישור הגעה</span>
      </div>
      <span class="text-xs text-amber-600">${open?'▲':'▼'}</span>
    </button>

    ${open&&html`<div class="px-3 pb-3 space-y-2">
      <div class="flex gap-1.5">
        ${[['all','הכל'],['month','החודש']].map(([v,l])=>html`
          <button key=${v} onClick=${()=>setScope(v)}
            class=${'px-2.5 py-1 rounded-full text-xs font-medium transition-colors '+(scope===v?'bg-amber-500 text-white':'bg-white text-amber-700 border border-amber-200')}>
            ${l}</button>`)}
        <button onClick=${()=>setSel(allSelected?new Set():new Set(pending.map(s=>s.id)))}
          class="mr-auto px-2.5 py-1 rounded-full text-xs font-medium bg-white text-amber-700 border border-amber-200">
          ${allSelected?'בטל בחירה':'בחר הכל'}</button>
      </div>

      <div class="space-y-1.5 max-h-64 overflow-y-auto">
        ${pending.map(s=>{
          const job=findJob(jobs,s.jobId), on=sel.has(s.id);
          return html`<div key=${s.id}
            class=${'flex items-center gap-2 rounded-lg p-2 border transition-colors '+(on?'bg-amber-100 border-amber-300':'bg-white border-amber-100')}>
            <input type="checkbox" checked=${on} onChange=${()=>toggle(s.id)} class="w-4 h-4 rounded flex-shrink-0"/>
            <div class="w-1 h-7 rounded-full flex-shrink-0" style=${{backgroundColor:(job&&job.color)||'#9CA3AF'}}/>
            <div class="flex-1 min-w-0 cursor-pointer" onClick=${()=>onOpenDay&&onOpenDay(s.date)}>
              <div class="text-xs font-medium text-gray-800 truncate">${(job&&job.name)||'לא ידוע'}</div>
              <div class="text-[11px] text-gray-400">
                ${new Date(s.date+'T12:00:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'long'})}
              </div>
            </div>
            <button onClick=${()=>onMarkArrived(new Set([s.id]),true)}
              class="flex-shrink-0 text-[11px] px-2 py-1 rounded-lg bg-blue-500 text-white font-medium hover:bg-blue-600">הגעתי</button>
          </div>`;
        })}
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onClick=${applySel} disabled=${sel.size===0}
          class="bg-blue-500 text-white py-2 rounded-lg text-xs font-semibold hover:bg-blue-600 disabled:opacity-40">
          סמן נבחרות (${sel.size})</button>
        <button onClick=${applyAll}
          class="bg-white text-amber-700 border border-amber-300 py-2 rounded-lg text-xs font-semibold hover:bg-amber-100">
          סמן הכל (${pending.length})</button>
      </div>
    </div>`}
  </div>`;
}

// ── ShiftsPage ───────────────────────────────────────────────
function ShiftsPage({shifts,setShifts,jobs}) {
  const now=new Date();
  const [year, setYear]       =useState(now.getFullYear());
  const [month,setMonth]      =useState(now.getMonth());
  const [view, setView]       =useState('calendar');
  const [modal,setModal]            =useState(null);
  const [detailShift,setDetailShift]=useState(null);
  const [bulkModal,setBulkModal]    =useState(null);
  const [deleteModal,setDeleteModal]=useState(false);
  const [dayModal,setDayModal]      =useState(null);
  const today=todayS();

  const markMonthPaid=()=>{
    const ids=new Set(ms.filter(s=>s.date<=today).map(s=>s.id));
    if(ids.size===0) return alert('אין משמרות שעברו בחודש זה לסימון');
    if(!confirm('לסמן '+ids.size+' משמרות כשולם?')) return;
    setShifts(s=>s.map(x=>ids.has(x.id)?{...x,isPaid:true}:x));
  };

  const ms=useMemo(()=>shifts.filter(s=>{
    const [y,m]=s.date.split('-').map(Number); return y===year&&m===month+1;
  }),[shifts,year,month]);

  const editing=(modal&&modal.id)?modal:null;
  const save=data=>{
    setShifts(s=>editing?s.map(x=>x.id===editing.id?{...x,...data}:x):[...s,{id:genId(),...data}]);
    setModal(null);
  };
  // Remove shifts and also delete their Google Calendar events (if synced)
  const removeShifts=idSet=>{
    shifts.forEach(s=>{ if(idSet.has(s.id)&&s.gcalId) deleteGcalEvent(s.gcalId); });
    setShifts(s=>s.filter(x=>!idSet.has(x.id)));
  };
  const del=id=>{
    if(confirm('למחוק משמרת זו?')) {
      removeShifts(new Set([id]));
      setDetailShift(null);
      setModal(null);
    }
  };
  const markPaid=(idSet,val=true)=>setShifts(s=>s.map(x=>idSet.has(x.id)?{...x,isPaid:val}:x));
  const markArrivedRange=(idSet,val=true)=>setShifts(s=>s.map(x=>idSet.has(x.id)?{...x,arrived:val}:x));
  const sorted=[...ms].sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:0);

  return html`<div class="space-y-4">
    <${MonthStrip} year=${year} month=${month} onChange=${(y,m)=>{setYear(y);setMonth(m);}}/>

    <div class="space-y-2">
      <div class="grid grid-cols-2 gap-2">
        ${[['calendar','calendar','לוח'],['list','list','רשימה']].map(([v,ic,l])=>html`
          <button key=${v} onClick=${()=>setView(v)}
            class=${'py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-1.5 '+(view===v?'bg-blue-500 text-white shadow-sm':'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
            <${Icon} name=${ic} size=${15}/><span>${l}</span></button>`)}
      </div>
      <div class="hidden sm:grid grid-cols-3 gap-2">
        <button onClick=${()=>setBulkModal({startDate:null,endDate:null})}
          class="bg-blue-500 text-white px-1 py-2 rounded-lg text-xs font-semibold hover:bg-blue-600 transition-colors flex items-center justify-center gap-1 text-center leading-tight"><${Icon} name="plus" size=${14}/><span>הוסף משמרת</span></button>
        <button onClick=${markMonthPaid}
          class="bg-emerald-500 text-white px-1 py-2 rounded-lg text-xs font-semibold hover:bg-emerald-600 transition-colors flex items-center justify-center gap-1 text-center leading-tight"><${Icon} name="check" size=${14}/><span>סמן חודש כשולם</span></button>
        <button onClick=${()=>setDeleteModal(true)}
          class="bg-red-500 text-white px-1 py-2 rounded-lg text-xs font-semibold hover:bg-red-600 transition-colors flex items-center justify-center gap-1 text-center leading-tight"><${Icon} name="trash" size=${14}/><span>מחיקה מרובה</span></button>
      </div>
    </div>

    <${UnconfirmedPanel} shifts=${shifts} jobs=${jobs}
      onMarkArrived=${markArrivedRange}
      onOpenDay=${ds=>setDayModal(ds)}/>

    ${view==='calendar'?html`
      <div class="bg-white rounded-xl border border-gray-100 p-3 shadow-sm">
        <${CalendarView} year=${year} month=${month} shifts=${ms} jobs=${jobs}
          onDayClick=${ds=>setDayModal(ds)}
          onShiftClick=${s=>setDayModal(s.date)}
          onRangeSelect=${(s,e)=>setBulkModal({startDate:s,endDate:e})}/>
      </div>
      <div class="text-xs text-gray-400 text-center mt-1 flex items-center justify-center gap-1.5 flex-wrap">
        <span class="text-amber-500">●</span><span>יום מסומן בכתום = לא אושרה הגעה</span>
      </div>
      <div class="text-xs text-gray-400 text-center">מחשב: גרור בלוח · טלפון: לחיצה ארוכה + גרירה</div>`:html`
      <div class="space-y-2">
        ${ms.length===0?html`
          <div class="text-center py-14 text-gray-400 bg-white rounded-xl border border-gray-100">
            <div class="flex justify-center mb-3 text-gray-300"><${Icon} name="list" size=${40}/></div>
            <div class="text-sm">אין משמרות בחודש זה</div>
          </div>`:
        sorted.map(s=>{
          const job=findJob(jobs,s.jobId);
          const tot=s.earnings+(s.travel||0)+(s.bonus||0);
          const fut=s.date>today;
          return html`<div key=${s.id} class="bg-white rounded-xl border border-gray-100 p-3 shadow-sm fade">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-start gap-2.5">
                <div class="w-1 h-12 rounded-full mt-0.5 flex-shrink-0" style=${{backgroundColor:(job&&job.color)||'#9CA3AF'}}/>
                <div>
                  <div class="flex items-center flex-wrap gap-1.5 mb-0.5">
                    <span class="font-semibold text-gray-800 text-sm">${(job&&job.name)||'לא ידוע'}</span>
                    ${fut&&html`<span class="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded-full">צפוי</span>`}
                    ${s.isPaid&&html`<span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-full">שולם ✓</span>`}
                    ${!s.isPaid&&!fut&&html`<span class="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full">ממתין</span>`}
                    ${s.arrived&&html`<span class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full">הגעת ✓</span>`}
                    ${!s.arrived&&!fut&&html`<span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded-full">● ללא אישור הגעה</span>`}
                  </div>
                  <div class="text-xs text-gray-400">
                    ${new Date(s.date+'T12:00:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'long'})}
                    ${s.hours>0?' · '+s.hours+' שע\''  :''}
                    ${s.travel>0?' · נסיעות '+fmt(s.travel):''}
                    ${s.bonus>0 ?' · בונוס '  +fmt(s.bonus) :''}
                  </div>
                  ${s.notes&&html`<div class="text-xs text-gray-400 mt-0.5 italic">${s.notes}</div>`}
                </div>
              </div>
              <div class="flex items-center gap-1 flex-shrink-0">
                <span class="font-bold text-emerald-600">${fmt(tot)}</span>
                <button onClick=${()=>setModal(s)} class="p-1.5 rounded hover:bg-blue-50 text-gray-400 hover:text-blue-500"><${Icon} name="pencil" size=${15}/></button>
                <button onClick=${()=>del(s.id)}   class="p-1.5 rounded hover:bg-red-50  text-gray-400 hover:text-red-500"><${Icon} name="trash" size=${15}/></button>
              </div>
            </div>
          </div>`;
        })}
      </div>`}

    ${dayModal&&html`<${Modal} title="משמרות ליום" onClose=${()=>setDayModal(null)}>
      <${DayModal} date=${dayModal} shifts=${shifts} jobs=${jobs}
        onEditShift=${s=>{ setModal(s); setDayModal(null); }}
        onDeleteShift=${id=>{ if(confirm('למחוק משמרת זו?')) removeShifts(new Set([id])); }}
        onAddShift=${()=>{ const dd=dayModal; setDayModal(null); setModal({prefillDate:dd}); }}
        onToggleArrived=${s=>setShifts(arr=>arr.map(x=>x.id===s.id?{...x,arrived:!x.arrived}:x))}/>
    <//>`}

    ${deleteModal&&html`<${Modal} title="מחיקה מרובה לפי טווח תאריכים" onClose=${()=>setDeleteModal(false)}>
      <${BulkDeleteForm} shifts=${shifts}
        onDelete=${removeShifts}
        onClose=${()=>setDeleteModal(false)}/>
    <//>`}

    ${bulkModal&&html`<${Modal} title="משמרות לטווח תאריכים" onClose=${()=>setBulkModal(null)}>
      <${BulkShiftForm}
        startDate=${bulkModal.startDate} endDate=${bulkModal.endDate}
        jobs=${jobs} shifts=${shifts}
        onSave=${newShifts=>setShifts(s=>[...s,...newShifts])}
        onDeleteRange=${removeShifts}
        onMarkPaid=${markPaid}
        onMarkArrived=${markArrivedRange}
        onEditRange=${upd=>{const m=new Map(upd.map(u=>[u.id,u]));setShifts(arr=>arr.map(x=>m.get(x.id)||x));}}
        onClose=${()=>setBulkModal(null)}/>
    <//>`}

    ${detailShift&&html`<${Modal} title="פרטי משמרת" onClose=${()=>setDetailShift(null)}>
      <${ShiftDetailModal} shift=${detailShift} jobs=${jobs}
        onEdit=${()=>{ setModal(detailShift); setDetailShift(null); }}
        onDelete=${()=>del(detailShift.id)}
        onClose=${()=>setDetailShift(null)}/>
    <//>`}

    ${modal&&html`<${Modal} title=${editing?'ערוך משמרת':'הוסף משמרת'} onClose=${()=>setModal(null)}>
      <${ShiftForm}
        initial=${editing||(modal.prefillDate?{date:modal.prefillDate}:null)}
        jobs=${jobs} shifts=${shifts} onSave=${save} onClose=${()=>setModal(null)}
        onDelete=${editing?()=>del(editing.id):null}/>
    <//>`}
  </div>`;
}

// ── DashboardPage ────────────────────────────────────────────
function DashboardPage({shifts,setShifts,jobs,settings,payslips,expenses,setTab}) {
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const today=todayS();
  const monthKey=year+'-'+String(month+1).padStart(2,'0');
  const monthPayslips=(payslips||[]).filter(p=>p.month===monthKey);
  // Reimbursements are tracked apart from salary — they are not taxable income
  const monthExpenses=(expenses||[]).filter(x=>x.date.slice(0,7)===monthKey);
  const expTotal=monthExpenses.reduce((n,x)=>n+(x.amount||0),0);
  const expPending=monthExpenses.filter(x=>!x.reimbursed).reduce((n,x)=>n+(x.amount||0),0);

  const d=useMemo(()=>{
    const ms=shifts.filter(s=>{const[y,m]=s.date.split('-').map(Number);return y===year&&m===month+1;});
    const past=ms.filter(s=>s.date<=today), fut=ms.filter(s=>s.date>today);

    // Monthly jobs: add job.rate once per unique monthly job with any shift this month
    const monthlyJobIds=new Set();
    ms.forEach(s=>{ const j=findJob(jobs,s.jobId); if(j&&j.rateType==='monthly') monthlyJobIds.add(s.jobId); });
    const monthlyTotal=Array.from(monthlyJobIds).reduce((n,jid)=>{const j=findJob(jobs,jid);return n+(j?j.rate:0);},0);

    const earn=arr=>arr.reduce((n,s)=>n+s.earnings+shiftTravel(s,jobs)+(s.bonus||0),0);
    const gA=earn(past)+monthlyTotal, gF=earn(ms)+monthlyTotal;
    const paid=earn(past.filter(s=>s.isPaid)), pend=earn(past.filter(s=>!s.isPaid));
    const travelTotal=past.reduce((n,s)=>n+shiftTravel(s,jobs),0);

    // Pension base: only shifts/months where the job is pension-eligible on that date (3-month rule, or manual override)
    const pensionEarn=arr=>arr.reduce((n,s)=>{
      const j=findJob(jobs,s.jobId);
      return pensionEligible(j,s.date) ? n+s.earnings+shiftTravel(s,jobs)+(s.bonus||0) : n;
    },0);
    const monthlyPensionTotal=Array.from(monthlyJobIds).reduce((n,jid)=>{
      const j=findJob(jobs,jid);
      return (j&&pensionEligible(j,today)) ? n+j.rate : n;
    },0);
    const pA=pensionEarn(past)+monthlyPensionTotal, pF=pensionEarn(ms)+monthlyPensionTotal;

    const nA=calcAll(gA,settings.creditPoints,pA), nF=calcAll(gF,settings.creditPoints,pF);
    const byJob={};
    ms.forEach(s=>{
      const k=s.jobId; byJob[k]=byJob[k]||{shifts:0,earn:0};
      byJob[k].shifts++; byJob[k].earn+=s.earnings+shiftTravel(s,jobs)+(s.bonus||0);
    });
    // Add monthly rate to each monthly job's byJob entry
    monthlyJobIds.forEach(jid=>{ const j=findJob(jobs,jid); if(j&&byJob[jid]) byJob[jid].earn+=j.rate; });
    const hrs=ms.reduce((n,s)=>n+(s.hours||0),0);
    return {ms,past,fut,gA,gF,paid,pend,travelTotal,nA,nF,byJob,hrs,monthlyTotal};
  },[shifts,jobs,year,month,settings.creditPoints,today]);

  const allPaid = d.past.length>0 && d.past.every(s=>s.isPaid);

  // Today's shifts — quick "I arrived" button on the home screen
  const todayShifts = shifts.filter(s=>s.date===today);
  const todayArrived = todayShifts.length>0 && todayShifts.every(s=>s.arrived);
  const toggleArrivedToday = () =>
    setShifts&&setShifts(arr=>arr.map(s=>s.date===today?{...s,arrived:!todayArrived}:s));

  // ── Sharing ──
  const [shareScope,setShareScope]=useState(()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');}); // 'all' | 'YYYY-MM'
  const [shareJob,  setShareJob]  =useState('all');   // 'all' | jobId
  const shareMonths=useMemo(()=>{
    const set=new Set(shifts.map(s=>s.date.slice(0,7)));
    const n=new Date(); set.add(n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'));
    return [...set].sort().reverse();
  },[shifts]);
  const shareList=()=>{
    let list = shareScope==='all' ? shifts.slice() : shifts.filter(s=>s.date.slice(0,7)===shareScope);
    if(shareJob!=='all') list=list.filter(s=>s.jobId===shareJob);
    return list.sort((a,b)=>a.date<b.date?-1:1);
  };
  const sharePeriod=()=>{
    if(shareScope==='all') return 'מאז תחילת העבודה';
    const [y,m]=shareScope.split('-').map(Number);
    return MONTHS[m-1]+' '+y;
  };
  // Expenses matching the same period/job selection. Already-reimbursed ones are
  // left out so the request never asks for the same money twice. Images are never shared.
  const shareExpenses=()=>{
    let list=(expenses||[]).filter(x=>!x.reimbursed);
    if(shareScope!=='all') list=list.filter(x=>x.date.slice(0,7)===shareScope);
    if(shareJob!=='all')   list=list.filter(x=>x.jobId===shareJob);
    return list.sort((a,b)=>a.date<b.date?-1:1);
  };

  const shareText=()=>{
    const list=shareList();
    const names=[...new Set(list.map(s=>s.jobId))].map(id=>{const j=findJob(jobs,id);return j?j.name:null;}).filter(Boolean);
    const nameStr=names.length?names.join(', ')+' ':'';
    let txt='סיכום עבודה '+nameStr+'- '+sharePeriod()+'\nימי עבודה - '+list.length;
    const ex=shareExpenses();
    if(ex.length){
      const dm=x=>{const p=x.date.split('-');return p[2]+'/'+p[1];};
      txt+='\n\nהוצאות להחזר:';
      ex.forEach(x=>{ txt+='\n'+dm(x)+' - '+(x.desc||'הוצאה')+' - '+Math.round(x.amount)+' ש"ח'; });
      txt+='\nסה"כ להחזר - '+Math.round(ex.reduce((n,x)=>n+(x.amount||0),0))+' ש"ח';
    }
    return txt;
  };
  // Warn before sharing if some shifts in range were never confirmed as attended
  const confirmArrival=()=>{
    const t=todayS();
    const n=shareList().filter(s=>s.date<=t && !s.arrived).length;
    if(n===0) return true;
    const line = n===1
      ? 'יש משמרת אחת שלא סומנה לגבי הגעה.'
      : 'יש '+n+' משמרות שלא סומנו לגבי הגעה.';
    return confirm('שים לב!\n\n'+line+'\n\nלשתף בכל זאת?');
  };

  // ── Optional receipt attachments ──
  const [attachRcpt,setAttachRcpt]=useState(false);
  const [rcptPick,setRcptPick]=useState(()=>new Set());
  const [rcptBusy,setRcptBusy]=useState('');
  const receipts=shareExpenses().filter(x=>x.driveFileId);
  // Default to everything selected the first time attachments are switched on
  useEffect(()=>{
    if(attachRcpt) setRcptPick(new Set(receipts.map(x=>x.id)));
    else setRcptPick(new Set());
  },[attachRcpt,shareScope,shareJob]);
  const toggleRcpt=id=>setRcptPick(p=>{const n=new Set(p); n.has(id)?n.delete(id):n.add(id); return n;});

  const shareWhatsApp=async()=>{
    if(!confirmArrival()) return;
    const picked=receipts.filter(x=>rcptPick.has(x.id));

    if(attachRcpt && picked.length){
      if(!_gToken){ alert('כדי לצרף חשבוניות יש להתחבר ל-Google.'); return; }
      setRcptBusy('מוריד חשבוניות...');
      try{
        const files=[];
        for(const x of picked){
          const r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(x.driveFileId)+'?alt=media',
            {headers:{Authorization:'Bearer '+_gToken}});
          if(!r.ok) throw new Error('הורדה נכשלה');
          const b=await r.blob();
          files.push(new File([b], x.fileName||('חשבונית_'+x.date+'.jpg'), {type:b.type||'image/jpeg'}));
        }
        setRcptBusy('מכין כרטיס פתיחה...');
        // iPhone drops the shared text next to files, so the card carries it there
        const card=await makeShareCard(sharePeriod(), IS_IOS?shareText():'');
        const out=card?[card,...files]:files;
        setRcptBusy('');
        if(navigator.canShare&&navigator.canShare({files:out})){
          try{ await navigator.share({files:out,text:shareText()}); return; }
          catch(e){ if(e.name==='AbortError') return; }
        }
        // No file-share support (usually desktop) — send the text and hand over the files
        alert('המכשיר לא תומך בשליחת קבצים ישירות. הטקסט ייפתח בוואטסאפ והחשבוניות יורדו למכשיר.');
        out.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();});
      }catch(e){ setRcptBusy(''); alert('שגיאה בהורדת החשבוניות: '+e.message); return; }
    }
    // On phones, the system share sheet sends the text and returns to the app.
    // A wa.me tab is kept for desktop only — on an installed iOS app it opened
    // an in-app browser window that lingered as a blank overlay after sending.
    if(navigator.share && /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent)){
      try{ await navigator.share({text:shareText()}); return; }
      catch(e){ if(e.name==='AbortError') return; }
    }
    window.open('https://wa.me/?text='+encodeURIComponent(shareText()),'_blank','noopener,noreferrer');
  };
  const exportExcel=async()=>{
    if(!confirmArrival()) return;
    const rows=shareList();
    const head=['משרה','יום','תאריך'];
    let tbl='<table border="1"><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
    rows.forEach(s=>{
      const job=findJob(jobs,s.jobId);
      const dow=new Date(s.date+'T12:00:00').toLocaleDateString('he-IL',{weekday:'long'});
      const cells=[(job&&job.name)||'',dow,s.date];
      // escapeHtml blocks markup injection; the leading-quote guard blocks Excel formula injection (=,+,-,@)
      tbl+='<tr>'+cells.map(c=>{const s2=String(c);return '<td>'+escapeHtml(/^[=+\-@]/.test(s2)?"'"+s2:s2)+'</td>';}).join('')+'</tr>';
    });
    tbl+='</table>';
    // Expenses table (amounts + dates only — receipt images are never included)
    const ex=shareExpenses();
    if(ex.length){
      const cell=c=>{const s2=String(c);return '<td>'+escapeHtml(/^[=+\-@]/.test(s2)?"'"+s2:s2)+'</td>';};
      tbl+='<br/><table border="1"><tr><th>תאריך</th><th>תיאור</th><th>סכום (₪)</th></tr>';
      ex.forEach(x=>{
        const label=x.desc||'הוצאה';
        tbl+='<tr>'+cell(x.date)+cell(label)+cell(Math.round(x.amount))+'</tr>';
      });
      tbl+='<tr><td></td><td><b>סה"כ להחזר</b></td>'+cell(Math.round(ex.reduce((n,x)=>n+(x.amount||0),0)))+'</tr></table>';
    }
    const content='<html><head><meta charset="utf-8"></head><body>'+tbl+'</body></html>';
    const blob=new Blob([content],{type:'application/vnd.ms-excel'});
    const name='משמרות_'+sharePeriod().replace(/\s/g,'_')+'.xls';
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'סיכום משמרות',text:shareText()}); return; }catch(e){ if(e.name==='AbortError') return; }

    ${d.monthlyTotal>0&&html`<div class="text-xs text-gray-500">כולל שכר חודשי קבוע ${fmt(d.monthlyTotal)}</div>`}

    ${shifts.length>0&&html`

        ${(()=>{
