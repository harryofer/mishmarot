name = "mishmarot-push"
main = "worker.js"
compatibility_date = "2024-11-01"

# Checks every 15 minutes and sends whatever reminder is due
[triggers]
crons = ["*/15 * * * *"]

# Replace id with the KV namespace id you create (see README)
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_YOUR_KV_ID"
