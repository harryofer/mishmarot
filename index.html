    // Service Worker (HTTPS only)
    if('serviceWorker' in navigator && location.protocol!=='file:') {
      const sw=`const C='sw-v1';
self.addEventListener('install',()=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  e.respondWith(caches.open(C).then(c=>c.match(e.request).then(h=>h||fetch(e.request).then(r=>{
    if(r.ok&&r.type!=='opaque')c.put(e.request,r.clone());return r;
  }))));
});`;
      navigator.serviceWorker.register(
        URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))
      ).catch(()=>{});

function hoursBetween(st,et){
  if(!st||!et) return 0;
  const [sh,sm]=st.split(':').map(Number), [eh,em]=et.split(':').map(Number);
  let mins=(eh*60+em)-(sh*60+sm);
  if(mins<=0) mins+=24*60; // overnight shift
  return Math.round((mins/60)*100)/100;
}
function dateRange(a,b) {
  const s=a<b?a:b, e=a<b?b:a, out=[];
  const cur=new Date(s+'T12:00:00'), end=new Date(e+'T12:00:00');
  while(cur<=end){ out.push(cur.toISOString().slice(0,10)); cur.setDate(cur.getDate()+1); }
  return out;
}

// Module-level Google token (survives tab switches, clears on page reload)
let _gToken = null;

// Calendar deletions are queued so they survive missing/expired tokens and retry later
function enqueueGcalDel(ids){
  try{
    const q=JSON.parse(localStorage.getItem('sw_gcal_del')||'[]');
    localStorage.setItem('sw_gcal_del',JSON.stringify([...new Set([...q,...ids])]));
  }catch(e){}
}
async function processGcalDelQueue(){
  if(!_gToken) return;
  let q=[]; try{ q=JSON.parse(localStorage.getItem('sw_gcal_del')||'[]'); }catch(e){}
  if(!q.length) return;
  const remaining=[];
  for(const id of q){
    try{
      const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/'+id,
        {method:'DELETE',headers:{Authorization:'Bearer '+_gToken}});
      if(!(r.ok||r.status===404||r.status===410)) remaining.push(id);
    }catch(e){ remaining.push(id); }
  }
  try{ localStorage.setItem('sw_gcal_del',JSON.stringify(remaining)); }catch(e){}
}
function deleteGcalEvent(id){
  if(!id) return;
  enqueueGcalDel([id]);
  processGcalDelQueue();
}
async function uploadFileToDrive(file,meta){
  const boundary='-------314159265358979323846';
  const metaPart='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n';
  const filePart='--'+boundary+'\r\nContent-Type: '+(file.type||'application/octet-stream')+'\r\n\r\n';
  const endPart='\r\n--'+boundary+'--';
  const body=new Blob([metaPart,filePart,file,endPart]);
  const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{
    method:'POST',headers:{Authorization:'Bearer '+_gToken,'Content-Type':'multipart/related; boundary='+boundary},body});
  const j=await r.json();
  if(j.error) throw new Error(j.error.message||'שגיאת העלאה');
  return j;
}
async function deleteDriveFile(id){
  if(!id||!_gToken) return;

// ── Tax (Israel 2026 estimate) ───────────────────────────────
const BRACKETS  = [{l:7380,r:.10},{l:10620,r:.14},{l:17040,r:.20},{l:22440,r:.31},{l:46640,r:.35},{l:60130,r:.47},{l:1e9,r:.50}];
const CVAL=242, NI_FL=6970, NI_CL=49030;
// Miluim (reserve duty) daily compensation bounds — Bituach Leumi estimates, editable by the user
const MILUIM_MIN_DAY=310, MILUIM_MAX_DAY=1650, MILUIM_COLOR='#4B5320';

function calcTax(g, pts) {
  let tax=0, prev=0;
  for (const {l,r} of BRACKETS) {
    if (g<=prev) break;
    tax += (Math.min(g,l)-prev)*r; prev=l;
  }
  return Math.max(0, tax - pts*CVAL);
}
function calcNI(g) {
  const c=Math.min(g,NI_CL);
  if (c<=NI_FL) return {ni:c*.004, he:c*.031};
  return {ni:NI_FL*.004+(c-NI_FL)*.07, he:NI_FL*.031+(c-NI_FL)*.05};
}
function calcAll(g,pts,pensionBase) {
  if (!g||g<=0) return {gross:0,incomeTax:0,ni:0,health:0,pension:0,total:0,net:0};
  pts = pts||2.25;
  const pb = pensionBase==null ? g : pensionBase;
  const incomeTax=calcTax(g,pts), {ni,he:health}=calcNI(g), pension=pb*.06;
  const total=incomeTax+ni+health+pension;
  return {gross:g,incomeTax,ni,health,pension,total,net:Math.max(0,g-total)};
}
// Pension in Israel typically starts only after 3 months of employment (then paid retroactively)
function addMonths(dateStr,n){
  const d=new Date(dateStr+'T12:00:00'); d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}
function pensionEligible(job,dateStr){
  if(!job) return true;
  const mode=job.pensionMode||'auto';
  if(mode==='always') return true;
  if(mode==='never') return false;
  if(!job.startDate) return true;
  return dateStr >= addMonths(job.startDate,3);
}

// ── useLS hook ───────────────────────────────────────────────
function useLS(key, def) {
  const [v,setV] = useState(() => {
    try { const s=localStorage.getItem(key); return s ? JSON.parse(s) : def; }
    catch(e) { return def; }
  });
  const set = useCallback(next => {
    setV(prev => {
      const val = typeof next==='function' ? next(prev) : next;
      try { localStorage.setItem(key,JSON.stringify(val)); } catch(e) {}
      return val;
    });
  },[key]);
  return [v,set];
}

// ── findJob helper ───────────────────────────────────────────
function findJob(jobs, id) { return jobs.find(j=>j.id===id)||null; }
// Travel for a shift: its own value, or fall back to the job's per-day travel (so existing shifts pick it up)
function shiftTravel(s, jobs) {
  if (s.travel!=null && s.travel!==0) return s.travel;
  const j=findJob(jobs,s.jobId);
  return (j&&j.travelPerDay)||0;
}

// ── Modal ────────────────────────────────────────────────────
function Modal({title, onClose, children}) {
  useEffect(()=>{
    const h = e => { if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[onClose]);
  return html`
    <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-3"
      onClick=${e=>e.target===e.currentTarget&&onClose()}>
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] overflow-y-auto fade">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100 sticky top-0 bg-white rounded-t-2xl">
          <h2 class="font-bold text-gray-800">${title}</h2>
          <button onClick=${onClose} class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-500 text-xl">×</button>
        </div>
        <div class="p-5">${children}</div>
      </div>
    </div>`;
}

        class=${'w-8 h-8 rounded-full transition-all '+(value===c?'ring-2 ring-offset-2 ring-gray-700 scale-110':'hover:scale-105')}
        style=${{backgroundColor:c}}/>`)}

}

// ── MonthNav ─────────────────────────────────────────────────
function MonthNav({year,month,onChange}) {
  const go = d => { let m=month+d,y=year; if(m<0){m=11;y--;} if(m>11){m=0;y++;} onChange(y,m); };
  const now=new Date(), isCur=year===now.getFullYear()&&month===now.getMonth();
  return html`<div class="flex items-center gap-2">
    <button onClick=${()=>go(-1)} class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-600 text-lg">←</button>
    <span class="font-semibold text-gray-700 min-w-[7rem] text-center text-sm">${MONTHS[month]} ${year}</span>
    <button onClick=${()=>go(1)}  class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-600 text-lg">→</button>
    <button onClick=${()=>!isCur&&onChange(now.getFullYear(),now.getMonth())}
      class=${'text-xs border rounded px-1.5 py-0.5 w-[2.75rem] text-center transition-opacity '+(isCur?'opacity-0 pointer-events-none border-transparent':'text-blue-600 border-blue-200 hover:bg-blue-50')}>
      היום</button>
  </div>`;
}

// ── MonthStrip (quick month jump bar) ────────────────────────
function MonthStrip({year,month,onChange}) {
  const now=new Date();
  return html`<div class="space-y-1.5">
    <div class="flex items-center justify-center gap-4">
      <button onClick=${()=>onChange(year-1,month)} class="text-gray-400 hover:text-gray-600 text-base px-2">‹</button>
      <span class="text-sm font-bold text-gray-700 w-14 text-center">${year}</span>
      <button onClick=${()=>onChange(year+1,month)} class="text-gray-400 hover:text-gray-600 text-base px-2">›</button>
    </div>
    <div class="flex gap-1.5 overflow-x-auto py-0.5">
      ${MONTHS.map((l,i)=>{
        const sel=i===month, isNow=year===now.getFullYear()&&i===now.getMonth();
        return html`<button key=${i} onClick=${()=>onChange(year,i)}
          class=${'flex-shrink-0 px-3 py-1 rounded-full text-xs font-medium transition-colors '+(sel?'bg-blue-500 text-white':isNow?'bg-blue-50 text-blue-600 border border-blue-200':'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
          ${l}</button>`;
      })}
    </div>
  </div>`;
}

// ── StatCard ─────────────────────────────────────────────────
function StatCard({label,value,sub,color,icon}) {

// ── ShiftForm ────────────────────────────────────────────────
function ShiftForm({initial, jobs, shifts, onSave, onClose, onDelete}) {
  const jobInit = findJob(jobs,(initial&&initial.jobId)||(jobs[0]&&jobs[0].id));
  const [jobId,  setJobId]  = useState((initial&&initial.jobId)||(jobs[0]&&jobs[0].id)||'');
  const [date,   setDate]   = useState((initial&&initial.date)||todayS());
  const [startTime,setStartTime]=useState((initial&&initial.startTime)||(jobInit&&jobInit.startTime)||'08:00');
  const [endTime,  setEndTime]  =useState((initial&&initial.endTime)  ||(jobInit&&jobInit.endTime)  ||'16:00');
  const [travel, setTravel] = useState(initial&&initial.travel!=null?initial.travel:((jobInit&&jobInit.travelPerDay)||0));
  const [bonus,  setBonus]  = useState(initial&&initial.bonus!=null?initial.bonus:0);
  const [isPaid, setIsPaid] = useState(initial&&initial.isPaid!=null?initial.isPaid:false);
  const [arrived,setArrived]= useState(initial&&initial.arrived!=null?initial.arrived:false);
  const [notes,  setNotes]  = useState((initial&&initial.notes)||'');

  const job        = findJob(jobs,jobId);
  const isMonthly  = job && job.rateType==='monthly';
  const variable   = job && job.hoursMode==='variable';

  // When the selected job changes, reset hours to that job's defined hours
  const firstRun=useRef(true);
  useEffect(()=>{
    if(firstRun.current){ firstRun.current=false; return; }
    const j=findJob(jobs,jobId);
    if(j){ setStartTime(j.startTime||'08:00'); setEndTime(j.endTime||'16:00'); setTravel(j.travelPerDay||0); }
  },[jobId]);

  const hours      = hoursBetween(startTime,endTime);
  const baseEarn   = isMonthly ? 0 : (job?((job.rateType==='daily'||job.rateType==='miluim')?job.rate:job.rate*hours):0);
  const total      = baseEarn+(+travel||0)+(+bonus||0);

  const submit = () => {
    if (!jobId) return alert('יש לבחור משרה');
    if (!date)  return alert('יש לבחור תאריך');
    onSave({jobId,date,hours,startTime,endTime,travel:+travel||0,bonus:+bonus||0,isPaid,arrived,notes,earnings:baseEarn});
  };

  if (!jobs.length) return html`<div class="text-center py-8 text-gray-400">
    <div class="flex justify-center mb-2 text-gray-300"><${Icon} name="briefcase" size=${36}/></div>
    <p>אין משרות. הוסף משרה קודם בלשונית "משרות".</p>
    <button onClick=${onClose} class="mt-4 text-blue-500 underline text-sm">סגור</button>
  </div>`;

  return html`<div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">משרה</label>
      <select value=${jobId} onChange=${e=>setJobId(e.target.value)}
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
        ${jobs.map(j=>html`<option key=${j.id} value=${j.id}>${j.name}</option>`)}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">תאריך</label>
      <input type="date" value=${date} onChange=${e=>setDate(e.target.value)}
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
    </div>
    ${isMonthly?html`
      <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm text-blue-700">
        <${Icon} name="briefcase" size=${14}/> משרה חודשית — שכר חודשי: <strong>${fmt(job.rate)}</strong> (מחושב אוטומטית פעם בחודש)
      </div>`:html`
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          שעות עבודה ${variable?html`<span class="text-blue-400 font-normal text-xs">(ניתן לעריכה ליום זה)</span>`:html`<span class="text-gray-400 font-normal text-xs">(קבוע למשרה)</span>`}
        </label>
        ${variable?html`
          <div class="grid grid-cols-2 gap-3">
            <div><span class="block text-xs text-gray-400 mb-1">משעה</span>
              <input type="time" value=${startTime} onChange=${e=>setStartTime(e.target.value)}
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/></div>
            <div><span class="block text-xs text-gray-400 mb-1">עד שעה</span>
              <input type="time" value=${endTime} onChange=${e=>setEndTime(e.target.value)}
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/></div>
          </div>`:html`
          <div class="bg-slate-50 rounded-lg px-3 py-2 text-sm text-gray-600">${startTime}–${endTime}</div>`}
        <div class="text-xs text-gray-400 mt-1">סה"כ ${hours} שעות עבודה</div>
      </div>`}
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">נסיעות (₪)</label>
        <input type="number" value=${travel} onInput=${e=>setTravel(e.target.value)} placeholder="0"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">בונוס (₪)</label>
        <input type="number" value=${bonus} onInput=${e=>setBonus(e.target.value)} placeholder="0"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
    </div>
    ${job&&html`<div class="bg-slate-50 rounded-lg px-3 py-2 text-sm">
      <span class="text-gray-500">סה"כ משמרת: </span>
      <span class="font-bold text-emerald-600 text-base">${fmt(total)}</span>
      ${!isMonthly&&html`<span class="text-gray-400 text-xs"> (${job.rateType==='daily'?fmt(job.rate)+' יומי':job.rateType==='miluim'?fmt(job.rate)+' תגמול יומי':fmt(job.rate)+'/שעה × '+hours})</span>`}
    </div>`}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">הערות</label>
      <textarea rows="2" value=${notes} onInput=${e=>setNotes(e.target.value)} placeholder="אופציונלי..."
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none"></textarea>
    </div>
    <label class="flex items-center gap-2 cursor-pointer">
      <input type="checkbox" checked=${arrived} onChange=${e=>setArrived(e.target.checked)} class="w-4 h-4 rounded"/>
      <span class="text-sm text-gray-700">הגעתי לעבודה ביום זה ✓</span>
    </label>
    <label class="flex items-center gap-2 cursor-pointer">
      <input type="checkbox" checked=${isPaid} onChange=${e=>setIsPaid(e.target.checked)} class="w-4 h-4 rounded"/>
      <span class="text-sm text-gray-700">משמרת זו שולמה ✓</span>
    </label>
    <div class="flex gap-2 pt-1">
      <button onClick=${submit} class="flex-1 bg-blue-500 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors">שמור</button>
      <button onClick=${onClose} class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition-colors">ביטול</button>
    </div>
    ${onDelete&&html`
      <button onClick=${onDelete}
        class="w-full border border-red-200 text-red-500 py-2 rounded-lg text-sm font-medium hover:bg-red-50 transition-colors mt-1">
        <${Icon} name="trash" size=${14}/> מחק משמרת זו
      </button>`}
  </div>`;
}

// ── CalendarView ─────────────────────────────────────────────
function CalendarView({year,month,shifts,jobs,onDayClick,onShiftClick,onRangeSelect}) {
  const days=mDays(year,month), first=new Date(year,month,1).getDay(), today=todayS();
  const [dragStart,setDragStart]=useState(null);
  const [dragEnd,  setDragEnd]  =useState(null);
  const dragRef=useRef({active:false,start:null,end:null});
  const tRef=useRef({timer:null,pendingTap:null,moved:false,isTouch:false});

  const commitDrag=useCallback(()=>{
    const {start,end}=dragRef.current;
    dragRef.current={active:false,start:null,end:null};
    setDragStart(null); setDragEnd(null);
    if(start&&end&&start!==end) { onRangeSelect&&onRangeSelect(start,end); }
    else if(start) { onDayClick(start); }
  },[onDayClick,onRangeSelect]);

  useEffect(()=>{
    const up=()=>{ if(dragRef.current.active) commitDrag(); };
    window.addEventListener('mouseup',up);
    return ()=>window.removeEventListener('mouseup',up);
  },[commitDrag]);

  // ── Touch (long-press to select / drag) ──
  useEffect(()=>{
    const move=e=>{
      if(!dragRef.current.active){
        tRef.current.moved=true;
        clearTimeout(tRef.current.timer);
        return;
      }
      e.preventDefault();
      const t=e.touches[0]; if(!t) return;
      const el=document.elementFromPoint(t.clientX,t.clientY);
      const dd=el&&el.closest&&el.closest('[data-date]');
      if(dd){ const ds=dd.getAttribute('data-date'); dragRef.current.end=ds; setDragEnd(ds); }
    };
    const end=()=>{
      clearTimeout(tRef.current.timer);
      if(dragRef.current.active){ commitDrag(); }
      else if(tRef.current.pendingTap&&!tRef.current.moved){ onDayClick(tRef.current.pendingTap); }
      tRef.current.pendingTap=null; tRef.current.moved=false;
    };
    window.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('touchend',end);
    return ()=>{ window.removeEventListener('touchmove',move); window.removeEventListener('touchend',end); };
  },[commitDrag,onDayClick]);

  const selSet=useMemo(()=>{
    if(!dragStart||!dragEnd) return new Set();
    return new Set(dateRange(dragStart,dragEnd));
  },[dragStart,dragEnd]);

  const byDay={};
  shifts.forEach(s=>{ const d=+s.date.slice(8); (byDay[d]=byDay[d]||[]).push(s); });
  const cells=[...Array(first).fill(null),...Array.from({length:days},(_,i)=>i+1)];

  return html`<div>
    <div class="flex items-center justify-between mb-2 px-1">
      <span class="text-xs font-medium text-gray-500">${MONTHS[month]} ${year}</span>
      <span class="text-xs font-semibold text-blue-600 bg-blue-50 rounded-full px-2 py-0.5">${shifts.length} משמרות החודש</span>
    </div>
    <div class="grid grid-cols-7 gap-0.5 mb-1">
      ${DAYS.map(d=>html`<div key=${d} class="text-center text-xs font-medium text-gray-400 py-1">${d}</div>`)}
    </div>
    <div class="grid grid-cols-7 gap-0.5">
      ${cells.map((day,i)=>{
        if(!day) return html`<div key=${'e'+i}/>`;
        const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const ds2=byDay[day]||[], isT=ds===today, isPast=ds<today, inDrag=selSet.has(ds);
        const cls='min-h-[4rem] rounded-lg p-1 cursor-pointer border transition-colors select-none '+
          (inDrag?'cal-drag ':isT?'border-blue-400 bg-blue-50 ':
           'border-transparent hover:border-gray-200 hover:bg-gray-50 ')+
          (isPast&&!isT&&!inDrag?'bg-gray-50/40':'');
        return html`<div key=${day} class=${cls} data-date=${ds}
          onMouseDown=${e=>{
            if(tRef.current.isTouch) return;
            e.preventDefault();
            dragRef.current={active:true,start:ds,end:ds};
            setDragStart(ds); setDragEnd(ds);
          }}
          onMouseEnter=${()=>{
            if(!dragRef.current.active) return;
            dragRef.current.end=ds;
            setDragEnd(ds);
          }}
          onTouchStart=${e=>{
            tRef.current.isTouch=true;
            tRef.current.dragged=false;
            tRef.current.pendingTap=ds; tRef.current.moved=false;
            clearTimeout(tRef.current.timer);
            tRef.current.timer=setTimeout(()=>{
              tRef.current.dragged=true;
              dragRef.current={active:true,start:ds,end:ds};
              setDragStart(ds); setDragEnd(ds);
              navigator.vibrate&&navigator.vibrate(30);
            },350);
          }}>
          <div class=${'text-xs font-semibold mb-0.5 '+(isT?'text-blue-600':'text-gray-500')}>${day}</div>
          ${ds2.slice(0,2).map(s=>{ const j=findJob(jobs,s.jobId); return html`
            <div key=${s.id} data-shift="1" onClick=${e=>{e.stopPropagation();if(tRef.current.dragged)return;onShiftClick(s);}}
              class="text-[10px] px-1 py-0.5 rounded text-white break-words leading-tight mb-0.5 hover:opacity-80"
              style=${{backgroundColor:(j&&j.color)||'#9CA3AF'}}>${(j&&j.name)||'?'}</div>`;})}
          ${ds2.length>2&&html`<div class="text-[10px] text-gray-400">+${ds2.length-2}</div>`}
        </div>`;
      })}
    </div>
    ${selSet.size>0
      ? html`<div class="mt-2 text-xs text-blue-600 text-center">נבחרו ${selSet.size} ימים</div>`
      : html`<div class="mt-2 text-[11px] text-gray-400 text-center">לחיצה ארוכה (על יום או משמרת) + גרירה לבחירת טווח ימים</div>`}
  </div>`;
}

// ── BulkShiftForm ────────────────────────────────────────────
function BulkShiftForm({startDate,endDate,jobs,shifts,onSave,onDeleteRange,onMarkPaid,onClose}) {
  const [jobId,     setJobId]     = useState((jobs[0]&&jobs[0].id)||'');
  const [sDate,     setSDate]     = useState(startDate||todayS());
  const [eDate,     setEDate]     = useState(endDate||todayS());
  const [hours,     setHours]     = useState(8);
  const [travel,    setTravel]    = useState((jobs[0]&&jobs[0].travelPerDay)||0);
  const [skipExist, setSkipExist] = useState(true);

  const bFirst=useRef(true);
  useEffect(()=>{
    if(bFirst.current){ bFirst.current=false; return; }
    const j=findJob(jobs,jobId); if(j) setTravel(j.travelPerDay||0);
  },[jobId]);

  const job      = findJob(jobs,jobId);
  const isMonthly= job&&job.rateType==='monthly';
  const range    = useMemo(()=>sDate&&eDate?dateRange(sDate,eDate):[], [sDate,eDate]);
  const existSet = useMemo(()=>new Set((shifts||[]).map(s=>s.date)), [shifts]);
  const toAdd    = range.filter(d=>!skipExist||!existSet.has(d));

  const submit=()=>{
    if(!jobId) return alert('יש לבחור משרה');
    if(!sDate||!eDate) return alert('יש לבחור טווח תאריכים');
    if(toAdd.length===0) return alert('אין תאריכים חדשים להוסיף בטווח זה');
    const newShifts=toAdd.map(d=>{
      const earn=isMonthly?0:(job?((job.rateType==='daily'||job.rateType==='miluim')?job.rate:job.rate*(+hours||0)):0);
      return {id:genId(),jobId,date:d,hours:+hours||0,startTime:(job&&job.startTime)||'08:00',endTime:(job&&job.endTime)||'16:00',travel:+travel||0,bonus:0,isPaid:false,notes:'',earnings:earn};
    });
    onSave(newShifts); onClose();
  };

  return html`<div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">משרה</label>
      <select value=${jobId} onChange=${e=>setJobId(e.target.value)}
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
        ${jobs.map(j=>html`<option key=${j.id} value=${j.id}>${j.name}</option>`)}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">מתאריך</label>
        <input type="date" value=${sDate} onChange=${e=>setSDate(e.target.value)}
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">עד תאריך</label>
        <input type="date" value=${eDate} onChange=${e=>setEDate(e.target.value)}
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
    </div>
    ${!isMonthly&&html`
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">שעות יומיות</label>
        <input type="number" step="0.5" min="0" value=${hours} onInput=${e=>setHours(e.target.value)}
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">נסיעות יומי (₪)</label>
        <input type="number" value=${travel} onInput=${e=>setTravel(e.target.value)} placeholder="0"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
    </div>`}
    <label class="flex items-center gap-2 cursor-pointer select-none">
      <input type="checkbox" checked=${skipExist} onChange=${e=>setSkipExist(e.target.checked)} class="w-4 h-4 rounded"/>
      <span class="text-sm text-gray-700">דלג על תאריכים שכבר יש בהם משמרת</span>
    </label>
    <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm text-blue-700">
      <strong>${toAdd.length}</strong> משמרות יתווספו מתוך <strong>${range.length}</strong> ימים בטווח
    </div>
    <div class="flex gap-2 pt-1">
      <button onClick=${submit}
        class="flex-1 bg-blue-500 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors">
        הוסף ${toAdd.length} משמרות</button>
      <button onClick=${onClose}
        class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition-colors">
        ביטול</button>
    </div>
    ${onMarkPaid&&html`
      <button onClick=${()=>{
        const rangeSet=new Set(range);
        const inRange=(shifts||[]).filter(s=>rangeSet.has(s.date));
        if(inRange.length===0) return alert('אין משמרות קיימות בטווח זה לסימון');
        if(!confirm('לסמן '+inRange.length+' משמרות בטווח כשולם?')) return;
        onMarkPaid(new Set(inRange.map(s=>s.id)));
        onClose();
      }}
        class="w-full border border-emerald-200 text-emerald-600 py-2 rounded-lg text-sm font-medium hover:bg-emerald-50 transition-colors">
        <${Icon} name="wallet" size=${14}/> סמן משמרות בטווח כשולם</button>`}
    ${onDeleteRange&&html`
      <button onClick=${()=>{
        const rangeSet=new Set(range);
        const inRange=(shifts||[]).filter(s=>rangeSet.has(s.date));
        if(inRange.length===0) return alert('אין משמרות קיימות בטווח זה למחיקה');
        if(!confirm('למחוק '+inRange.length+' משמרות קיימות בטווח שנבחר?')) return;
        onDeleteRange(new Set(inRange.map(s=>s.id)));
        onClose();
      }}
        class="w-full border border-red-200 text-red-500 py-2 rounded-lg text-sm font-medium hover:bg-red-50 transition-colors">
        <${Icon} name="trash" size=${14}/> מחק משמרות קיימות בטווח</button>`}
  </div>`;
}

// ── BulkDeleteForm ───────────────────────────────────────────
function BulkDeleteForm({shifts, onDelete, onClose}) {
  const [sDate, setSDate] = useState('');
  const [eDate, setEDate] = useState('');

  const toDelete = useMemo(()=>{
    if(!sDate||!eDate) return [];
    const r = new Set(dateRange(sDate, eDate));
    return shifts.filter(s=>r.has(s.date));
  },[shifts,sDate,eDate]);

  const submit = () => {
    if(!sDate||!eDate) return alert('יש לבחור טווח תאריכים');
    if(toDelete.length===0) return alert('אין משמרות בטווח זה');
    if(!confirm('למחוק '+toDelete.length+' משמרות לצמיתות?')) return;
    onDelete(new Set(toDelete.map(s=>s.id)));
    onClose();
  };

  return html`<div class="space-y-4">
    <div class="bg-red-50 border border-red-100 rounded-lg p-3 text-sm text-red-600">
      פעולה זו תמחק לצמיתות את כל המשמרות בטווח התאריכים שנבחר.
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">מתאריך</label>
        <input type="date" value=${sDate} onChange=${e=>setSDate(e.target.value)}
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">עד תאריך</label>
        <input type="date" value=${eDate} onChange=${e=>setEDate(e.target.value)}
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-300"/>
      </div>
    </div>
    ${sDate&&eDate&&html`<div class=${'rounded-lg p-3 text-sm text-center font-semibold '+(toDelete.length>0?'bg-red-50 text-red-600 border border-red-100':'bg-gray-50 text-gray-500')}>
      ${toDelete.length>0?toDelete.length+' משמרות יימחקו':'אין משמרות בטווח זה'}
    </div>`}
    <div class="flex gap-2 pt-1">
      <button onClick=${submit}
        class=${'flex-1 py-2 rounded-lg text-sm font-semibold transition-colors '+(toDelete.length>0?'bg-red-500 text-white hover:bg-red-600':'bg-gray-200 text-gray-400 cursor-not-allowed')}>
        <${Icon} name="trash" size=${14}/> מחק ${toDelete.length>0?toDelete.length+' משמרות':''}
      </button>
      <button onClick=${onClose}
        class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition-colors">
        ביטול
      </button>
    </div>
  </div>`;
}

// ── JobsPage ─────────────────────────────────────────────────
function JobsPage({jobs,setJobs,shifts,setShifts}) {
  const [modal,setModal]=useState(null);
  const [applyModal,setApplyModal]=useState(null); // {job,oldJob} after editing a job that has shifts
  const editing = (modal&&modal!=='add') ? findJob(jobs,modal) : null;
  const save = data => {
    if(editing){
      const oldJob=editing, newJob={...editing,...data};
      setJobs(j=>j.map(x=>x.id===editing.id?newJob:x));
      if((shifts||[]).some(s=>s.jobId===editing.id)) setApplyModal({job:newJob,oldJob});
    } else {
      setJobs(j=>[...j,{id:genId(),...data}]);
    }
    setModal(null);
  };
  const del = id => { if(confirm('למחוק משרה זו?')) setJobs(j=>j.filter(x=>x.id!==id)); };

  // Apply the edited job's rate/hours/travel to existing shifts (all, or from a given date)
  const applyToShifts = fromDate => {
    const {job,oldJob}=applyModal;
    setShifts(arr=>arr.map(s=>{
      if(s.jobId!==job.id) return s;
      if(fromDate && s.date<fromDate) return s;
      const variable=job.hoursMode==='variable';
      const st=variable?(s.startTime||job.startTime||'08:00'):(job.startTime||'08:00');
      const et=variable?(s.endTime  ||job.endTime  ||'16:00'):(job.endTime  ||'16:00');
      const hrs=hoursBetween(st,et);
      const earn=job.rateType==='monthly'?0:((job.rateType==='daily'||job.rateType==='miluim')?job.rate:job.rate*hrs);
      let travel=s.travel;
      if((job.travelPerDay||0)!==(oldJob.travelPerDay||0)){
        if(!travel || travel===(oldJob.travelPerDay||0)) travel=job.travelPerDay||0;
      }
      return {...s,startTime:st,endTime:et,hours:hrs,earnings:earn,travel};
    }));
    setApplyModal(null);
  };
  return html`<div class="space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-base font-bold text-gray-800">המשרות שלי</h2>
      <button onClick=${()=>setModal('add')} class="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-600 transition-colors">+ הוסף משרה</button>
    </div>
    ${jobs.length===0?html`
      <div class="text-center py-16 text-gray-400 bg-white rounded-xl border border-gray-100">
        <div class="flex justify-center mb-3 text-gray-300"><${Icon} name="briefcase" size=${44}/></div>
        <div class="font-medium">אין משרות עדיין</div>
        <div class="text-sm mt-1">הוסף את המשרה הראשונה שלך</div>
      </div>`:html`
      <div class="grid gap-3 sm:grid-cols-2">
        ${jobs.map(job=>html`<div key=${job.id} class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm fade">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-full flex-shrink-0" style=${{backgroundColor:job.color}}/>
              <div>
                <div class="font-semibold text-gray-800">${job.name}</div>
                <div class="text-sm text-gray-500">${job.rateType==='daily'?fmt(job.rate)+' ליום':job.rateType==='hourly'?fmt(job.rate)+' לשעה':job.rateType==='miluim'?fmt(job.rate)+' תגמול ליום':fmt(job.rate)+' לחודש'}</div>
              </div>
            </div>
            <div class="flex gap-1">
              <button onClick=${()=>setModal(job.id)} class="p-1.5 rounded hover:bg-blue-50 text-gray-400 hover:text-blue-500"><${Icon} name="pencil" size=${15}/></button>
              <button onClick=${()=>del(job.id)}      class="p-1.5 rounded hover:bg-red-50  text-gray-400 hover:text-red-500"><${Icon} name="trash" size=${15}/></button>
            </div>
          </div>
        </div>`)}
      </div>`}
    ${modal&&html`<${Modal} title=${modal==='add'?'הוסף משרה':'ערוך משרה'} onClose=${()=>setModal(null)}>
      <${JobForm} initial=${editing} shifts=${shifts} onSave=${save} onClose=${()=>setModal(null)}/>
    <//>`}
    ${applyModal&&html`<${Modal} title="עדכון משמרות קיימות" onClose=${()=>setApplyModal(null)}>
      <${ApplyJobChanges} jobName=${applyModal.job.name} onApply=${applyToShifts} onSkip=${()=>setApplyModal(null)}/>
    <//>`}
  </div>`;
}

              <div class="flex items-center gap-2 flex-1 cursor-pointer" onClick=${()=>onEditShift(s)}>
                <div class="w-1 h-9 rounded-full flex-shrink-0" style=${{backgroundColor:(job&&job.color)||'#9CA3AF'}}/>
                <div>
                  <div class="text-sm font-semibold text-gray-800">${(job&&job.name)||'לא ידוע'}</div>
                  <div class="text-xs text-gray-400">${s.hours>0?s.hours+' שע\' · ':''}${fmt(tot)}${s.isPaid?' · שולם ✓':''}${s.arrived?' · הגעת ✓':''}</div>
                </div>
              </div>
              <div class="flex gap-1 flex-shrink-0">
                <button onClick=${()=>onEditShift(s)}    class="p-1.5 rounded hover:bg-blue-50 text-gray-400 hover:text-blue-500"><${Icon} name="pencil" size=${15}/></button>
                <button onClick=${()=>onDeleteShift(s.id)} class="p-1.5 rounded hover:bg-red-50  text-gray-400 hover:text-red-500"><${Icon} name="trash" size=${15}/></button>
              </div>
            </div>
            <button onClick=${()=>onToggleArrived&&onToggleArrived(s)}
              class=${'w-full py-1.5 rounded-lg text-xs font-medium transition-colors '+(s.arrived?'bg-emerald-100 text-emerald-700':'border border-emerald-200 text-emerald-600 hover:bg-emerald-50')}>
              ${s.arrived?'✓ הגעת לעבודה — הקש לביטול':'סמן שהגעת לעבודה'}</button>
          </div>`;
        })}
    <button onClick=${onAddShift} class="w-full bg-blue-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors flex items-center justify-center gap-1.5"><${Icon} name="plus" size=${15}/> הוסף משמרת ליום זה</button>
    <div class="text-[11px] text-gray-400 text-center">טיפ: לחיצה ארוכה בלוח לבחירה מרובה של ימים</div>
  </div>`;
}

// ── ShiftsPage ───────────────────────────────────────────────
function ShiftsPage({shifts,setShifts,jobs}) {
  const now=new Date();
  const [year, setYear]       =useState(now.getFullYear());
  const [month,setMonth]      =useState(now.getMonth());
  const [view, setView]       =useState('calendar');
  const [modal,setModal]            =useState(null);
  const [detailShift,setDetailShift]=useState(null);
  const [bulkModal,setBulkModal]    =useState(null);
  const [deleteModal,setDeleteModal]=useState(false);
  const [dayModal,setDayModal]      =useState(null);
  const today=todayS();

  const markMonthPaid=()=>{
    const ids=new Set(ms.filter(s=>s.date<=today).map(s=>s.id));
    if(ids.size===0) return alert('אין משמרות שעברו בחודש זה לסימון');
    if(!confirm('לסמן '+ids.size+' משמרות כשולם?')) return;
    setShifts(s=>s.map(x=>ids.has(x.id)?{...x,isPaid:true}:x));
  };

  const ms=useMemo(()=>shifts.filter(s=>{
    const [y,m]=s.date.split('-').map(Number); return y===year&&m===month+1;
  }),[shifts,year,month]);

  const editing=(modal&&modal.id)?modal:null;
  const save=data=>{
    setShifts(s=>editing?s.map(x=>x.id===editing.id?{...x,...data}:x):[...s,{id:genId(),...data}]);
    setModal(null);
  };
  // Remove shifts and also delete their Google Calendar events (if synced)
  const removeShifts=idSet=>{
    shifts.forEach(s=>{ if(idSet.has(s.id)&&s.gcalId) deleteGcalEvent(s.gcalId); });
    setShifts(s=>s.filter(x=>!idSet.has(x.id)));
  };
  const del=id=>{
    if(confirm('למחוק משמרת זו?')) {
      removeShifts(new Set([id]));
      setDetailShift(null);
      setModal(null);
    }
  };
  const markPaid=idSet=>setShifts(s=>s.map(x=>idSet.has(x.id)?{...x,isPaid:true}:x));
  const sorted=[...ms].sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:0);

  return html`<div class="space-y-4">
    <div class="flex items-center justify-end flex-wrap gap-2">
      <div class="flex rounded-lg border border-gray-200 overflow-hidden flex-shrink-0">
        ${[['calendar','calendar','לוח'],['list','list','רשימה']].map(([v,ic,l])=>html`
          <button key=${v} onClick=${()=>setView(v)}
            class=${'px-3 py-1.5 text-xs font-medium transition-colors flex items-center gap-1 whitespace-nowrap '+(view===v?'bg-blue-500 text-white':'text-gray-600 hover:bg-gray-50')}>
            <${Icon} name=${ic} size=${13}/><span>${l}</span></button>`)}
      </div>
      <button onClick=${()=>setBulkModal({startDate:null,endDate:null})} class="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-blue-600 transition-colors flex-shrink-0 whitespace-nowrap">+ משמרת</button>
      <button onClick=${markMonthPaid} class="bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-emerald-600 transition-colors flex-shrink-0 whitespace-nowrap">✓ סמן חודש כשולם</button>
      <button onClick=${()=>setDeleteModal(true)} class="bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-red-600 transition-colors flex items-center gap-1 flex-shrink-0 whitespace-nowrap"><${Icon} name="trash" size=${13}/> מחיקה מרובה</button>
    </div>
    <${MonthStrip} year=${year} month=${month} onChange=${(y,m)=>{setYear(y);setMonth(m);}}/>

    ${view==='calendar'?html`
      <div class="bg-white rounded-xl border border-gray-100 p-3 shadow-sm">
        <${CalendarView} year=${year} month=${month} shifts=${ms} jobs=${jobs}
          onDayClick=${ds=>setDayModal(ds)}
          onShiftClick=${s=>setDayModal(s.date)}
          onRangeSelect=${(s,e)=>setBulkModal({startDate:s,endDate:e})}/>
      </div>
      <div class="text-xs text-gray-400 text-center mt-1">מחשב: גרור בלוח · טלפון: לחיצה ארוכה + גרירה · או כפתור "+ טווח"</div>`:html`
      <div class="space-y-2">
        ${ms.length===0?html`
          <div class="text-center py-14 text-gray-400 bg-white rounded-xl border border-gray-100">
            <div class="flex justify-center mb-3 text-gray-300"><${Icon} name="list" size=${40}/></div>
            <div class="text-sm">אין משמרות בחודש זה</div>
          </div>`:
        sorted.map(s=>{
          const job=findJob(jobs,s.jobId);
          const tot=s.earnings+(s.travel||0)+(s.bonus||0);
          const fut=s.date>today;
          return html`<div key=${s.id} class="bg-white rounded-xl border border-gray-100 p-3 shadow-sm fade">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-start gap-2.5">
                <div class="w-1 h-12 rounded-full mt-0.5 flex-shrink-0" style=${{backgroundColor:(job&&job.color)||'#9CA3AF'}}/>
                <div>
                  <div class="flex items-center flex-wrap gap-1.5 mb-0.5">
                    <span class="font-semibold text-gray-800 text-sm">${(job&&job.name)||'לא ידוע'}</span>
                    ${fut&&html`<span class="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded-full">צפוי</span>`}
                    ${s.isPaid&&html`<span class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-full">שולם ✓</span>`}
                    ${!s.isPaid&&!fut&&html`<span class="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full">ממתין</span>`}
                    ${s.arrived&&html`<span class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full">הגעת ✓</span>`}
                  </div>
                  <div class="text-xs text-gray-400">
                    ${new Date(s.date+'T12:00:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'long'})}
                    ${s.hours>0?' · '+s.hours+' שע\''  :''}
                    ${s.travel>0?' · נסיעות '+fmt(s.travel):''}
                    ${s.bonus>0 ?' · בונוס '  +fmt(s.bonus) :''}
                  </div>
                  ${s.notes&&html`<div class="text-xs text-gray-400 mt-0.5 italic">${s.notes}</div>`}
                </div>
              </div>
              <div class="flex items-center gap-1 flex-shrink-0">
                <span class="font-bold text-emerald-600">${fmt(tot)}</span>
                <button onClick=${()=>setModal(s)} class="p-1.5 rounded hover:bg-blue-50 text-gray-400 hover:text-blue-500"><${Icon} name="pencil" size=${15}/></button>
                <button onClick=${()=>del(s.id)}   class="p-1.5 rounded hover:bg-red-50  text-gray-400 hover:text-red-500"><${Icon} name="trash" size=${15}/></button>
              </div>
            </div>
          </div>`;
        })}
      </div>`}

    ${dayModal&&html`<${Modal} title="משמרות ליום" onClose=${()=>setDayModal(null)}>
      <${DayModal} date=${dayModal} shifts=${shifts} jobs=${jobs}
        onEditShift=${s=>{ setModal(s); setDayModal(null); }}
        onDeleteShift=${id=>{ if(confirm('למחוק משמרת זו?')) removeShifts(new Set([id])); }}
        onAddShift=${()=>{ const dd=dayModal; setDayModal(null); setModal({prefillDate:dd}); }}
        onToggleArrived=${s=>setShifts(arr=>arr.map(x=>x.id===s.id?{...x,arrived:!x.arrived}:x))}/>
    <//>`}

    ${deleteModal&&html`<${Modal} title="מחיקה מרובה לפי טווח תאריכים" onClose=${()=>setDeleteModal(false)}>
      <${BulkDeleteForm} shifts=${shifts}
        onDelete=${removeShifts}
        onClose=${()=>setDeleteModal(false)}/>
    <//>`}

    ${bulkModal&&html`<${Modal} title="משמרות לטווח תאריכים" onClose=${()=>setBulkModal(null)}>
      <${BulkShiftForm}
        startDate=${bulkModal.startDate} endDate=${bulkModal.endDate}
        jobs=${jobs} shifts=${shifts}
        onSave=${newShifts=>setShifts(s=>[...s,...newShifts])}
        onDeleteRange=${removeShifts}
        onMarkPaid=${markPaid}
        onClose=${()=>setBulkModal(null)}/>
    <//>`}

    ${detailShift&&html`<${Modal} title="פרטי משמרת" onClose=${()=>setDetailShift(null)}>
      <${ShiftDetailModal} shift=${detailShift} jobs=${jobs}
        onEdit=${()=>{ setModal(detailShift); setDetailShift(null); }}
        onDelete=${()=>del(detailShift.id)}
        onClose=${()=>setDetailShift(null)}/>
    <//>`}

    ${modal&&html`<${Modal} title=${editing?'ערוך משמרת':'הוסף משמרת'} onClose=${()=>setModal(null)}>
      <${ShiftForm}
        initial=${editing||(modal.prefillDate?{date:modal.prefillDate}:null)}
        jobs=${jobs} shifts=${shifts} onSave=${save} onClose=${()=>setModal(null)}
        onDelete=${editing?()=>del(editing.id):null}/>
    <//>`}
  </div>`;
}

// ── DashboardPage ────────────────────────────────────────────
function DashboardPage({shifts,setShifts,jobs,settings,payslips,setTab}) {
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const today=todayS();
  const monthKey=year+'-'+String(month+1).padStart(2,'0');
  const monthPayslips=(payslips||[]).filter(p=>p.month===monthKey);

  const d=useMemo(()=>{
    const ms=shifts.filter(s=>{const[y,m]=s.date.split('-').map(Number);return y===year&&m===month+1;});
    const past=ms.filter(s=>s.date<=today), fut=ms.filter(s=>s.date>today);

    // Monthly jobs: add job.rate once per unique monthly job with any shift this month
    const monthlyJobIds=new Set();
    ms.forEach(s=>{ const j=findJob(jobs,s.jobId); if(j&&j.rateType==='monthly') monthlyJobIds.add(s.jobId); });
    const monthlyTotal=Array.from(monthlyJobIds).reduce((n,jid)=>{const j=findJob(jobs,jid);return n+(j?j.rate:0);},0);

    const earn=arr=>arr.reduce((n,s)=>n+s.earnings+shiftTravel(s,jobs)+(s.bonus||0),0);
    const gA=earn(past)+monthlyTotal, gF=earn(ms)+monthlyTotal;
    const paid=earn(past.filter(s=>s.isPaid)), pend=earn(past.filter(s=>!s.isPaid));
    const travelTotal=past.reduce((n,s)=>n+shiftTravel(s,jobs),0);

    // Pension base: only shifts/months where the job is pension-eligible on that date (3-month rule, or manual override)
    const pensionEarn=arr=>arr.reduce((n,s)=>{
      const j=findJob(jobs,s.jobId);
      return pensionEligible(j,s.date) ? n+s.earnings+shiftTravel(s,jobs)+(s.bonus||0) : n;
    },0);
    const monthlyPensionTotal=Array.from(monthlyJobIds).reduce((n,jid)=>{
      const j=findJob(jobs,jid);
      return (j&&pensionEligible(j,today)) ? n+j.rate : n;
    },0);
    const pA=pensionEarn(past)+monthlyPensionTotal, pF=pensionEarn(ms)+monthlyPensionTotal;

    const nA=calcAll(gA,settings.creditPoints,pA), nF=calcAll(gF,settings.creditPoints,pF);
    const byJob={};
    ms.forEach(s=>{
      const k=s.jobId; byJob[k]=byJob[k]||{shifts:0,earn:0};
      byJob[k].shifts++; byJob[k].earn+=s.earnings+shiftTravel(s,jobs)+(s.bonus||0);
    });
    // Add monthly rate to each monthly job's byJob entry
    monthlyJobIds.forEach(jid=>{ const j=findJob(jobs,jid); if(j&&byJob[jid]) byJob[jid].earn+=j.rate; });
    const hrs=ms.reduce((n,s)=>n+(s.hours||0),0);
    return {ms,past,fut,gA,gF,paid,pend,travelTotal,nA,nF,byJob,hrs,monthlyTotal};
  },[shifts,jobs,year,month,settings.creditPoints,today]);

  const allPaid = d.past.length>0 && d.past.every(s=>s.isPaid);

  // Today's shifts — quick "I arrived" button on the home screen
  const todayShifts = shifts.filter(s=>s.date===today);
  const todayArrived = todayShifts.length>0 && todayShifts.every(s=>s.arrived);
  const toggleArrivedToday = () =>
    setShifts&&setShifts(arr=>arr.map(s=>s.date===today?{...s,arrived:!todayArrived}:s));

  // ── Sharing ──
  const [shareScope,setShareScope]=useState(()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');}); // 'all' | 'YYYY-MM'
  const [shareJob,  setShareJob]  =useState('all');   // 'all' | jobId
  const shareMonths=useMemo(()=>{
    const set=new Set(shifts.map(s=>s.date.slice(0,7)));
    const n=new Date(); set.add(n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'));
    return [...set].sort().reverse();
  },[shifts]);
  const shareList=()=>{
    let list = shareScope==='all' ? shifts.slice() : shifts.filter(s=>s.date.slice(0,7)===shareScope);
    if(shareJob!=='all') list=list.filter(s=>s.jobId===shareJob);
    return list.sort((a,b)=>a.date<b.date?-1:1);
  };
  const sharePeriod=()=>{
    if(shareScope==='all') return 'מאז תחילת העבודה';
    const [y,m]=shareScope.split('-').map(Number);
    return MONTHS[m-1]+' '+y;
  };
  const shareText=()=>{
    const list=shareList();
    const names=[...new Set(list.map(s=>s.jobId))].map(id=>{const j=findJob(jobs,id);return j?j.name:null;}).filter(Boolean);
    const nameStr=names.length?names.join(', ')+' ':'';
    return 'סיכום עבודה '+nameStr+'- '+sharePeriod()+'\nימי עבודה - '+list.length;
  };
  const shareWhatsApp=()=>{
    window.open('https://wa.me/?text='+encodeURIComponent(shareText()),'_blank');
  };
  const exportExcel=async()=>{
    const rows=shareList();
    const head=['משרה','יום','תאריך'];
    let tbl='<table border="1"><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
    rows.forEach(s=>{
      const job=findJob(jobs,s.jobId);
      const dow=new Date(s.date+'T12:00:00').toLocaleDateString('he-IL',{weekday:'long'});
      const cells=[(job&&job.name)||'',dow,s.date];
      tbl+='<tr>'+cells.map(c=>'<td>'+escapeHtml(c)+'</td>').join('')+'</tr>';
    });
    tbl+='</table>';
    const content='<html><head><meta charset="utf-8"></head><body>'+tbl+'</body></html>';
    const blob=new Blob([content],{type:'application/vnd.ms-excel'});
    const name='משמרות_'+sharePeriod().replace(/\s/g,'_')+'.xls';
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'סיכום משמרות',text:shareText()}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  };

  return html`<div class="space-y-5">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <h2 class="text-base font-bold text-gray-800">סיכום חודשי</h2>
    </div>
    <${MonthStrip} year=${year} month=${month} onChange=${(y,m)=>{setYear(y);setMonth(m);}}/>

    ${todayShifts.length>0&&html`
      <button onClick=${toggleArrivedToday}
        class=${'w-full py-3 rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-2 '+
          (todayArrived
            ?'bg-emerald-500 text-white hover:bg-emerald-600'
            :'bg-white border-2 border-emerald-300 text-emerald-600 hover:bg-emerald-50 shadow-sm')}>
        <${Icon} name="check" size=${17}/>
        ${todayArrived?'הגעת היום למשמרת — הקש לביטול':'הגעתי היום למשמרת'}
      </button>`}

    ${d.monthlyTotal>0&&html`
      <div class="bg-blue-50 border border-blue-100 rounded-xl px-4 py-2.5 text-sm text-blue-700 flex items-center gap-2">
        <${Icon} name="briefcase" size=${16}/>
        <span>כולל שכר חודשי קבוע: <strong>${fmt(d.monthlyTotal)}</strong></span>
      </div>`}

    <div class="grid grid-cols-3 gap-3">
      <${StatCard} label="ברוטו"      value=${fmt(d.gA)}        sub=${d.past.length+' משמרות'}       color="blue"   icon=${html`<${Icon} name="coins" size=${17}/>`}/>
      <${StatCard} label="נטו משוער"  value=${fmt(d.nA.net)}    sub=${fmt(d.nA.total)+' ניכויים'}   color="purple" icon=${html`<${Icon} name="wallet" size=${17}/>`}/>
      <${StatCard} label="שולם?"      value=${allPaid?'כן':'לא'} sub=${allPaid?'שולם':'טרם שולם'}  color=${allPaid?'green':'red'} icon=${html`<${Icon} name=${allPaid?'check':'clock'} size=${17}/>`}/>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <div class="flex items-center justify-between mb-1">
        <h3 class="text-sm font-semibold text-gray-700 flex items-center gap-1.5"><${Icon} name="receipt" size=${15}/> תלוש שכר לחודש זה</h3>
        <button onClick=${()=>setTab&&setTab('payslips')} class="text-xs text-blue-600 hover:underline">ניהול תלושים</button>
      </div>
      ${monthPayslips.length===0
        ? html`<div class="text-xs text-gray-400">לא צורף תלוש לחודש זה — ניתן לצרף בלשונית "תלושים".</div>`
        : monthPayslips.map(p=>html`<a key=${p.id} href=${safeUrl(p.driveLink)||'#'} target="_blank" rel="noopener noreferrer"
            class="flex items-center gap-2 py-1.5 text-sm text-blue-700 hover:underline">
            <${Icon} name="file" size=${16}/><span class="flex-1 min-w-0 truncate">צפה בתלוש</span><${Icon} name="external" size=${14} class="text-gray-300"/>
          </a>`)}
    </div>

    ${shifts.length>0&&html`
      <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm space-y-3">
        <h3 class="text-sm font-semibold text-gray-700 flex items-center gap-1.5"><${Icon} name="share" size=${15}/> שיתוף סיכום</h3>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <span class="block text-xs text-gray-400 mb-1">תקופה</span>
            <select value=${shareScope} onChange=${e=>setShareScope(e.target.value)}
              class="w-full border border-gray-200 rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
              ${shareMonths.map(ym=>{const[y,m]=ym.split('-').map(Number);return html`<option key=${ym} value=${ym}>${MONTHS[m-1]+' '+y}</option>`;})}
              <option value="all">מאז שהתחלתי לעבוד</option>
            </select>
          </div>
          <div>
            <span class="block text-xs text-gray-400 mb-1">משרה</span>
            <select value=${shareJob} onChange=${e=>setShareJob(e.target.value)}
              class="w-full border border-gray-200 rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
              <option value="all">כל המשרות</option>
              ${jobs.map(j=>html`<option key=${j.id} value=${j.id}>${j.name}</option>`)}
            </select>
          </div>
        </div>
        <button onClick=${shareWhatsApp} class="w-full text-sm bg-emerald-50 text-emerald-700 py-2.5 rounded-lg hover:bg-emerald-100 font-medium flex items-center justify-center gap-2">
          <${Icon} name="chat" size=${15}/> שתף בוואטסאפ
        </button>
        <button onClick=${exportExcel} class="w-full text-sm bg-blue-50 text-blue-700 py-2.5 rounded-lg hover:bg-blue-100 font-medium flex items-center justify-center gap-2">
          <${Icon} name="table" size=${15}/> שתף כטבלת אקסל
        </button>
      </div>`}

    ${d.fut.length>0&&html`
      <div class="bg-gradient-to-l from-violet-50 to-blue-50 border border-violet-100 rounded-xl p-4">
        <div class="text-xs font-semibold text-violet-700 mb-2 flex items-center gap-1.5"><${Icon} name="trend" size=${14}/> תחזית (כולל ${d.fut.length} משמרות עתידיות)</div>
        <div class="grid grid-cols-3 gap-3 text-center">
          ${[['ברוטו צפוי',fmt(d.gF),'text-gray-700'],['נטו צפוי',fmt(d.nF.net),'text-emerald-600'],['שעות',String(d.hrs),'text-violet-600']]
            .map(([l,v,c])=>html`<div key=${l}><div class="text-xs text-gray-500 mb-0.5">${l}</div><div class=${'text-lg font-bold '+c}>${v}</div></div>`)}
        </div>
      </div>`}

// ── CalcPage ─────────────────────────────────────────────────
function CalcPage({shifts,jobs,settings,setSettings}) {
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [manual,setManual]=useState(false);
  const [mg,setMg]=useState('');

  const monthShifts=useMemo(()=>{
    const t=todayS();
    return shifts.filter(s=>{const[y,m]=s.date.split('-').map(Number);return y===year&&m===month+1&&s.date<=t;});
  },[shifts,year,month]);

  const autoG=useMemo(()=>monthShifts.reduce((n,s)=>n+s.earnings+shiftTravel(s,jobs)+(s.bonus||0),0),[monthShifts,jobs]);
  const autoPensionBase=useMemo(()=>monthShifts.reduce((n,s)=>{
    const j=findJob(jobs,s.jobId);
    return pensionEligible(j,s.date) ? n+s.earnings+shiftTravel(s,jobs)+(s.bonus||0) : n;
  },0),[monthShifts,jobs]);

  const gross=manual?(+mg||0):autoG;
  const pensionBase=manual?gross:autoPensionBase;
  const res=useMemo(()=>calcAll(gross,settings.creditPoints,pensionBase),[gross,pensionBase,settings.creditPoints]);

  return html`<div class="space-y-4">

    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">

        <div class="flex items-center gap-2">
          <input type="number" step="0.25" min="0" max="15" value=${settings.creditPoints}
            onChange=${e=>setSettings(s=>({...s,creditPoints:+e.target.value||0}))}
            class="w-20 border border-gray-200 rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-300"/>
          <span class="text-xs text-gray-400">= ₪${Math.round(settings.creditPoints*CVAL)}/חודש</span>
        </div>
      </div>
      <div class="text-xs text-gray-400">רווק/ה: 2.25 · עם ילד: +2.5 · עולה חדש: +3</div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold text-gray-700">ברוטו חודשי</span>
        <div class="flex rounded-lg border border-gray-200 overflow-hidden">
          <button onClick=${()=>setManual(false)} class=${'px-2 py-1 text-xs '+(!manual?'bg-blue-500 text-white':'text-gray-500 hover:bg-gray-50')}>לפי משמרות</button>
          <button onClick=${()=>setManual(true)}  class=${'px-2 py-1 text-xs '+(manual?'bg-blue-500 text-white':'text-gray-500 hover:bg-gray-50')}>ידני</button>
        </div>
      </div>
      ${!manual?html`
        <div>
          <${MonthNav} year=${year} month=${month} onChange=${(y,m)=>{setYear(y);setMonth(m);}}/>
          <div class="text-3xl font-bold text-gray-800 mt-2">${fmt(autoG)}</div>
          <div class="text-xs text-gray-400 mt-0.5">${MONTHS[month]} ${year} (משמרות בפועל)</div>
        </div>`:html`
        <input type="number" value=${mg} onInput=${e=>setMg(e.target.value)} placeholder="הזן ברוטו חודשי..."
          class="w-full text-2xl font-bold border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-300 mt-1"/>`}
    </div>

    ${gross>0?html`
      <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
        <div class="text-center bg-slate-50 rounded-xl p-4 mb-4">
          <div class="text-xs text-gray-500">ברוטו</div>
          <div class="text-xl font-bold text-gray-600">${fmt(res.gross)}</div>
          <div class="text-gray-300 text-2xl my-1">↓</div>
          <div class="text-xs text-gray-500">נטו לקבלה</div>
          <div class="text-4xl font-bold text-emerald-500">${fmt(res.net)}</div>
          <div class="text-xs text-gray-400 mt-1">שיעור ניכוי: ${res.gross>0?((res.total/res.gross)*100).toFixed(1):0}%</div>
        </div>
        <h3 class="text-sm font-semibold text-gray-700 mb-2">פירוט ניכויים</h3>
        ${[{l:'פנסיה עובד (6%)',v:res.pension,c:'#3B82F6'},{l:'ביטוח לאומי',v:res.ni,c:'#F97316'},{l:'מס בריאות',v:res.health,c:'#EAB308'},{l:'מס הכנסה ('+settings.creditPoints+' נק\')',v:res.incomeTax,c:'#EF4444'}]
          .map(r=>html`<div key=${r.l} class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
            <div class="flex items-center gap-2">
              <div class="w-2.5 h-2.5 rounded-full" style=${{backgroundColor:r.c}}/>

          הערכה בלבד לפי מדרגות 2026. אינו מחליף ייעוץ רואה חשבון. תקרת ב"ל: ₪${NI_CL.toLocaleString()}/חודש.
        </div>
      </div>`:html`
      <div class="text-center py-12 text-gray-400 bg-white rounded-xl border border-gray-100">
        <div class="flex justify-center mb-2 text-gray-300"><${Icon} name="calc" size=${36}/></div><div class="text-sm">הזן ברוטו חודשי לחישוב</div>
      </div>`}
  </div>`;
}

// ── GoogleDriveSection ───────────────────────────────────────
function GoogleDriveSection({settings,setSettings,jobs,shifts,payslips,setJobs,setShifts,setPayslips}) {
  const [token,  setToken]  = useState(()=>_gToken);
  const [status, setStatus] = useState('');
  const [busy,   setBusy]   = useState(false);

  const clientId = (settings&&settings.gClientId)||'';
  const SCOPE    = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar.events';
  const FILE     = 'shifts_backup.json';

  const setTok = t => { _gToken=t; setToken(t); };
  const gReady = () => window.google&&window.google.accounts&&window.google.accounts.oauth2;

  const getClient = () => {
    if (_gClient) return _gClient;
    if (!gReady()) return null;
    _gClient = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId.trim(),
      scope: SCOPE,
      callback: r => {
        if (r.error) { setStatus('שגיאה: '+r.error); return; }
        setTok(r.access_token);
        setStatus('מחובר ✓');
        processGcalDelQueue();
      }
    });
    return _gClient;
  };

  const connect = () => {
    if (!clientId.trim()) return alert('יש להזין Google Client ID תחילה');
    if (!gReady()) return alert('ספריית Google טרם נטענה. נסה שוב בעוד שנייה.');
    setSettings(s=>({...s,gConnected:true}));
    const c=getClient(); if(c) c.requestAccessToken({prompt:'consent'});
  };

  // Silent re-connect on load if previously connected (keeps you "logged in")
  useEffect(()=>{
    if (_gToken) { setToken(_gToken); return; }
    if (!settings||!settings.gConnected||!clientId.trim()) return;
    let tries=0;
    const iv=setInterval(()=>{
      if (gReady()) {
        clearInterval(iv);
        const c=getClient(); if(c) c.requestAccessToken({prompt:''});
      } else if(++tries>25) clearInterval(iv);
    },300);
    return ()=>clearInterval(iv);
  },[]);

  // Auto-backup: debounced backup to Drive whenever jobs/shifts change (if enabled and connected)
  const autoRef=useRef(null);
  useEffect(()=>{
    if(!token || !(settings&&settings.autoBackup)) return;
    clearTimeout(autoRef.current);
    autoRef.current=setTimeout(()=>{ backup(); }, 4000);
    return ()=>clearTimeout(autoRef.current);
  },[jobs,shifts,payslips,token]);

  const findFile = async () => {
    const q = encodeURIComponent("name='"+FILE+"' and trashed=false");
    const r = await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)',
      {headers:{Authorization:'Bearer '+token}});
    const j = await r.json();
    return j.files&&j.files[0] ? j.files[0].id : null;
  };

  const backup = async () => {
    if (!token) return;
    setBusy(true); setStatus('מגבה...');
    try {
      const content = JSON.stringify({jobs,shifts,payslips,settings,exportedAt:new Date().toISOString()},null,2);
      const existId = await findFile();
      if (existId) {
        await fetch('https://www.googleapis.com/upload/drive/v3/files/'+existId+'?uploadType=media',
          {method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:content});
      } else {
        const b='--BOUND', meta=JSON.stringify({name:FILE,mimeType:'application/json'});
        const body=[b+'\r\nContent-Type: application/json\r\n\r\n'+meta,
                    b+'\r\nContent-Type: application/json\r\n\r\n'+content,b+'--'].join('\r\n');
        await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
          {method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary=BOUND'},body});
      }
      setStatus('גיבוי הושלם ✓ '+new Date().toLocaleTimeString('he-IL'));
    } catch(e) { setStatus('שגיאת גיבוי: '+e.message); }
    setBusy(false);
  };

  const restore = async () => {
    if (!token) return;
    if (!confirm('שחזור יחליף את כל הנתונים הנוכחיים. להמשיך?')) return;
    setBusy(true); setStatus('משחזר...');
    try {
      const id = await findFile();
      if (!id) { setStatus('לא נמצא קובץ גיבוי ב-Drive'); setBusy(false); return; }
      const r = await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',
        {headers:{Authorization:'Bearer '+token}});
      const d = await r.json();
      if (Array.isArray(d.jobs))    setJobs(d.jobs.filter(j=>j&&typeof j==='object'));
      if (Array.isArray(d.shifts))  setShifts(d.shifts.filter(s=>s&&typeof s==='object'&&typeof s.date==='string'));
      if (Array.isArray(d.payslips))setPayslips(d.payslips.filter(p=>p&&typeof p==='object'&&safeUrl(p.driveLink)));
      if (d.settings&&typeof d.settings==='object'){
        const {darkMode,gClientId,gConnected,...rest}=d.settings;
        setSettings(s=>({...s,...rest}));
      }
      setStatus('שוחזר בהצלחה ✓');
    } catch(e) { setStatus('שגיאת שחזור: '+e.message); }
    setBusy(false);
  };

  return html`<div class="space-y-3">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Google Client ID</label>
      <input value=${clientId} onInput=${e=>setSettings(s=>({...s,gClientId:e.target.value}))}
        placeholder="xxxx.apps.googleusercontent.com"
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-blue-300 font-mono"/>
      <p class="text-xs text-gray-400 mt-1">נדרש: Google Cloud Project → APIs & Services → Credentials → OAuth 2.0 Client ID</p>
    </div>
    ${token
      ? html`<button onClick=${()=>{setTok(null);setStatus('');setSettings(s=>({...s,gConnected:false}));}}
          class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-medium hover:bg-gray-200">
          <${Icon} name="x" size=${13}/> התנתק מ-Google</button>
        <div class="grid grid-cols-2 gap-2">
          <button onClick=${backup} disabled=${busy}
            class="bg-emerald-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-emerald-600 disabled:opacity-50 transition-colors">
            ${busy?'...':html`<${Icon} name="cloud" size=${14}/> גבה ל-Drive`}</button>
          <button onClick=${restore} disabled=${busy}
            class="bg-violet-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-violet-600 disabled:opacity-50 transition-colors">
            ${busy?'...':html`<${Icon} name="download" size=${14}/> שחזר מ-Drive`}</button>
        </div>
        <label class="flex items-center justify-between cursor-pointer select-none pt-1">
          <span class="text-sm text-gray-700">גיבוי אוטומטי בכל שינוי</span>
          <input type="checkbox" checked=${!!(settings&&settings.autoBackup)} onChange=${e=>setSettings(s=>({...s,autoBackup:e.target.checked}))} class="w-4 h-4 rounded"/>
        </label>`
      : html`<button onClick=${connect}
          class="w-full bg-blue-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors">
          <${Icon} name="login" size=${14}/> חבר חשבון Google</button>`}
    ${status&&html`<div class=${'text-xs text-center py-1.5 px-3 rounded-lg '+(status.includes('שגיאה')?'bg-red-50 text-red-600':'bg-blue-50 text-blue-700')}>
      ${status}</div>`}
  </div>`;
}

// ── GoogleCalendarSection ────────────────────────────────────
function GoogleCalendarSection({jobs,shifts,setShifts}) {
  const [busy,  setBusy]  = useState(false);
  const [status,setStatus]= useState('');
  const [scope, setScope] = useState('month');

  const syncOne = async (s) => {
    const job=findJob(jobs,s.jobId);
    const isMil=job&&job.rateType==='miluim';
    const title=isMil?'מילואים':'עבודה'+(job?' – '+job.name:'');
    const st=s.startTime||(job&&job.startTime)||'08:00';
    const et=s.endTime||(job&&job.endTime)||'16:00';
    let endDate=s.date;
    if(et<=st){ const nd=new Date(s.date+'T12:00:00'); nd.setDate(nd.getDate()+1); endDate=nd.toISOString().slice(0,10); }
    const body={
      summary:title, colorId:isMil?'10':'11',
      start:{dateTime:s.date+'T'+st+':00', timeZone:'Asia/Jerusalem'},
      end:{dateTime:endDate+'T'+et+':00', timeZone:'Asia/Jerusalem'},
      reminders:{useDefault:false, overrides:[]}
    };
    const base='https://www.googleapis.com/calendar/v3/calendars/primary/events';
    if(s.gcalId){
      const r=await fetch(base+'/'+s.gcalId,
        {method:'PATCH',headers:{Authorization:'Bearer '+_gToken,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.ok){ const j=await r.json(); return j.id; }
    }
    const r=await fetch(base,
      {method:'POST',headers:{Authorization:'Bearer '+_gToken,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.error) throw new Error(j.error.message||'שגיאה');
    return j.id;
  };

  // One button: adds/updates shifts AND removes deleted ones — only within the chosen range
  const sync = async () => {
    if(!_gToken){ alert('התחבר תחילה ל-Google בכרטיס "גיבוי Google Drive" למעלה'); return; }
    const now=new Date(), y=now.getFullYear(), m=now.getMonth();
    let list, rMin, rMax;
    if(scope==='month'){
      list=shifts.filter(s=>{const[a,b]=s.date.split('-').map(Number);return a===y&&b===m+1;});
      rMin=new Date(y,m,1).toISOString(); rMax=new Date(y,m+1,1).toISOString();
    } else if(scope==='future'){
      list=shifts.filter(s=>s.date>=todayS());
      rMin=new Date(todayS()+'T00:00:00').toISOString(); rMax=new Date(Date.now()+2*365*864e5).toISOString();
    } else {
      list=shifts.slice();
      rMin=new Date(Date.now()-3*365*864e5).toISOString(); rMax=new Date(Date.now()+2*365*864e5).toISOString();
    }
    setBusy(true); setStatus('מסנכרן...');
    try{
      await processGcalDelQueue();
      // 1) add / update events for existing shifts in range
      const idMap={};
      for(const s of list){ idMap[s.id]=await syncOne(s); }
      const updated=shifts.map(x=>idMap[x.id]?{...x,gcalId:idMap[x.id]}:x);
      setShifts(()=>updated);
      // 2) remove orphaned "עבודה" events inside the chosen range (shifts that were deleted)
      const known=new Set(updated.filter(s=>s.gcalId).map(s=>s.gcalId));
      let items=[], pageToken='';
      do{
        const u='https://www.googleapis.com/calendar/v3/calendars/primary/events?maxResults=250&singleEvents=true'
          +'&timeMin='+encodeURIComponent(rMin)+'&timeMax='+encodeURIComponent(rMax)
          +(pageToken?'&pageToken='+encodeURIComponent(pageToken):'');
        const r=await fetch(u,{headers:{Authorization:'Bearer '+_gToken}});
        const j=await r.json();
        if(j.error) throw new Error(j.error.message||'שגיאה');
        items=items.concat(j.items||[]); pageToken=j.nextPageToken||'';
      }while(pageToken);
      const orphans=items.filter(ev=>ev.summary&&(ev.summary.indexOf('עבודה')===0||ev.summary==='מילואים')&&!known.has(ev.id));
      for(const ev of orphans){
        await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/'+ev.id,
          {method:'DELETE',headers:{Authorization:'Bearer '+_gToken}});
      }
      setStatus('סונכרן ✓ · נוספו/עודכנו '+list.length+' · הוסרו '+orphans.length);
    }catch(e){ setStatus('שגיאה: '+e.message+' (ודא שהפעלת Calendar API וחיברת מחדש)'); }
    setBusy(false);
  };

  return html`<div class="space-y-3">
    <p class="text-xs text-gray-500">סנכרון דו-כיווני בטווח שתבחר: משמרות חדשות יתווספו/יעודכנו ביומן Google כאירועים <span class="text-red-500 font-medium">אדומים</span> (בשעות המשרה, ללא התראות), ומשמרות שמחקת יוסרו מהיומן.</p>
    <div>

// ── PayslipsPage ─────────────────────────────────────────────
function PayslipsPage({payslips,setPayslips,setShifts,setTab}) {
  const [token, setToken] = useState(()=>_gToken);
  const [month, setMonth] = useState(()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');});
  const [file,  setFile]  = useState(null);
  const [busy,  setBusy]  = useState(false);
  const [status,setStatus]= useState('');

  useEffect(()=>{
    const iv=setInterval(()=>{ if(_gToken!==token) setToken(_gToken); },1000);
    return ()=>clearInterval(iv);
  },[token]);

  const upload = async () => {
    if(!token) return alert('יש להתחבר לחשבון Google תחילה (בהגדרות)');
    if(!file) return alert('יש לבחור קובץ');
    if(!month) return alert('יש לבחור חודש');
    setBusy(true); setStatus('מעלה...');
    try{
      const meta={name:'תלוש_'+month+'_'+file.name, mimeType:file.type||'application/octet-stream'};
      const res=await uploadFileToDrive(file,meta);
      setPayslips(list=>[...list,{id:genId(),month,name:file.name,driveFileId:res.id,driveLink:res.webViewLink,uploadedAt:new Date().toISOString()}]);
      // Uploading a payslip for a month marks that month's shifts as paid
      setShifts&&setShifts(arr=>arr.map(s=>s.date.slice(0,7)===month?{...s,isPaid:true}:s));
      setFile(null); setStatus('הועלה בהצלחה ✓ — משמרות החודש סומנו כשולם');
    }catch(e){ setStatus('שגיאה: '+e.message); }
    setBusy(false);
  };

  const del = async (p) => {
    if(!confirm('למחוק תלוש זה?')) return;
    await deleteDriveFile(p.driveFileId);
    setPayslips(list=>list.filter(x=>x.id!==p.id));
  };

  const grouped = useMemo(()=>{
    const byMonth={};
    payslips.forEach(p=>{ (byMonth[p.month]=byMonth[p.month]||[]).push(p); });
    return Object.keys(byMonth).sort().reverse().map(m=>{
      const [y,mo]=m.split('-').map(Number);
      return {month:m,label:MONTHS[mo-1]+' '+y,items:byMonth[m].sort((a,b)=>a.uploadedAt<b.uploadedAt?1:-1)};
    });
  },[payslips]);

  const COLORS=['#3B82F6','#8B5CF6','#10B981','#F59E0B','#EC4899','#14B8A6','#6366F1','#F43F5E'];

  return html`<div class="space-y-4">

    <!-- Hero header -->
    <div class="bg-gradient-to-l from-blue-600 to-indigo-600 rounded-2xl p-5 text-white shadow-md">
      <div class="flex items-center justify-between">
        <div class="min-w-0">
          <div class="text-lg font-extrabold flex items-center gap-2"><${Icon} name="receipt" size=${20}/> תלושי שכר</div>
          <div class="text-xs text-blue-100 mt-1 leading-4">כל התלושים שלך במקום אחד,<br/>מגובים אוטומטית ב-Google Drive</div>
        </div>
        <div class="text-center flex-shrink-0 bg-white/15 rounded-2xl px-4 py-2">
          <div class="text-3xl font-black leading-none">${payslips.length}</div>
          <div class="text-[10px] text-blue-100 mt-1">תלושים</div>
        </div>
      </div>
    </div>

    ${!token?html`
      <div class="bg-amber-50 border border-amber-100 rounded-2xl p-5 text-sm text-amber-700 text-center space-y-3">
        <div class="flex justify-center text-amber-400"><${Icon} name="lock" size=${36}/></div>
        <div>כדי לצרף ולשמור תלושים צריך להתחבר לחשבון Google.</div>
        <button onClick=${()=>setTab('settings')} class="bg-blue-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-blue-600 transition-colors"><${Icon} name="login" size=${14}/> עבור להגדרות והתחבר</button>
      </div>`:html`
      <!-- Add payslip card -->
      <div class="bg-white rounded-2xl border border-gray-100 p-4 shadow-sm space-y-3">
        <h3 class="text-sm font-bold text-gray-700 flex items-center gap-2"><${Icon} name="plus" size=${15}/> הוסף תלוש חדש</h3>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">חודש התלוש</label>
          <div class="grid grid-cols-2 gap-2">
            <select value=${month.slice(5,7)} onChange=${e=>setMonth(month.slice(0,4)+'-'+e.target.value)}
              class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
              ${MONTHS.map((l,i)=>{const v=String(i+1).padStart(2,'0');return html`<option key=${v} value=${v}>${l}</option>`;})}
            </select>
            <select value=${month.slice(0,4)} onChange=${e=>setMonth(e.target.value+'-'+month.slice(5,7))}
              class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
              ${Array.from({length:6},(_,i)=>{const y=String(new Date().getFullYear()-4+i);return html`<option key=${y} value=${y}>${y}</option>`;})}
            </select>
          </div>
        </div>
        <label class="block border-2 border-dashed border-gray-200 rounded-xl p-5 text-center cursor-pointer hover:border-blue-300 hover:bg-blue-50 transition-colors">
          <div class=${'flex justify-center mb-2 '+(file?'text-emerald-500':'text-gray-300')}><${Icon} name=${file?'check':'upload'} size=${30}/></div>
          <div class="text-sm text-gray-600 truncate px-2">${file?file.name:'לחץ לבחירת תמונה או PDF'}</div>
          <input type="file" accept="image/*,.pdf" onChange=${e=>setFile(e.target.files[0]||null)} class="hidden"/>

        <button onClick=${upload} disabled=${busy||!file}

          ${busy?'מעלה...':html`<${Icon} name="upload" size=${14}/> העלה תלוש`}</button>
        ${status&&html`<div class=${'text-xs text-center py-2 px-3 rounded-xl '+(status.includes('שגיאה')?'bg-red-50 text-red-600':'bg-emerald-50 text-emerald-700')}>${status}</div>`}
      </div>`}

    <!-- List -->
    ${grouped.length===0?html`
      <div class="text-center py-16 text-gray-400 bg-white rounded-2xl border border-gray-100">
        <div class="flex justify-center mb-3 text-gray-300"><${Icon} name="folder" size=${48}/></div>

      </div>`:
      html`<div class="space-y-4">
        ${grouped.map((g,gi)=>html`<div key=${g.month} class="space-y-2">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-gray-500 bg-gray-100 rounded-full px-3 py-1">${g.label}</span>
            <div class="flex-1 h-px bg-gray-100"/>
            <span class="text-[10px] text-gray-400">${g.items.length} ${g.items.length===1?'קובץ':'קבצים'}</span>

            <div key=${p.id} class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex items-stretch">
              <div class="w-1.5 flex-shrink-0" style=${{backgroundColor:c}}/>

}
