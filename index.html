// ── CalcPage ─────────────────────────────────────────────────
function CalcPage({shifts,jobs,settings,setSettings}) {
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [manual,setManual]=useState(false);
  const [mg,setMg]=useState('');

  const monthShifts=useMemo(()=>{
    const t=todayS();
    return shifts.filter(s=>{const[y,m]=s.date.split('-').map(Number);return y===year&&m===month+1&&s.date<=t;});
  },[shifts,year,month]);

  const autoG=useMemo(()=>monthShifts.reduce((n,s)=>n+s.earnings+shiftTravel(s,jobs)+(s.bonus||0),0),[monthShifts,jobs]);
  const autoPensionBase=useMemo(()=>monthShifts.reduce((n,s)=>{
    const j=findJob(jobs,s.jobId);
    return pensionEligible(j,s.date) ? n+s.earnings+shiftTravel(s,jobs)+(s.bonus||0) : n;
  },0),[monthShifts,jobs]);

  const gross=manual?(+mg||0):autoG;
  const pensionBase=manual?gross:autoPensionBase;
  const res=useMemo(()=>calcAll(gross,settings.creditPoints,pensionBase),[gross,pensionBase,settings.creditPoints]);

  return html`<div class="space-y-4">
    <h2 class="text-base font-bold text-gray-800">מחשבון שכר נטו (שכיר ישראלי)</h2>

    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-gray-700">נקודות זיכוי</span>
        <div class="flex items-center gap-2">
          <input type="number" step="0.25" min="0" max="15" value=${settings.creditPoints}
            onChange=${e=>setSettings(s=>({...s,creditPoints:+e.target.value||0}))}
            class="w-20 border border-gray-200 rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-300"/>
          <span class="text-xs text-gray-400">= ₪${Math.round(settings.creditPoints*CVAL)}/חודש</span>
        </div>
      </div>
      <div class="text-xs text-gray-400">רווק/ה: 2.25 · עם ילד: +2.5 · עולה חדש: +3</div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold text-gray-700">ברוטו חודשי</span>
        <div class="flex rounded-lg border border-gray-200 overflow-hidden">
          <button onClick=${()=>setManual(false)} class=${'px-2 py-1 text-xs '+(!manual?'bg-blue-500 text-white':'text-gray-500 hover:bg-gray-50')}>לפי משמרות</button>
          <button onClick=${()=>setManual(true)}  class=${'px-2 py-1 text-xs '+(manual?'bg-blue-500 text-white':'text-gray-500 hover:bg-gray-50')}>ידני</button>
        </div>
      </div>
      ${!manual?html`
        <div>
          <${MonthNav} year=${year} month=${month} onChange=${(y,m)=>{setYear(y);setMonth(m);}}/>
          <div class="text-3xl font-bold text-gray-800 mt-2">${fmt(autoG)}</div>
          <div class="text-xs text-gray-400 mt-0.5">${MONTHS[month]} ${year} (משמרות בפועל)</div>
        </div>`:html`
        <input type="number" value=${mg} onInput=${e=>setMg(e.target.value)} placeholder="הזן ברוטו חודשי..."
          class="w-full text-2xl font-bold border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-300 mt-1"/>`}
    </div>

    ${gross>0?html`
      <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
        <div class="text-center bg-slate-50 rounded-xl p-4 mb-4">
          <div class="text-xs text-gray-500">ברוטו</div>
          <div class="text-xl font-bold text-gray-600">${fmt(res.gross)}</div>
          <div class="text-gray-300 text-2xl my-1">↓</div>
          <div class="text-xs text-gray-500">נטו לקבלה</div>
          <div class="text-4xl font-bold text-emerald-500">${fmt(res.net)}</div>
          <div class="text-xs text-gray-400 mt-1">שיעור ניכוי: ${res.gross>0?((res.total/res.gross)*100).toFixed(1):0}%</div>
        </div>
        <h3 class="text-sm font-semibold text-gray-700 mb-2">פירוט ניכויים</h3>
        ${[{l:'פנסיה עובד (6%)',v:res.pension,c:'#3B82F6'},{l:'ביטוח לאומי',v:res.ni,c:'#F97316'},{l:'מס בריאות',v:res.health,c:'#EAB308'},{l:'מס הכנסה ('+settings.creditPoints+' נק\')',v:res.incomeTax,c:'#EF4444'}]
          .map(r=>html`<div key=${r.l} class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
            <div class="flex items-center gap-2">
              <div class="w-2.5 h-2.5 rounded-full" style=${{backgroundColor:r.c}}/>
              <span class="text-sm text-gray-700">${r.l}</span>
            </div>
            <div>
              <span class="text-sm font-semibold text-gray-800">${fmt(r.v)}</span>
              <span class="text-xs text-gray-400 mr-1">${res.gross>0?' ('+((r.v/res.gross)*100).toFixed(1)+'%)':''}</span>
            </div>
          </div>`)}
        <div class="flex justify-between items-center pt-3 border-t-2 border-gray-200 font-bold mt-1">
          <span class="text-gray-800">סה"כ ניכויים</span><span class="text-red-600 text-base">${fmt(res.total)}</span>
        </div>
        <div class="mt-3 bg-amber-50 border border-amber-100 rounded-lg p-3 text-xs text-amber-700">
          הערכה בלבד לפי מדרגות 2026. אינו מחליף ייעוץ רואה חשבון. תקרת ב"ל: ₪${NI_CL.toLocaleString()}/חודש.
        </div>
      </div>`:html`
      <div class="text-center py-12 text-gray-400 bg-white rounded-xl border border-gray-100">
        <div class="flex justify-center mb-2 text-gray-300"><${Icon} name="calc" size=${36}/></div><div class="text-sm">הזן ברוטו חודשי לחישוב</div>
      </div>`}
  </div>`;
}

// ── GoogleDriveSection ───────────────────────────────────────
function GoogleDriveSection({settings,setSettings,jobs,shifts,payslips,expenses,setJobs,setShifts,setPayslips,setExpenses}) {
  const [token,  setToken]  = useState(()=>_gToken);
  const [status, setStatus] = useState('');
  const [busy,   setBusy]   = useState(false);

  const clientId = activeGcid(settings);
  const SCOPE    = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar.events';
  const FILE     = 'shifts_backup.json';

  const setTok = t => { if(t) saveGTok(t); else clearGTok(); setToken(t); };
  const gReady = () => window.google&&window.google.accounts&&window.google.accounts.oauth2;

  // Connected Google account details (name/email/photo) — fetched via Drive "about", no extra scopes
  const [acct,setAcct]=useState(()=> (settings&&settings.gAccount)||null);
  useEffect(()=>{
    if(!token) return;
    fetch('https://www.googleapis.com/drive/v3/about?fields=user(displayName,emailAddress,photoLink)',
      {headers:{Authorization:'Bearer '+token}})
      .then(r=>r.json())
      .then(j=>{
        if(j.user&&j.user.emailAddress){
          const a={name:j.user.displayName||'',email:j.user.emailAddress,photo:j.user.photoLink||''};
          setAcct(a);
          setSettings(s=>{
            const p=s.gAccount||{};
            return (p.email===a.email&&p.name===a.name&&p.photo===a.photo)?s:{...s,gAccount:a};
          });
        }
      }).catch(()=>{});
  },[token]);

  const getClient = () => {
    if (_gClient) return _gClient;
    if (!gReady()) return null;
    _gClient = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId.trim(),
      scope: SCOPE,
      callback: r => {
        if (r.error) { setStatus('שגיאה: '+r.error); return; }
        setTok(r.access_token);
        setStatus('מחובר ✓');
        processGcalDelQueue();
      }
    });
    return _gClient;
  };

  const connect = () => {
    if (!gReady()) return alert('ספריית Google טרם נטענה. נסה שוב בעוד שנייה.');
    setSettings(s=>({...s,gConnected:true}));
    const c=getClient(); if(c) c.requestAccessToken({prompt:''});
  };

  // Silent re-connect on load if previously connected (keeps you "logged in")
  useEffect(()=>{
    if (_gToken) { setToken(_gToken); return; }
    if (!settings||!settings.gConnected||!clientId.trim()) return;
    let tries=0;
    const iv=setInterval(()=>{
      if (gReady()) {
        clearInterval(iv);
        const c=getClient(); if(c) c.requestAccessToken({prompt:''});
      } else if(++tries>25) clearInterval(iv);
    },300);
    return ()=>clearInterval(iv);
  },[]);

  // Auto-backup: debounced backup to Drive whenever jobs/shifts change (if enabled and connected)
  const autoRef=useRef(null);
  useEffect(()=>{
    if(!token || !(settings&&settings.autoBackup)) return;
    clearTimeout(autoRef.current);
    autoRef.current=setTimeout(()=>{ backup(); }, 4000);
    return ()=>clearTimeout(autoRef.current);
  },[jobs,shifts,payslips,token]);

  const findFile = async () => {
    const q = encodeURIComponent("name='"+FILE+"' and trashed=false");
    const r = await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)',
      {headers:{Authorization:'Bearer '+token}});
    const j = await r.json();
    return j.files&&j.files[0] ? j.files[0].id : null;
  };

  const backup = async () => {
    if (!token) return;
    setBusy(true); setStatus('מגבה...');
    try {
      const content = JSON.stringify({jobs,shifts,payslips,expenses,settings,exportedAt:new Date().toISOString()},null,2);
      const existId = await findFile();
      if (existId) {
        await fetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(existId)+'?uploadType=media',
          {method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:content});
      } else {
        const b='--BOUND', meta=JSON.stringify({name:FILE,mimeType:'application/json'});
        const body=[b+'\r\nContent-Type: application/json\r\n\r\n'+meta,
                    b+'\r\nContent-Type: application/json\r\n\r\n'+content,b+'--'].join('\r\n');
        await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
          {method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'multipart/related; boundary=BOUND'},body});
      }
      setStatus('גיבוי הושלם ✓ '+new Date().toLocaleTimeString('he-IL'));
    } catch(e) { setStatus('שגיאת גיבוי: '+e.message); }
    setBusy(false);
  };

  const restore = async () => {
    if (!token) return;
    if (!confirm('שחזור יחליף את כל הנתונים הנוכחיים. להמשיך?')) return;
    setBusy(true); setStatus('משחזר...');
    try {
      const id = await findFile();
      if (!id) { setStatus('לא נמצא קובץ גיבוי ב-Drive'); setBusy(false); return; }
      const r = await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media',
        {headers:{Authorization:'Bearer '+token}});
      const d = await r.json();
      const idOk=v=>typeof v==='string'&&/^[A-Za-z0-9_-]+$/.test(v);
      if (Array.isArray(d.jobs))    setJobs(d.jobs.filter(j=>j&&typeof j==='object'));
      if (Array.isArray(d.shifts))  setShifts(d.shifts.filter(s=>s&&typeof s==='object'&&typeof s.date==='string')
        .map(s=>idOk(s.gcalId)?s:{...s,gcalId:undefined}));
      if (Array.isArray(d.payslips))setPayslips(d.payslips.filter(p=>p&&typeof p==='object'&&safeUrl(p.driveLink)&&idOk(p.driveFileId)));
      if (Array.isArray(d.expenses)&&setExpenses)setExpenses(d.expenses
        .filter(x=>x&&typeof x==='object'&&typeof x.date==='string'&&typeof x.amount==='number')
        .map(x=>(x.driveLink&&safeUrl(x.driveLink)&&idOk(x.driveFileId))?x:{...x,driveLink:undefined,driveFileId:undefined}));
      if (d.settings&&typeof d.settings==='object'){
        const {darkMode,gClientId,gConnected,...rest}=d.settings;
        setSettings(s=>({...s,...rest}));
      }
      setStatus('שוחזר בהצלחה ✓');
    } catch(e) { setStatus('שגיאת שחזור: '+e.message); }
    setBusy(false);
  };

  return html`<div class="space-y-3">
    ${token
      ? html`<div class="flex items-center gap-2.5 bg-slate-50 rounded-lg p-2.5">
          ${acct&&acct.photo
            ?html`<img src=${safeUrl(acct.photo)||''} referrerpolicy="no-referrer" alt="" class="w-9 h-9 rounded-full flex-shrink-0"/>`
            :html`<div class="w-9 h-9 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0"><${Icon} name="user" size=${18}/></div>`}
          <div class="min-w-0 flex-1">
            <div class="text-sm font-medium text-gray-800 truncate">${(acct&&acct.name)||'מחובר לחשבון Google'}</div>
            <div class="text-xs text-gray-400 truncate" dir="ltr">${(acct&&acct.email)||''}</div>
          </div>
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 flex-shrink-0" title="מחובר"></span>
        </div>
        <button onClick=${()=>{setTok(null);setAcct(null);setStatus('');setSettings(s=>({...s,gConnected:false,gAccount:null}));}}
          class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-medium hover:bg-gray-200">
          <${Icon} name="x" size=${13}/> התנתק מ-Google</button>
        <div class="grid grid-cols-2 gap-2">
          <button onClick=${backup} disabled=${busy}
            class="bg-emerald-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-emerald-600 disabled:opacity-50 transition-colors">
            ${busy?'...':html`<${Icon} name="cloud" size=${14}/> גבה ל-Drive`}</button>
          <button onClick=${restore} disabled=${busy}
            class="bg-violet-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-violet-600 disabled:opacity-50 transition-colors">
            ${busy?'...':html`<${Icon} name="download" size=${14}/> שחזר מ-Drive`}</button>
        </div>
        <label class="flex items-center justify-between cursor-pointer select-none pt-1">
          <span class="text-sm text-gray-700">גיבוי אוטומטי בכל שינוי</span>
          <input type="checkbox" checked=${!!(settings&&settings.autoBackup)} onChange=${e=>setSettings(s=>({...s,autoBackup:e.target.checked}))} class="w-4 h-4 rounded"/>
        </label>`
      : html`<button onClick=${connect}
          class="w-full bg-blue-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors">
          <${Icon} name="login" size=${14}/> חבר חשבון Google</button>`}
    ${status&&html`<div class=${'text-xs text-center py-1.5 px-3 rounded-lg '+(status.includes('שגיאה')?'bg-red-50 text-red-600':'bg-blue-50 text-blue-700')}>
      ${status}</div>`}
  </div>`;
}

// ── GoogleCalendarSection ────────────────────────────────────
function GoogleCalendarSection({jobs,shifts,setShifts,settings,setSettings}) {
  const [busy,  setBusy]  = useState(false);
  const [status,setStatus]= useState('');
  const [scope, setScope] = useState('month');
  const [fromDate,setFromDate]=useState(todayS());
  const [toDate,  setToDate]  =useState(todayS());
  const [oneDate, setOneDate] =useState(todayS());

  const rem=(settings&&settings.gcalReminders)||{};
  const setRem=(k,v)=>setSettings(s=>({...s,gcalReminders:{dayBefore:true,atStart:true,...(s.gcalReminders||{}),[k]:v}}));
  const buildOverrides=()=>{
    const o=[];
    if(rem.dayBefore!==false) o.push({method:'popup',minutes:1440});
    if(rem.atStart!==false)   o.push({method:'popup',minutes:0});
    return o;
  };

  const syncOne = async (s) => {
    const job=findJob(jobs,s.jobId);
    const isMil=job&&job.rateType==='miluim';
    const title=isMil?'מילואים':'עבודה'+(job?' – '+job.name:'');
    const st=s.startTime||(job&&job.startTime)||'08:00';
    const et=s.endTime||(job&&job.endTime)||'16:00';
    let endDate=s.date;
    if(et<=st){ const nd=new Date(s.date+'T12:00:00'); nd.setDate(nd.getDate()+1); endDate=nd.toISOString().slice(0,10); }
    const ov=buildOverrides();
    const body={
      summary:title, colorId:isMil?'10':'11',
      start:{dateTime:s.date+'T'+st+':00', timeZone:'Asia/Jerusalem'},
      end:{dateTime:endDate+'T'+et+':00', timeZone:'Asia/Jerusalem'},
      reminders:{useDefault:false, overrides:ov}
    };
    const base='https://www.googleapis.com/calendar/v3/calendars/primary/events';
    if(s.gcalId){
      const r=await fetch(base+'/'+encodeURIComponent(s.gcalId),
        {method:'PATCH',headers:{Authorization:'Bearer '+_gToken,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.ok){ const j=await r.json(); return j.id; }
    }
    const r=await fetch(base,
      {method:'POST',headers:{Authorization:'Bearer '+_gToken,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.error) throw new Error(j.error.message||'שגיאה');
    return j.id;
  };

  // One button: adds/updates shifts AND removes deleted ones — only within the chosen range
  const sync = async () => {
    if(!_gToken){ alert('התחבר תחילה ל-Google בכרטיס "גיבוי Google Drive" למעלה'); return; }
    const now=new Date(), y=now.getFullYear(), m=now.getMonth();
    let list, rMin, rMax;
    // Exclusive upper bound: midnight at the start of the day after the last one
    const dayAfter=d=>{const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+1); return x.toISOString();};
    if(scope==='month'){
      list=shifts.filter(s=>{const[a,b]=s.date.split('-').map(Number);return a===y&&b===m+1;});
      rMin=new Date(y,m,1).toISOString(); rMax=new Date(y,m+1,1).toISOString();
    } else if(scope==='future'){
      list=shifts.filter(s=>s.date>=todayS());
      rMin=new Date(todayS()+'T00:00:00').toISOString(); rMax=new Date(Date.now()+2*365*864e5).toISOString();
    } else if(scope==='range'){
      // Tolerate the dates being picked in either order
      const a=fromDate<toDate?fromDate:toDate, b=fromDate<toDate?toDate:fromDate;
      list=shifts.filter(s=>s.date>=a&&s.date<=b);
      rMin=new Date(a+'T00:00:00').toISOString(); rMax=dayAfter(b);
    } else if(scope==='day'){
      list=shifts.filter(s=>s.date===oneDate);
      rMin=new Date(oneDate+'T00:00:00').toISOString(); rMax=dayAfter(oneDate);
    } else {
      list=shifts.slice();
      rMin=new Date(Date.now()-3*365*864e5).toISOString(); rMax=new Date(Date.now()+2*365*864e5).toISOString();
    }
    setBusy(true); setStatus('מסנכרן...');
    try{
      await processGcalDelQueue();
      // 1) add / update events for existing shifts in range
      const idMap={};
      for(const s of list){ idMap[s.id]=await syncOne(s); }
      const updated=shifts.map(x=>idMap[x.id]?{...x,gcalId:idMap[x.id]}:x);
      setShifts(()=>updated);
      // 2) remove orphaned "עבודה" events inside the chosen range (shifts that were deleted)
      const known=new Set(updated.filter(s=>s.gcalId).map(s=>s.gcalId));
      let items=[], pageToken='';
      do{
        const u='https://www.googleapis.com/calendar/v3/calendars/primary/events?maxResults=250&singleEvents=true'
          +'&timeMin='+encodeURIComponent(rMin)+'&timeMax='+encodeURIComponent(rMax)
          +(pageToken?'&pageToken='+encodeURIComponent(pageToken):'');
        const r=await fetch(u,{headers:{Authorization:'Bearer '+_gToken}});
        const j=await r.json();
        if(j.error) throw new Error(j.error.message||'שגיאה');
        items=items.concat(j.items||[]); pageToken=j.nextPageToken||'';
      }while(pageToken);
      const orphans=items.filter(ev=>ev.summary&&(ev.summary.indexOf('עבודה')===0||ev.summary==='מילואים')&&!known.has(ev.id));
      for(const ev of orphans){
        await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events/'+encodeURIComponent(ev.id),
          {method:'DELETE',headers:{Authorization:'Bearer '+_gToken}});
      }
      setStatus('סונכרן ✓ · נוספו/עודכנו '+list.length+' · הוסרו '+orphans.length);
    }catch(e){ setStatus('שגיאה: '+e.message+' (ודא שהפעלת Calendar API וחיברת מחדש)'); }
    setBusy(false);
  };

  return html`<div class="space-y-3">
    <p class="text-xs text-gray-500">סנכרון דו-כיווני בטווח שתבחר: משמרות חדשות יתווספו/יעודכנו ביומן Google כאירועים <span class="text-red-500 font-medium">אדומים</span> (בשעות המשרה), ומשמרות שמחקת יוסרו מהיומן.</p>
    <div class="bg-slate-50 rounded-lg p-3 space-y-2">
      <div class="text-sm font-medium text-gray-700">🔔 התראות יומן (עובדות גם כשהאפליקציה סגורה)</div>
      <label class="flex items-center justify-between cursor-pointer select-none">
        <span class="text-sm text-gray-600">תזכורת יום לפני העבודה</span>
        <input type="checkbox" checked=${rem.dayBefore!==false} onChange=${e=>setRem('dayBefore',e.target.checked)} class="w-4 h-4 rounded"/>
      </label>
      <label class="flex items-center justify-between cursor-pointer select-none">
        <span class="text-sm text-gray-600">תזכורת בתחילת המשמרת (לסמן הגעה)</span>
        <input type="checkbox" checked=${rem.atStart!==false} onChange=${e=>setRem('atStart',e.target.checked)} class="w-4 h-4 rounded"/>
      </label>
      <p class="text-[11px] text-gray-400">ההתראה תופיע ביומן/במסך הנעילה של הטלפון עם שם המשרה. לחיצה עליה תפתח את האפליקציה. יש ללחוץ "סנכרן" למטה כדי להחיל.</p>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">טווח לסנכרון</label>
      <select value=${scope} onChange=${e=>setScope(e.target.value)}
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
        <option value="month">החודש הנוכחי</option>
        <option value="future">מהיום והלאה</option>
        <option value="range">טווח תאריכים שאבחר</option>
        <option value="day">יום מסוים</option>
        <option value="all">כל המשמרות</option>
      </select>
      ${scope==='range'&&html`
        <div class="grid grid-cols-2 gap-2 mt-2">
          <div>
            <span class="block text-xs text-gray-400 mb-1">מתאריך</span>
            <input type="date" value=${fromDate} onChange=${e=>setFromDate(e.target.value)}
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
          </div>
          <div>
            <span class="block text-xs text-gray-400 mb-1">עד תאריך</span>
            <input type="date" value=${toDate} onChange=${e=>setToDate(e.target.value)}
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
          </div>
        </div>`}
      ${scope==='day'&&html`
        <div class="mt-2">
          <span class="block text-xs text-gray-400 mb-1">תאריך</span>
          <input type="date" value=${oneDate} onChange=${e=>setOneDate(e.target.value)}
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
        </div>`}
      ${(()=>{
        // Say up front how many shifts this will touch — the sync also deletes
        // stray events inside the range, so the range is worth being sure about
        const n=scope==='range'
          ? shifts.filter(s=>{const a=fromDate<toDate?fromDate:toDate,b=fromDate<toDate?toDate:fromDate;return s.date>=a&&s.date<=b;}).length
          : scope==='day' ? shifts.filter(s=>s.date===oneDate).length : null;
        if(n===null) return null;
        return html`<div class="text-[11px] text-gray-400 mt-1.5">
          ${n===0?'אין משמרות בטווח הזה — אירועי עבודה שנותרו ביומן בטווח יימחקו'
                 :(n===1?'משמרת אחת תסונכרן':n+' משמרות יסונכרנו')}
        </div>`;
      })()}
    </div>
    <button onClick=${sync} disabled=${busy}
      class="w-full bg-red-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-red-600 disabled:opacity-50 transition-colors">
      ${busy?'...':html`<${Icon} name="calendar" size=${14}/> סנכרן ליומן Google`}</button>
    ${status&&html`<div class=${'text-xs text-center py-1.5 px-3 rounded-lg '+(status.includes('שגיאה')?'bg-red-50 text-red-600':'bg-blue-50 text-blue-700')}>
      ${status}</div>`}
  </div>`;
}

// ── PayslipsPage ─────────────────────────────────────────────
// ── ExpensesPage (out-of-pocket work costs awaiting reimbursement) ──
function ExpensesPage({expenses,setExpenses,jobs,setTab,settings}) {
  const activeJobs=(jobs||[]).filter(j=>!j.deleted);
  const [token,setToken]=useState(()=>_gToken);
  const [date,setDate]  =useState(todayS());
  const [amount,setAmount]=useState('');
  const [desc,setDesc]  =useState('');
  const [jobId,setJobId]=useState((activeJobs[0]&&activeJobs[0].id)||'');
  const [file,setFile]  =useState(null);
  const [busy,setBusy]  =useState(false);
  const [status,setStatus]=useState('');
  const [open,setOpen]  =useState(false);
  const [editId,setEditId]=useState(null);   // null = adding, otherwise editing that expense

  useEffect(()=>{
    const iv=setInterval(()=>{ if(_gToken!==token) setToken(_gToken); },1000);
    return ()=>clearInterval(iv);
  },[token]);

  const resetForm=()=>{
    setEditId(null); setDate(todayS()); setAmount(''); setDesc('');
    setJobId((activeJobs[0]&&activeJobs[0].id)||''); setFile(null); setStatus('');
  };
  const startEdit=x=>{
    setEditId(x.id); setDate(x.date); setAmount(String(x.amount));
    setDesc(x.desc||''); setJobId(x.jobId||''); setFile(null); setStatus('');
    setOpen(true);
  };

  const add=async()=>{
    if(!amount||+amount<=0) return alert('יש להזין סכום תקין');
    if(!date) return alert('יש לבחור תאריך');
    let fileInfo={};
    if(file){
      if(!token) return alert('כדי לצרף תמונה יש להתחבר ל-Google. אפשר גם לשמור בלי תמונה.');
      const okType=(file.type||'').startsWith('image/')||file.type==='application/pdf';
      if(!okType) return alert('ניתן לצרף רק תמונה או PDF');
      if(file.size>15*1024*1024) return alert('הקובץ גדול מדי (מקסימום 15MB)');
    }
    setBusy(true); setStatus(file?'מעלה חשבונית...':'שומר...');
    try{
      if(file){
        const meta={name:'הוצאה_'+date+'_'+file.name, mimeType:file.type||'application/octet-stream'};
        const res=await uploadFileToDrive(file,meta);
        fileInfo={
          driveFileId:res.id,
          driveLink:safeUrl(res.webViewLink)||('https://drive.google.com/file/d/'+encodeURIComponent(res.id)+'/view'),
          fileName:file.name
        };
      }
      if(editId){
        // Replacing the receipt removes the old file so Drive does not collect orphans
        const prev=(expenses||[]).find(x=>x.id===editId);
        if(file&&prev&&prev.driveFileId) await deleteDriveFile(prev.driveFileId);
        setExpenses(list=>list.map(x=>x.id===editId
          ? {...x,date,amount:+amount,desc:desc.trim(),jobId:jobId||null,...fileInfo}
          : x));
        setStatus('עודכן ✓');
      } else {
        setExpenses(list=>[...list,{
          id:genId(),date,amount:+amount,desc:desc.trim(),
          jobId:jobId||null,reimbursed:false,createdAt:new Date().toISOString(),...fileInfo
        }]);
        setStatus('נוסף ✓');
      }
      resetForm(); setOpen(false);
    }catch(e){ setStatus('שגיאה: '+e.message); }
    setBusy(false);
  };

  const del=async(x)=>{
    if(!confirm('למחוק הוצאה זו?')) return;
    if(x.driveFileId) await deleteDriveFile(x.driveFileId);
    setExpenses(list=>list.filter(y=>y.id!==x.id));
  };
  const toggleReimbursed=id=>setExpenses(list=>list.map(x=>x.id===id?{...x,reimbursed:!x.reimbursed}:x));

  const grouped=useMemo(()=>{
    const by={};
    (expenses||[]).forEach(x=>{ const k=x.date.slice(0,7); (by[k]=by[k]||[]).push(x); });
    return Object.keys(by).sort().reverse().map(m=>{
      const [y,mo]=m.split('-').map(Number);
      const items=by[m].sort((a,b)=>a.date<b.date?1:-1);
      return {month:m,label:MONTHS[mo-1]+' '+y,items,
        total:items.reduce((n,x)=>n+(x.amount||0),0),
        pending:items.filter(x=>!x.reimbursed).reduce((n,x)=>n+(x.amount||0),0)};
    });
  },[expenses]);

  const totalPending=(expenses||[]).filter(x=>!x.reimbursed).reduce((n,x)=>n+(x.amount||0),0);

          </div>

        </div>`}

    ${grouped.length===0?html`
      <div class="text-center py-14 text-gray-400 bg-white rounded-xl border border-gray-100">
        <div class="flex justify-center mb-3 text-gray-300"><${Icon} name="wallet" size=${40}/></div>
        <div class="text-sm">אין הוצאות עדיין</div>
      </div>`:
      grouped.map(g=>html`<div key=${g.month} class="space-y-2">
        <div class="flex items-center justify-between px-1">
          <span class="text-xs font-semibold text-gray-400">${g.label}</span>
          <span class="text-xs font-semibold text-gray-600">סה"כ ${fmt(g.total)}${g.pending>0&&g.pending!==g.total?' · ממתין '+fmt(g.pending):''}</span>
        </div>
        ${g.items.map(x=>{
          const job=findJob(jobs,x.jobId);
          return html`<div key=${x.id} class=${'bg-white rounded-xl border p-3 shadow-sm flex items-center gap-3 '+(x.reimbursed?'border-emerald-200':'border-gray-100')}>
            <div class=${'flex-shrink-0 w-9 h-9 rounded-full flex items-center justify-center '+(x.reimbursed?'bg-emerald-50 text-emerald-600':'bg-amber-50 text-amber-600')}>
              <${Icon} name="wallet" size=${17}/>
            </div>
            <div class="flex-1 min-w-0 cursor-pointer" onClick=${()=>startEdit(x)}>

}

// Shared by the upload form and by editing an already-filed payslip, so both
// screens ask the same question in the same words
function ExpenseSettleList({items,unpaid,onToggle}) {
  const paid=items.filter(x=>!unpaid.has(x.id));
  const paidSum=paid.reduce((n,x)=>n+(x.amount||0),0);
  return html`
    <div class="rounded-xl border border-amber-100 bg-amber-50/60 p-3 space-y-2">
      <div class="text-xs font-semibold text-amber-800 flex items-center gap-1.5">
        <${Icon} name="wallet" size=${14}/> החזר הוצאות לחודש זה
      </div>
      <div class="text-[11px] text-amber-700 leading-4">
        התלוש מסמן את כל ההוצאות של החודש כהוחזרו. סמן כאן רק מה ש<b>לא</b> קיבלת בחזרה.
      </div>
      <div class="space-y-1 max-h-44 overflow-y-auto">
        ${items.map(x=>html`
          <label key=${x.id} class="flex items-center gap-2 cursor-pointer select-none text-[11px] bg-white rounded-lg px-2 py-1.5 border border-amber-100">
            <input type="checkbox" checked=${unpaid.has(x.id)} onChange=${()=>onToggle(x.id)} class="w-3.5 h-3.5 rounded flex-shrink-0"/>
            <span class=${'flex-1 min-w-0 truncate '+(unpaid.has(x.id)?'text-amber-700 font-medium':'text-gray-600')}>
              ${x.date.slice(8,10)}/${x.date.slice(5,7)} · ${x.desc||'הוצאה'}
            </span>
            <span class=${'flex-shrink-0 '+(unpaid.has(x.id)?'text-amber-700':'text-gray-400')}>${fmt(x.amount)}</span>
          </label>`)}

      <div class="text-[11px] text-amber-800 border-t border-amber-100 pt-1.5">
        ${unpaid.size===0
          ? 'הכל יסומן כהוחזר — סה"כ '+fmt(paidSum)
          : paid.length+' מתוך '+items.length+' יסומנו כהוחזרו ('+fmt(paidSum)+') · '+unpaid.size+' יישארו ממתינות'}
      </div>

}

// The sentence written into the notes for each reimbursement that did not arrive
function unpaidNote(list) {
  return list.map(x=>'החזר "'+(x.desc||'הוצאה')+'" מ-'+x.date.slice(8,10)+'/'+x.date.slice(5,7)
    +' ('+Math.round(x.amount)+' ש"ח) לא שולם').join('\n');
}
// Notes hold two things: lines this app wrote about unpaid reimbursements, and
// whatever the user typed. Only the first kind is ever rewritten — recognising
// them by their exact shape is what keeps the user's own text safe.
const AUTO_NOTE_RE=/^החזר ".*" מ-\d{2}\/\d{2} \(\d+ ש"ח\) לא שולם$/;
function manualPart(text) {
  return String(text||'').split('\n').filter(l=>!AUTO_NOTE_RE.test(l.trim())).join('\n').trim();
}
// Rebuild the auto lines for the current ticks, keeping the typed text below them
function composeNotes(text, unpaidList) {
  return [unpaidNote(unpaidList), manualPart(text)].filter(Boolean).join('\n');
}

function PayslipsPage({payslips,setPayslips,setShifts,jobs,setTab,settings,expenses,setExpenses}) {
  const activeJobs=(jobs||[]).filter(j=>!j.deleted);
  const [token, setToken] = useState(()=>_gToken);
  // Salary for a month arrives the next one (the 1st or the 10th), so the month
  // being filed is almost always the previous one
  const [month, setMonth] = useState(()=>{
    const n=new Date(); n.setDate(1); n.setMonth(n.getMonth()-1);
    return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
  });
  const [jobId, setJobId] = useState((activeJobs[0]&&activeJobs[0].id)||'');
  const [file,  setFile]  = useState(null);
  const [busy,  setBusy]  = useState(false);
  const [status,setStatus]= useState('');
  const [notes, setNotes] = useState('');
  // Ids of this month's expenses that did NOT come back in this payslip.
  // Empty is the normal case and means the whole month was reimbursed.
  const [unpaid,setUnpaid] = useState(()=>new Set());

  useEffect(()=>{
    const iv=setInterval(()=>{ if(_gToken!==token) setToken(_gToken); },1000);
    return ()=>clearInterval(iv);
  },[token]);

  // The expenses this payslip is expected to settle. An expense with no job on
  // it belongs to no other payslip either, so it is included rather than stranded.
  const monthExpenses=useMemo(()=>
    (expenses||[])
      .filter(x=>x.date.slice(0,7)===month&&(!jobId||!x.jobId||x.jobId===jobId))
      .sort((a,b)=>a.date<b.date?-1:1)
  ,[expenses,month,jobId]);
  // A different month or job means a different list — drop the ticks and the
  // lines that described them, but never the user's own text
  useEffect(()=>{ setUnpaid(new Set()); setNotes(n=>manualPart(n)); },[month,jobId]);
  const toggleUnpaid=id=>{
    const n=new Set(unpaid); n.has(id)?n.delete(id):n.add(id);
    setUnpaid(n);
    setNotes(cur=>composeNotes(cur,monthExpenses.filter(x=>n.has(x.id))));
  };
  const reimbursedNow=monthExpenses.filter(x=>!unpaid.has(x.id));

  // ── Editing an already-filed payslip ──
  const [editId,setEditId]=useState(null);
  const [editNotes,setEditNotes]=useState('');
  const [editUnpaid,setEditUnpaid]=useState(()=>new Set());
  const editSlip=editId?payslips.find(p=>p.id===editId):null;
  const editExpenses=useMemo(()=>!editSlip?[]:(expenses||[])
    .filter(x=>x.date.slice(0,7)===editSlip.month&&(!editSlip.jobId||!x.jobId||x.jobId===editSlip.jobId))
    .sort((a,b)=>a.date<b.date?-1:1)
  ,[expenses,editSlip]);
  const startEdit=p=>{
    setEditId(p.id); setEditNotes(p.notes||'');
    setEditUnpaid(new Set(p.unpaidExpenseIds||[]));
  };
  // Filing a second payslip over a month that already has one is usually a slip
  // of the month picker, so say so before the upload rather than after
  const already=payslips.filter(p=>p.month===month&&(!jobId||!p.jobId||p.jobId===jobId));
  const toggleEditUnpaid=id=>{
    const n=new Set(editUnpaid); n.has(id)?n.delete(id):n.add(id);
    setEditUnpaid(n);
    setEditNotes(cur=>composeNotes(cur,editExpenses.filter(x=>n.has(x.id))));
  };
  const saveEdit=()=>{
    const ids=new Set(editExpenses.map(x=>x.id));
    const stillOwed=[...editUnpaid].filter(id=>ids.has(id));
    if(setExpenses&&ids.size)
      setExpenses(list=>list.map(x=>ids.has(x.id)?{...x,reimbursed:!editUnpaid.has(x.id)}:x));
    setPayslips(list=>list.map(p=>p.id===editId
      ? {...p,notes:editNotes.trim(),unpaidExpenseIds:stillOwed}
      : p));
    setEditId(null);
  };

  const upload = async () => {
    if(!token) return alert('יש להתחבר לחשבון Google תחילה (בהגדרות)');
    if(!file) return alert('יש לבחור קובץ');
    if(!/^\d{4}-\d{2}$/.test(month)) return alert('יש לבחור חודש');
    const okType=(file.type||'').startsWith('image/')||file.type==='application/pdf';
    if(!okType) return alert('ניתן להעלות רק תמונה או קובץ PDF');
    if(file.size>15*1024*1024) return alert('הקובץ גדול מדי (מקסימום 15MB)');
    setBusy(true); setStatus('מעלה...');
    try{
      const jn=(findJob(jobs,jobId)||{}).name||'';
      const meta={name:'תלוש_'+month+(jn?'_'+jn:'')+'_'+file.name, mimeType:file.type||'application/octet-stream'};
      const res=await uploadFileToDrive(file,meta);
      const link=safeUrl(res.webViewLink)||('https://drive.google.com/file/d/'+encodeURIComponent(res.id)+'/view');
      const notPaid=monthExpenses.filter(x=>unpaid.has(x.id)).map(x=>x.id);
      setPayslips(list=>[...list,{id:genId(),month,jobId:jobId||null,name:file.name,
        driveFileId:res.id,driveLink:link,uploadedAt:new Date().toISOString(),
        notes:notes.trim(),unpaidExpenseIds:notPaid}]);
      // Mark that month's shifts as paid — only for the linked job (or all if none chosen)
      setShifts&&setShifts(arr=>arr.map(s=>(s.date.slice(0,7)===month&&(!jobId||s.jobId===jobId))?{...s,isPaid:true}:s));
      // The payslip is also the reimbursement, so the same month's expenses are
      // settled by it — except any explicitly ticked as still owed
      const settled=reimbursedNow.length;
      if(setExpenses&&monthExpenses.length){
        const ids=new Set(monthExpenses.map(x=>x.id));
        setExpenses(list=>list.map(x=>ids.has(x.id)?{...x,reimbursed:!unpaid.has(x.id)}:x));
      }
      setFile(null); setNotes(''); setUnpaid(new Set());
      setStatus('הועלה בהצלחה ✓ — משמרות החודש'+(jn?' של "'+jn+'"':'')+' סומנו כשולם'
        +(settled?' · '+settled+' '+(settled===1?'הוצאה סומנה':'הוצאות סומנו')+' כהוחזרו':'')
        +(notPaid.length?' · '+notPaid.length+' נשארו ממתינות':''));
    }catch(e){ setStatus('שגיאה: '+e.message); }
    setBusy(false);
  };

  const del = async (p) => {
    if(!confirm('למחוק תלוש זה?')) return;
    await deleteDriveFile(p.driveFileId);
    setPayslips(list=>list.filter(x=>x.id!==p.id));
  };

  const grouped = useMemo(()=>{
    const byMonth={};
    payslips.forEach(p=>{ (byMonth[p.month]=byMonth[p.month]||[]).push(p); });
    return Object.keys(byMonth).sort().reverse().map(m=>{
      const [y,mo]=m.split('-').map(Number);
      return {month:m,label:MONTHS[mo-1]+' '+y,items:byMonth[m].sort((a,b)=>a.uploadedAt<b.uploadedAt?1:-1)};
    });
  },[payslips]);

  const COLORS=['#4A9EE0','#2FA8A0','#6E85D9','#9B7FD4','#3FB6CC','#5C8CB0','#C9789F','#D69A5A'];

  return html`<div class="space-y-4">

    <!-- Hero header -->
    <div class="hero hero-band">
      <div class="flex items-center justify-between">
        <div class="min-w-0">
          <div class="text-lg font-extrabold flex items-center gap-2"><${Icon} name="receipt" size=${20}/> תלושי שכר</div>
          <div class="text-xs text-blue-100 mt-1 leading-4">כל התלושים שלך במקום אחד,<br/>מגובים אוטומטית ב-Google Drive</div>
        </div>
        <div class="text-center flex-shrink-0 bg-white/15 rounded-2xl px-4 py-2">
          <div class="text-3xl font-black leading-none">${payslips.length}</div>
          <div class="text-[10px] text-blue-100 mt-1">תלושים</div>
        </div>
      </div>
    </div>

    ${!token?html`
      <div class="bg-amber-50 border border-amber-100 rounded-2xl p-5 text-sm text-amber-700 text-center space-y-3">
        <div class="flex justify-center text-amber-400"><${Icon} name="lock" size=${36}/></div>
        <div>כדי לצרף ולשמור תלושים צריך להתחבר לחשבון Google.</div>
        <button onClick=${()=>googleConnect(settings,t=>setToken(t))} class="bg-blue-500 text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-blue-600 transition-colors"><${Icon} name="login" size=${14}/> התחבר לחשבון Google</button>
      </div>`:html`
      <!-- Add payslip card -->
      <div class="bg-white rounded-2xl border border-gray-100 p-4 shadow-sm space-y-3">
        <h3 class="text-sm font-bold text-gray-700 flex items-center gap-2"><${Icon} name="plus" size=${15}/> הוסף תלוש חדש</h3>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">חודש התלוש</label>
          <div class="grid grid-cols-2 gap-2">
            <select value=${month.slice(5,7)} onChange=${e=>setMonth(month.slice(0,4)+'-'+e.target.value)}
              class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
              ${MONTHS.map((l,i)=>{const v=String(i+1).padStart(2,'0');return html`<option key=${v} value=${v}>${l}</option>`;})}
            </select>
            <select value=${month.slice(0,4)} onChange=${e=>setMonth(e.target.value+'-'+month.slice(5,7))}
              class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">

            </select>
          </div>
        </div>
        ${activeJobs.length>0&&html`<div>
          <label class="block text-xs font-medium text-gray-500 mb-1">משרה (התלוש שייך למשרה זו)</label>
          <select value=${jobId} onChange=${e=>setJobId(e.target.value)}
            class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
            ${activeJobs.map(j=>html`<option key=${j.id} value=${j.id}>${j.name}</option>`)}

        ${monthExpenses.length>0&&html`
          <${ExpenseSettleList} items=${monthExpenses} unpaid=${unpaid} onToggle=${toggleUnpaid}/>`}

          <textarea value=${notes} onInput=${e=>setNotes(e.target.value)} rows="2"

            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm resize-y focus:outline-none focus:ring-2 focus:ring-blue-300"></textarea>
          ${unpaid.size>0&&html`<div class="text-[11px] text-gray-400 mt-1">
            שורות ההחזרים נכתבות ונמחקות לבד לפי הסימון · מה שתכתוב בעצמך יישאר</div>`}
        </div>
        <label class="block border-2 border-dashed border-gray-200 rounded-xl p-5 text-center cursor-pointer hover:border-blue-300 hover:bg-blue-50 transition-colors">

        </label>
        ${already.length>0&&html`
          <div class="text-[11px] text-amber-700 bg-amber-50 border border-amber-100 rounded-xl px-3 py-2 flex items-start gap-1.5">
            <span class="flex-shrink-0 mt-0.5"><${Icon} name="bell" size=${13}/></span>
            <span>
              שים לב — כבר ${already.length===1?'קיים תלוש':'קיימים '+already.length+' תלושים'} לחודש זה
              ${(()=>{const j=activeJobs.length>0&&jobId?findJob(jobs,jobId):null; return j?' עבור "'+j.name+'"':'';})()}.
              אפשר להעלות עוד אחד, או לערוך את הקיים במקום.
            </span>
          </div>`}
        <button onClick=${upload} disabled=${busy||!file}
          class="hero-cta w-full disabled:opacity-40">
          ${busy?'מעלה...':html`<${Icon} name="upload" size=${14}/> העלה תלוש`}</button>
        ${status&&html`<div class=${'text-xs text-center py-2 px-3 rounded-xl '+(status.includes('שגיאה')?'bg-red-50 text-red-600':'bg-emerald-50 text-emerald-700')}>${status}</div>`}
      </div>`}

    <!-- List -->
    ${grouped.length===0?html`
      <div class="text-center py-16 text-gray-400 bg-white rounded-2xl border border-gray-100">
        <div class="flex justify-center mb-3 text-gray-300"><${Icon} name="folder" size=${48}/></div>
        <div class="font-semibold text-gray-500">עדיין אין תלושים</div>
        <div class="text-xs mt-1">התלושים שתעלה יופיעו כאן לפי חודשים</div>
      </div>`:
      html`<div class="space-y-4">
        ${grouped.map((g,gi)=>html`<div key=${g.month} class="space-y-2">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-gray-500 bg-gray-100 rounded-full px-3 py-1">${g.label}</span>
            <div class="flex-1 h-px bg-gray-100"/>
            <span class="text-[10px] text-gray-400">${g.items.length} ${g.items.length===1?'קובץ':'קבצים'}</span>
          </div>
          ${g.items.map((p,pi)=>{const pj=p.jobId?findJob(jobs,p.jobId):null; const c=(pj&&pj.color)||COLORS[(gi+pi)%COLORS.length];return html`
            <div key=${p.id} class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex items-stretch">
              <div class="w-1.5 flex-shrink-0" style=${{backgroundColor:c}}/>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-3 p-3 min-w-0">
                  <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style=${{backgroundColor:c+'22',color:c}}><${Icon} name="file" size=${20}/></div>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm font-bold text-gray-800 truncate">${pj?pj.name:'תלוש'} · ${g.label}</div>
                    <div class="text-xs text-gray-400 truncate">הועלה ${new Date(p.uploadedAt).toLocaleDateString('he-IL')}</div>
                  </div>
                  <a href=${safeUrl(p.driveLink)||'#'} target="_blank" rel="noopener noreferrer"
                    class="flex-shrink-0 bg-blue-50 text-blue-600 rounded-lg px-3 py-1.5 text-xs font-semibold hover:bg-blue-100 transition-colors flex items-center gap-1"><${Icon} name="eye" size=${13}/> צפה</a>
                  <button onClick=${()=>startEdit(p)} title="ערוך הערות והחזרים"
                    class="flex-shrink-0 p-1.5 rounded-lg hover:bg-blue-50 text-gray-400 hover:text-blue-500"><${Icon} name="pencil" size=${16}/></button>
                  <button onClick=${()=>del(p)} class="flex-shrink-0 p-1.5 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-500"><${Icon} name="trash" size=${16}/></button>
                </div>
                ${!!(p.notes||(p.unpaidExpenseIds&&p.unpaidExpenseIds.length))&&html`
                  <div class="px-3 pb-3 -mt-1 space-y-1">
                    ${p.unpaidExpenseIds&&p.unpaidExpenseIds.length>0&&html`
                      <div class="text-[11px] text-amber-700 bg-amber-50 border border-amber-100 rounded-lg px-2 py-1.5 flex items-center gap-1.5">
                        <${Icon} name="wallet" size=${12}/>
                        ${p.unpaidExpenseIds.length===1?'החזר הוצאה אחד לא נכלל':p.unpaidExpenseIds.length+' החזרי הוצאות לא נכללו'}
                      </div>`}
                    ${p.notes&&html`
                      <div class="text-[11px] text-gray-600 bg-gray-50 rounded-lg px-2 py-1.5 whitespace-pre-wrap break-words">${p.notes}</div>`}
                  </div>`}
              </div>
            </div>`;})}
        </div>`)}
      </div>`}

    ${editSlip&&html`
      <${Modal} title="עריכת תלוש" onClose=${()=>setEditId(null)}>
        <div class="space-y-3">
          <div class="text-xs text-gray-500">
            ${(()=>{const j=editSlip.jobId?findJob(jobs,editSlip.jobId):null;
              const [y,mo]=editSlip.month.split('-').map(Number);
              return (j?j.name+' · ':'')+MONTHS[mo-1]+' '+y;})()}
          </div>
          ${editExpenses.length>0
            ? html`<${ExpenseSettleList} items=${editExpenses} unpaid=${editUnpaid} onToggle=${toggleEditUnpaid}/>`
            : html`<div class="text-xs text-gray-400 bg-gray-50 rounded-lg px-3 py-2">אין הוצאות רשומות לחודש זה.</div>`}
          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1">הערות</label>
            <textarea value=${editNotes} onInput=${e=>setEditNotes(e.target.value)} rows="3"
              placeholder="למשל: החזר הדלק לא נכלל, יגיע בתלוש הבא"
              class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm resize-y focus:outline-none focus:ring-2 focus:ring-blue-300"></textarea>
            ${editUnpaid.size>0&&html`<div class="text-[11px] text-gray-400 mt-1">
              שורות ההחזרים נכתבות ונמחקות לבד לפי הסימון · מה שתכתוב בעצמך יישאר</div>`}
          </div>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onClick=${saveEdit}
              class="bg-blue-500 text-white py-2 rounded-lg text-sm font-semibold hover:bg-blue-600">שמור שינויים</button>
            <button onClick=${()=>setEditId(null)}
              class="bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200">ביטול</button>
          </div>
        </div>
      <//>`}
  </div>`;
}

// ── SettingsPage ─────────────────────────────────────────────
function SettingsPage({settings,setSettings,jobs,shifts,setJobs,setShifts,payslips,setPayslips,expenses,setExpenses}) {
  const [showCalc,setShowCalc]=useState(false);
  const [notifPerm,setNotifPerm]=useState(window.Notification?Notification.permission:'unsupported');
  const n=(settings&&settings.notify)||{};
  const setN=(k,v)=>setSettings(s=>({...s,notify:{on:false,before:true,paid:true,worked:true,...(s.notify||{}),[k]:v}}));
  const reqNotif=async()=>{
    if(!window.Notification){ alert('הדפדפן לא תומך בהתראות'); return; }
    let p=Notification.permission;
    if(p!=='granted'){ p=await Notification.requestPermission(); setNotifPerm(p); }
    if(p==='granted'){ setN('on',true); try{new Notification('התראות הופעלו ✓');}catch(e){} }
    else alert('לא ניתן אישור להתראות. יש לאשר בהגדרות הדפדפן.');
  };

  // ── Background push (needs the free Cloudflare Worker) ──
  const [pushBusy,setPushBusy]=useState(false);
  const [pushMsg,setPushMsg]=useState('');
  const [pushOn,setPushOn]=useState(false);
  const pushUrl=((settings&&settings.pushUrl)||'').replace(/\/+$/,'');

  useEffect(()=>{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)) return;
    navigator.serviceWorker.ready
      .then(r=>r.pushManager.getSubscription())
      .then(s=>setPushOn(!!s)).catch(()=>{});
  },[]);

  const enablePush=async()=>{
    if(!pushUrl) return alert('יש להזין תחילה את כתובת שרת ההתראות');
    if(!('serviceWorker' in navigator)||!('PushManager' in window))
      return alert('הדפדפן לא תומך בהתראות רקע. באייפון יש להוסיף את האתר למסך הבית ולפתוח משם.');
    setPushBusy(true); setPushMsg('מפעיל...');
    try{
      let p=Notification.permission;
      if(p!=='granted'){ p=await Notification.requestPermission(); setNotifPerm(p); }
      if(p!=='granted'){ setPushMsg('לא ניתן אישור להתראות'); setPushBusy(false); return; }

      const keyRes=await fetch(pushUrl+'/key');
      const {key}=await keyRes.json();
      const raw=atob(key.replace(/-/g,'+').replace(/_/g,'/'));
      const appKey=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++) appKey[i]=raw.charCodeAt(i);

      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:appKey});
      await syncPush(sub);
      setPushOn(true); setPushMsg('הופעל ✓ ההתראות יגיעו גם כשהאפליקציה סגורה');
    }catch(e){ setPushMsg('שגיאה: '+e.message); }
    setPushBusy(false);
  };

  const syncPush=async(subArg)=>{
    if(!pushUrl) return;
    const reg=await navigator.serviceWorker.ready;
    const sub=subArg||await reg.pushManager.getSubscription();
    if(!sub) return;
    const t=todayS();
    const soon=new Date(); soon.setDate(soon.getDate()+90);
    const until=soon.toISOString().slice(0,10);
    await fetch(pushUrl+'/subscribe',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        sub:sub.toJSON(),
        reminders:(settings&&settings.notify)||{},
        shiftDates:[...new Set(shifts.filter(s=>s.date>=t&&s.date<=until).map(s=>s.date))]
      })
    });
  };

  const disablePush=async()=>{
    setPushBusy(true);
    try{
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.getSubscription();
      if(sub){
        if(pushUrl) await fetch(pushUrl+'/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});
        await sub.unsubscribe();
      }
      setPushOn(false); setPushMsg('כובה');
    }catch(e){ setPushMsg('שגיאה: '+e.message); }
    setPushBusy(false);
  };

  const testPush=async()=>{
    setPushBusy(true); setPushMsg('שולח בדיקה...');
    try{
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.getSubscription();
      if(!sub){ setPushMsg('לא רשום'); setPushBusy(false); return; }
      const r=await fetch(pushUrl+'/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:sub.endpoint})});
      const j=await r.json();
      setPushMsg(j.ok?'נשלח ✓ ההתראה אמורה להופיע':'שגיאה מהשרת: '+(j.error||j.status));
    }catch(e){ setPushMsg('שגיאה: '+e.message); }
    setPushBusy(false);
  };

  // Keep the server's copy of the schedule + upcoming shifts fresh
  useEffect(()=>{
    if(!pushOn||!pushUrl) return;
    const id=setTimeout(()=>{ syncPush().catch(()=>{}); },1500);
    return ()=>clearTimeout(id);
  },[pushOn,pushUrl,shifts,settings&&settings.notify]);

  return html`<div class="space-y-4">
    <h2 class="text-base font-bold text-gray-800">הגדרות</h2>
    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm space-y-3">
      <h3 class="text-sm font-semibold text-gray-700">הגדרות מס</h3>
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm text-gray-700">נקודות זיכוי (מס הכנסה)</div>
          <div class="text-xs text-gray-400">רווק/ה: 2.25 · ילד ראשון: +2.5 · עולה: +3</div>
        </div>
        <input type="number" step="0.25" min="0" max="15" value=${settings.creditPoints}
          onChange=${e=>setSettings(s=>({...s,creditPoints:+e.target.value||0}))}
          class="w-20 border border-gray-200 rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
      <div class="text-xs text-gray-400 bg-slate-50 rounded-lg p-2">נקודת זיכוי = ₪${CVAL}/חודש = ₪${CVAL*12}/שנה</div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm space-y-3">
      <h3 class="text-sm font-semibold text-gray-700 flex items-center gap-1.5"><${Icon} name="bell" size=${15}/> התראות ותזכורות</h3>
      ${notifPerm==='unsupported'
        ? html`<div class="text-xs text-amber-700 bg-amber-50 rounded-lg p-2">הדפדפן במכשיר זה אינו תומך בהתראות.</div>`
        : notifPerm!=='granted'
          ? html`<button onClick=${reqNotif} class="w-full text-sm bg-blue-500 text-white py-2.5 rounded-lg hover:bg-blue-600 font-semibold"><${Icon} name="bell" size=${14}/> הפעל התראות</button>`
          : html`
            <label class="flex items-center justify-between cursor-pointer select-none">
              <span class="text-sm font-medium text-gray-700">התראות פעילות</span>
              <input type="checkbox" checked=${n.on!==false} onChange=${e=>setN('on',e.target.checked)} class="w-4 h-4 rounded"/>
            </label>
            ${n.on!==false&&html`
              <div class="space-y-3 pr-1 border-r-2 border-gray-100">

                <div class="space-y-1 pr-2">
                  <label class="flex items-center justify-between cursor-pointer select-none">
                    <span class="text-sm text-gray-600">תזכורת לפני עבודה</span>
                    <input type="checkbox" checked=${n.before!==false} onChange=${e=>setN('before',e.target.checked)} class="w-4 h-4 rounded"/>
                  </label>
                  ${n.before!==false&&html`
                    <div class="flex items-center gap-2 justify-end pr-4 text-xs text-gray-400 flex-wrap">
                      <span>כמה ימים לפני</span>
                      <input type="number" min="0" max="30" value=${n.beforeDays==null?1:n.beforeDays} onChange=${e=>setN('beforeDays',Math.max(0,+e.target.value||0))}
                        class="w-14 border border-gray-200 rounded-lg px-2 py-1 text-xs text-center focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                      <span>בשעה</span>
                      <input type="time" value=${n.beforeTime||'20:00'} onChange=${e=>setN('beforeTime',e.target.value)}
                        class="border border-gray-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    </div>`}
                </div>

                <div class="space-y-1 pr-2">
                  <label class="flex items-center justify-between cursor-pointer select-none">
                    <span class="text-sm text-gray-600">תזכורת שנייה לפני עבודה</span>
                    <input type="checkbox" checked=${!!n.before2} onChange=${e=>setN('before2',e.target.checked)} class="w-4 h-4 rounded"/>
                  </label>
                  ${n.before2&&html`
                    <div class="flex items-center gap-2 justify-end pr-4 text-xs text-gray-400 flex-wrap">
                      <span>כמה ימים לפני</span>
                      <input type="number" min="0" max="30" value=${n.before2Days==null?2:n.before2Days} onChange=${e=>setN('before2Days',Math.max(0,+e.target.value||0))}
                        class="w-14 border border-gray-200 rounded-lg px-2 py-1 text-xs text-center focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                      <span>בשעה</span>
                      <input type="time" value=${n.before2Time||'20:00'} onChange=${e=>setN('before2Time',e.target.value)}
                        class="border border-gray-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    </div>`}
                </div>

                <div class="space-y-1 pr-2">
                  <label class="flex items-center justify-between cursor-pointer select-none">
                    <span class="text-sm text-gray-600">תזכורת לסמן משמרות ששולמו</span>
                    <input type="checkbox" checked=${n.paid!==false} onChange=${e=>setN('paid',e.target.checked)} class="w-4 h-4 rounded"/>
                  </label>
                  ${n.paid!==false&&html`
                    <div class="flex items-center gap-2 justify-end pr-4 text-xs text-gray-400 flex-wrap">
                      <span>כל חודש ביום</span>
                      <input type="number" min="1" max="31" value=${n.paidDay==null?10:n.paidDay} onChange=${e=>setN('paidDay',Math.min(31,Math.max(1,+e.target.value||1)))}
                        class="w-14 border border-gray-200 rounded-lg px-2 py-1 text-xs text-center focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                      <span>בשעה</span>
                      <input type="time" value=${n.paidTime||'12:00'} onChange=${e=>setN('paidTime',e.target.value)}
                        class="border border-gray-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    </div>`}
                </div>

                <div class="space-y-1 pr-2">
                  <label class="flex items-center justify-between cursor-pointer select-none">
                    <span class="text-sm text-gray-600">לאשר הגעה לעבודה</span>
                    <input type="checkbox" checked=${n.worked!==false} onChange=${e=>setN('worked',e.target.checked)} class="w-4 h-4 rounded"/>
                  </label>
                  ${n.worked!==false&&html`
                    <div class="flex items-center gap-2 justify-end pr-4 text-xs text-gray-400">
                      <span>בשעה</span>
                      <input type="time" value=${n.workedTime||'18:00'} onChange=${e=>setN('workedTime',e.target.value)}
                        class="border border-gray-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-blue-300"/>
                    </div>`}
                </div>

              </div>`}`}

      <div class="border-t border-gray-100 pt-3 space-y-2">
        <div class="text-sm font-medium text-gray-700">📡 התראות רקע (גם כשהאפליקציה סגורה)</div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">כתובת שרת ההתראות</label>
          <input value=${pushUrl} onInput=${e=>setSettings(s=>({...s,pushUrl:e.target.value}))}
            placeholder="https://mishmarot-push.<שם>.workers.dev" dir="ltr"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-300"/>
        </div>
        ${!pushOn
          ? html`<button onClick=${enablePush} disabled=${pushBusy||!pushUrl}
              class="w-full bg-blue-500 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-600 disabled:opacity-50">
              ${pushBusy?'...':'הפעל התראות רקע'}</button>`
          : html`<div class="grid grid-cols-2 gap-2">
              <button onClick=${testPush} disabled=${pushBusy}
                class="bg-emerald-500 text-white py-2 rounded-lg text-sm font-semibold hover:bg-emerald-600 disabled:opacity-50">שלח בדיקה</button>
              <button onClick=${disablePush} disabled=${pushBusy}
                class="bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 disabled:opacity-50">כבה</button>
            </div>`}
        ${pushMsg&&html`<div class=${'text-xs text-center py-1.5 px-3 rounded-lg '+(pushMsg.includes('שגיאה')?'bg-red-50 text-red-600':'bg-blue-50 text-blue-700')}>${pushMsg}</div>`}
      </div>

      <div class="text-[11px] text-gray-400 bg-slate-50 rounded-lg p-2 leading-4">
        ללא שרת התראות, התזכורות מופיעות רק כשהאפליקציה פתוחה. עם שרת — גם כשהיא סגורה. באייפון חובה להוסיף את האתר למסך הבית ולפתוח משם.
      </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <h3 class="text-sm font-semibold text-gray-700 mb-3 flex items-center gap-1.5"><${Icon} name="cloud" size=${15}/> גיבוי Google Drive</h3>
      <${GoogleDriveSection}
        settings=${settings} setSettings=${setSettings}
        jobs=${jobs} shifts=${shifts} payslips=${payslips} expenses=${expenses}
        setJobs=${setJobs} setShifts=${setShifts} setPayslips=${setPayslips} setExpenses=${setExpenses}/>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <h3 class="text-sm font-semibold text-gray-700 mb-3 flex items-center gap-1.5"><${Icon} name="calendar" size=${15}/> סנכרון ליומן Google</h3>
      <${GoogleCalendarSection}
        jobs=${jobs} shifts=${shifts} setShifts=${setShifts} settings=${settings} setSettings=${setSettings}/>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 p-4 shadow-sm">
      <button onClick=${()=>setShowCalc(v=>!v)} class="w-full flex items-center justify-between">
        <h3 class="text-sm font-semibold text-gray-700 flex items-center gap-1.5"><${Icon} name="calc" size=${15}/> מחשבון שכר נטו</h3>
        <span class="text-gray-400 text-xs">${showCalc?'▲ הסתר':'▼ הצג'}</span>
      </button>
      ${showCalc&&html`<div class="mt-3"><${CalcPage} shifts=${shifts} jobs=${jobs} settings=${settings} setSettings=${setSettings}/></div>`}
    </div>

    <div class="text-center text-xs text-gray-400 py-2 leading-5">
      הנתונים שמורים במכשיר וב-Google Drive.<br/>חישובי המס הם הערכות ואינם מהווים ייעוץ מקצועי.
    </div>

    <div class="text-center text-[11px] text-gray-400 pb-2">
      גרסה ${APP_VERSION} · ${(()=>{const p=APP_BUILD.split('-');return p[2]+'.'+p[1]+'.'+p[0];})()}
    </div>
  </div>`;
}

// ── Reminders (fire when app is open/foregrounded) ───────────
function fireNote(title,body,onClick){
  try{
    if(window.Notification&&Notification.permission==='granted'){
      const nt=new Notification(title,{body});
      if(onClick) nt.onclick=()=>{ try{window.focus();}catch(e){} onClick(); try{nt.close();}catch(e){} };
      return true;
    }
  }catch(e){}
  return false;
}
function useReminders(shifts,settings,setShifts){
  useEffect(()=>{
    const n=(settings&&settings.notify)||{};
    if(!n.on) return;
    if(!window.Notification||Notification.permission!=='granted') return;
    const run=()=>{
      const today=todayS();
      const now=new Date();
      const hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      const due=t=>hm>=(t||'00:00');
      const daysAhead=k=>{ const d=new Date(today+'T12:00:00'); d.setDate(d.getDate()+k); return d.toISOString().slice(0,10); };
      const whenTxt=k=> k===0?'היום':k===1?'מחר':'בעוד '+k+' ימים';
      let log={}; try{log=JSON.parse(localStorage.getItem('sw_notified')||'{}');}catch(e){}
      const mark=k=>{ log[k]=today; try{localStorage.setItem('sw_notified',JSON.stringify(log));}catch(e){} };
      // Work reminder 1
      if(n.before!==false && due(n.beforeTime||'20:00') && log.before!==today){
        const bd=n.beforeDays==null?1:n.beforeDays;
        const t=shifts.filter(s=>s.date===daysAhead(bd));
        if(t.length){ if(fireNote('תזכורת עבודה 📅','יש לך '+t.length+' משמרות '+whenTxt(bd))) mark('before'); }
      }
      // Work reminder 2 (optional)
      if(n.before2 && due(n.before2Time||'20:00') && log.before2!==today){
        const bd=n.before2Days==null?2:n.before2Days;
        const t=shifts.filter(s=>s.date===daysAhead(bd));
        if(t.length){ if(fireNote('תזכורת עבודה 📅','יש לך '+t.length+' משמרות '+whenTxt(bd))) mark('before2'); }
      }
      // Paid reminder — monthly on chosen day-of-month
      if(n.paid!==false && due(n.paidTime||'12:00') && log.paid!==today){
        const dim=mDays(now.getFullYear(),now.getMonth());
        const targetDay=Math.min(n.paidDay==null?10:n.paidDay, dim);
        if(now.getDate()===targetDay){
          const unpaid=shifts.filter(s=>s.date<today&&!s.isPaid);
          if(unpaid.length){ if(fireNote('תזכורת תשלום 💰','יש '+unpaid.length+' משמרות שטרם סומנו כשולם')) mark('paid'); }
        }
      }
      if(n.worked!==false && due(n.workedTime||'18:00') && log.worked!==today){
        const tod=shifts.filter(s=>s.date===today);
        if(tod.length){
          const ok=fireNote('אישור הגעה ✅','הגעת היום לעבודה? הקש כאן לסימון ('+tod.length+' משמרות)',()=>{
            const ids=new Set(tod.map(s=>s.id));
            setShifts&&setShifts(arr=>arr.map(x=>ids.has(x.id)?{...x,arrived:true}:x));
            try{alert('סומן: הגעת לעבודה היום ✓');}catch(e){}
          });
          if(ok) mark('worked');
        }
      }
    };
    run();
    const onVis=()=>{ if(document.visibilityState==='visible') run(); };
    document.addEventListener('visibilitychange',onVis);
    const iv=setInterval(run,10*60*1000);
    return ()=>{ document.removeEventListener('visibilitychange',onVis); clearInterval(iv); };
  },[shifts,settings,setShifts]);
}

// ── App ──────────────────────────────────────────────────────
function App() {
  const [jobs,    setJobs]    =useLS('sw_jobs',    []);
  const [shifts,  setShifts]  =useLS('sw_shifts',  []);
  const [payslips,setPayslips]=useLS('sw_payslips',[]);
  const [expenses,setExpenses]=useLS('sw_expenses',[]);
  const [settings,setSettings]=useLS('sw_settings',{creditPoints:2.25,darkMode:false,gClientId:'365339624558-7t7arbt13od0i1frr0i3v0ernhsq6mhv.apps.googleusercontent.com'});
  const [tab,     setTab]     =useState('dashboard');

  const darkMode=!!(settings&&settings.darkMode);
  const toggleDark=()=>setSettings(s=>({...s,darkMode:!s.darkMode}));

  const privacy=!!(settings&&settings.privacy);
  _privacy=privacy;
  const togglePrivacy=()=>setSettings(s=>({...s,privacy:!s.privacy}));

  // Personal greeting: time-of-day + first name of the connected Google account
  const firstName=(((settings&&settings.gAccount&&settings.gAccount.name)||'').trim().split(/\s+/)[0])||'';
  const gHour=new Date().getHours();
  const greet=gHour>=5&&gHour<12?'בוקר טוב':gHour>=12&&gHour<17?'צהריים טובים':gHour>=17&&gHour<21?'ערב טוב':'לילה טוב';
  const greetLine=firstName?greet+' '+firstName:'ניהול הכנסות לשכיר ישראלי';

  // Offline indicator
  const [online,setOnline]=useState(()=>navigator.onLine!==false);
  useEffect(()=>{
    const on=()=>setOnline(true), off=()=>setOnline(false);
    window.addEventListener('online',on); window.addEventListener('offline',off);
    return ()=>{ window.removeEventListener('online',on); window.removeEventListener('offline',off); };
  },[]);

  useReminders(shifts,settings,setShifts);

  // Auto Google sign-in on load: (1) reuse saved token, (2) silent attempt,
  // (3) fallback on first user tap (browsers allow the OAuth popup only on a user gesture)
  useEffect(()=>{
    if(!settings||!settings.gConnected) return;
    const silent=()=>{
      if(_gToken) return;
      try{
        window.google.accounts.oauth2.initTokenClient({
          client_id:activeGcid(settings),
          scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/calendar.events',
          callback:r=>{ if(!r.error){ saveGTok(r.access_token); processGcalDelQueue(); } }
        }).requestAccessToken({prompt:''});
      }catch(e){}
    };
    let tries=0;
    const iv=setInterval(()=>{
      if(window.google&&window.google.accounts&&window.google.accounts.oauth2){
        clearInterval(iv); if(!_gToken) silent();
      } else if(++tries>25) clearInterval(iv);
    },300);
    const onTap=()=>{
      window.removeEventListener('pointerdown',onTap);
      if(!_gToken&&window.google&&window.google.accounts&&window.google.accounts.oauth2) silent();
    };
    window.addEventListener('pointerdown',onTap);
    return ()=>{ clearInterval(iv); window.removeEventListener('pointerdown',onTap); };
  },[]);

  useEffect(()=>{
    document.body.className=darkMode?'bg-slate-50 dark min-h-screen':'bg-slate-50 min-h-screen';
    // Paint the page behind the app too, so iOS overscroll shows theme color instead of white
    document.documentElement.style.backgroundColor=darkMode?'#0E1621':'#F2F6FB';
  },[darkMode]);

  const TABS=[{id:'dashboard',label:'דשבורד',icon:'dashboard'},{id:'shifts',label:'משמרות',icon:'calendar'},{id:'expenses',label:'הוצאות',icon:'wallet'},{id:'payslips',label:'תלושים',icon:'receipt'},{id:'jobs',label:'משרות',icon:'briefcase'},{id:'settings',label:'הגדרות',icon:'settings'}];

  return html`<div class=${'min-h-screen bg-slate-50 '+(darkMode?'dark':'')}>
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
      <div class="max-w-2xl mx-auto px-4">
        <div class="flex items-center justify-between py-3">
          <div>
            <div class="font-bold text-gray-800 flex items-center gap-1.5">
              מעקב משמרות
              ${!online&&html`<span class="text-[10px] font-medium bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full">לא מקוון</span>`}
            </div>
            <div class="text-xs text-gray-400">${greetLine}</div>
          </div>
          <div class="flex items-center gap-3">
            <button onClick=${togglePrivacy}
              class=${'rounded-lg p-2 transition-colors text-gray-500 '+(privacy?'bg-blue-50 text-blue-600':'hover:bg-gray-100')}
              title=${privacy?'הצג סכומים':'הסתר סכומים (מצב פרטיות)'}>
              <${Icon} name=${privacy?'eyeOff':'eye'} size=${18}/></button>
            <button onClick=${toggleDark}
              class=${'rounded-lg p-2 transition-colors text-gray-500 '+(darkMode?'bg-blue-50 text-blue-600':'hover:bg-gray-100')}
              title=${darkMode?'עבור למצב בהיר':'עבור למצב כהה'}>
              <${Icon} name=${darkMode?'sun':'moon'} size=${18}/></button>
            <img src="./icon.jpg" alt="לוגו" class="w-9 h-9 rounded-lg object-cover shadow-sm"/>
          </div>
        </div>
        <nav class="flex -mb-px">
          ${TABS.map(t=>html`
            <button key=${t.id} onClick=${()=>setTab(t.id)}
              class=${'flex-1 min-w-0 flex flex-col items-center justify-center gap-0.5 px-0.5 py-2 border-b-2 transition-colors sm:flex-row sm:gap-1.5 sm:py-2.5 '+(tab===t.id?'border-blue-500 text-blue-600':'border-transparent text-gray-500 hover:text-gray-700')}>
              <${Icon} name=${t.icon} size=${16}/>
              <span class="text-[10px] leading-none font-semibold truncate max-w-full sm:text-xs">${t.label}</span>
            </button>`)}
        </nav>
      </div>
    </header>
    <main class="max-w-2xl mx-auto px-4 py-5">
      <div class="fade">
        ${tab==='dashboard'&&html`<${DashboardPage} shifts=${shifts} setShifts=${setShifts} jobs=${jobs} settings=${settings} payslips=${payslips} expenses=${expenses} setTab=${setTab}/>`}
        ${tab==='shifts'   &&html`<${ShiftsPage}    shifts=${shifts} setShifts=${setShifts} jobs=${jobs}/>`}
        ${tab==='jobs'     &&html`<${JobsPage}       jobs=${jobs}    setJobs=${setJobs} shifts=${shifts} setShifts=${setShifts}/>`}
        ${tab==='payslips' &&html`<${PayslipsPage}   payslips=${payslips} setPayslips=${setPayslips} setShifts=${setShifts} jobs=${jobs} setTab=${setTab} settings=${settings} expenses=${expenses} setExpenses=${setExpenses}/>`}
        ${tab==='expenses' &&html`<${ExpensesPage}   expenses=${expenses} setExpenses=${setExpenses} jobs=${jobs} setTab=${setTab} settings=${settings}/>`}
        ${tab==='settings' &&html`<${SettingsPage}   settings=${settings} setSettings=${setSettings} jobs=${jobs} shifts=${shifts} setJobs=${setJobs} setShifts=${setShifts} payslips=${payslips} setPayslips=${setPayslips} expenses=${expenses} setExpenses=${setExpenses}/>`}
      </div>
    </main>
  </div>`;
}

render(html`<${App}/>`, document.getElementById('root'));
// The app is on screen - the boot screen has done its job
(function(){ const b=document.getElementById('boot'); if(b) b.remove(); })();
</script>
</body>
</html>
